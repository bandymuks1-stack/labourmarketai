# Sweden supply freshness cadence — V8 §10 / docs/operations/sweden-freshness-cadence-v1.md
#
# INERT BY DEFAULT. This workflow no-ops until the owner performs BOTH
# console actions (never done by an agent):
#   secrets:   SUPABASE_SERVICE_ROLE_KEY, NEXT_PUBLIC_SUPABASE_URL
#   variables: VACANCY_SOURCE_ARBETSFORMEDLINGEN_ENABLED=true
#              VACANCY_SCHEDULE_ENABLED=true
#
# It invokes EXACTLY the canonical operator runner — the same bounded windows,
# cursor discipline, lifecycle withdrawals, chunked reads/writes and failure
# semantics a human operator gets. No new importer, no relaxed gate.
# Kill switch: unset/false VACANCY_SCHEDULE_ENABLED (one console action).
# Failure surface: red workflow run + the cursor's own consecutive_failures.
#
# The scheduled cron ALWAYS runs the stream (delta) channel. A manual
# workflow_dispatch may select the snapshot channel instead — the registry's
# documented cold-start / reconciliation act (runOnce: never on a schedule).
# Reconciliation is required after a transformVersion bump: the delta stream
# only re-sees ads the publisher touches, so stored rows tagged by an older
# categorizer are otherwise unreachable (observed post-#1158: 6,912 rows
# stranded on transform v1 with polluted profession tags).
name: sweden-supply-cadence

on:
  schedule:
    - cron: "17 5,11,17 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Import channel: stream = bounded delta poll; snapshot = one bounded session of the cold-start/reconciliation walk (repeat until caughtUp)"
        type: choice
        options:
          - stream
          - snapshot
        default: stream

concurrency:
  group: sweden-supply-cadence
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    # 45, not 15: the snapshot endpoint offers no offset parameter, so a
    # reconciliation-walk session at record-offset N must re-stream and skip
    # the entire N-record prefix (~11 KB/record) before its bounded 5,000-record
    # slice — deep-offset sessions were observed exceeding 15 minutes and being
    # killed mid-write (runs 31815262743 / 31816633220, 2026-08-14). Stream
    # delta sessions still finish in well under 15 minutes; the cap only needs
    # to cover the walk's worst case.
    timeout-minutes: 45
    steps:
      - name: Kill switch / configuration gate
        id: gate
        env:
          SCHEDULE_ENABLED: ${{ vars.VACANCY_SCHEDULE_ENABLED }}
          PROVIDER_ENABLED: ${{ vars.VACANCY_SOURCE_ARBETSFORMEDLINGEN_ENABLED }}
          HAS_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          HAS_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}
        run: |
          if [ "$SCHEDULE_ENABLED" != "true" ] || [ "$PROVIDER_ENABLED" != "true" ] || [ "$HAS_KEY" != "true" ] || [ "$HAS_URL" != "true" ]; then
            echo "configuration_gated=true" >> "$GITHUB_OUTPUT"
            echo "Inert: schedule/provider variables or secrets not configured. This is the designed no-op state."
          else
            echo "configuration_gated=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.configuration_gated == 'false'

      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.configuration_gated == 'false'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.configuration_gated == 'false'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.gate.outputs.configuration_gated == 'false'
        run: pnpm install --frozen-lockfile

      - name: Bounded stream import (canonical operator runner)
        if: steps.gate.outputs.configuration_gated == 'false'
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VACANCY_SOURCE_ARBETSFORMEDLINGEN_ENABLED: "true"
          # Schedule events carry no inputs — empty falls back to stream, so
          # the cron can never run the snapshot channel.
          IMPORT_CHANNEL: ${{ inputs.channel || 'stream' }}
        run: |
          # pipefail is load-bearing: without it the pipeline's exit status is
          # tee's (always 0), so a runner crash still shows a green check.
          # Observed 2026-08-14 (run 31820380678): the runner threw
          # count_failed:unknown, the artifact was empty, the run stayed green.
          # The script itself also exits non-zero when the SESSION fails
          # (runner_exception / fetch_failed / blocked) after printing its
          # accounting — observed 2026-08-14 (run 31826082813): the session
          # ended runner_exception (vacancy_persist_insert_failed:57014) with
          # an untouched cursor, yet the check stayed green because the script
          # exited 0.
          set -o pipefail
          pnpm tsx --conditions=react-server scripts/vacancy-operator-run.ts \
            --provider arbetsformedlingen --channel "$IMPORT_CHANNEL" --mode persist \
            --apply --i-understand-this-writes-production | tee run-accounting.json

      - name: Upload accounting artifact
        # always(): the runner exits non-zero on a failed session AFTER
        # printing its accounting — the artifact must survive red runs, since
        # a red run is exactly when the accounting matters most.
        if: always() && steps.gate.outputs.configuration_gated == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: sweden-run-accounting-${{ github.run_id }}
          path: apps/web/run-accounting.json
          retention-days: 30
