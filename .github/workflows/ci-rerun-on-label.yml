# Re-run a pull request's FAILED CI jobs when the label `ci:rerun` is added.
#
# Why: the coordinator session's GitHub App token cannot re-run jobs
# ("403 Resource not accessible by integration"), so a runner fault used to
# force a code change or an empty commit just to re-run CI. Adding a label is
# something that token can do; this workflow turns the label into a re-run.
#
# Scope, kept as narrow as possible:
# - only `actions: write` (re-run) and `pull-requests: write` (remove the label);
#   no contents, secrets or deploy permissions;
# - only pull requests whose head branch is in THIS repository (never forks);
# - only runs whose head SHA equals the pull request's current head SHA;
# - only FAILED or CANCELLED runs, and only their failed jobs (`--failed`);
# - it never changes code, never approves, never merges, never touches main.
# The label is removed at the end so the next addition triggers again.
name: ci-rerun-on-label

# pull_request_target, not pull_request: the workflow must come from main.
# With pull_request GitHub reads it from the PR's test-merge commit, which can
# be stale and predate this file (seen on #3361: merge ref built on 940b0f97),
# so the label silently did nothing. This job never checks out or runs PR code;
# it only calls the REST API, so the target-branch context is safe here.
on:
  pull_request_target:
    types: [labeled]

permissions:
  actions: write
  pull-requests: write

concurrency:
  group: ci-rerun-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rerun:
    if: >-
      github.event.label.name == 'ci:rerun' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Re-run failed jobs of this pull request's current head
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
            --jq '[.workflow_runs[]
                   | select(.event == "pull_request")
                   | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
                   | select(.name != "ci-rerun-on-label")
                   | .id] | unique | .[]')
          if [ -z "$ids" ]; then
            echo "No failed or cancelled runs on ${HEAD_SHA}; nothing to re-run."
          fi
          for id in $ids; do
            echo "Re-running failed jobs of run ${id} (head ${HEAD_SHA})"
            gh api -X POST "repos/${REPO}/actions/runs/${id}/rerun-failed-jobs" || echo "run ${id}: re-run refused (already running or too old)"
          done
      - name: Remove the label
        if: always()
        run: gh api -X DELETE "repos/${REPO}/issues/${PR}/labels/ci:rerun" || true
