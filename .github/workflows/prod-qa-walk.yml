name: prod-qa-walk
# The spec in the run title lets acceptance-campaign.yml attribute a run that reached production
# even when it left no artifact.
run-name: prod-qa-walk ${{ github.event_name == 'workflow_dispatch' && inputs.spec || github.event_name }}

# PRODUCTION SIGNED-IN QA, without an agent ever holding a production key
# (owner programme 2026-10-12 §10). Before this, a signed-in production walk
# needed an agent to read the service-role key from a local env file, and the
# security classifier rightly refused that. Here the keys stay in GitHub:
# the run provisions/mints sessions ONLY for the hard-coded synthetic allowlist
# in `apps/web/lib/testing/prod-qa-guard.ts` (marked app_metadata.qa_synthetic,
# owning only QA-SYNTHETIC organizations), drives the real production site in a
# real browser, and uploads a JSON result — never a screenshot (public repo),
# a session file or a trace.
#
# Triggers: manual dispatch, a debounced post-merge walk and one daily
# scheduled walk (see CADENCE below). The `production-qa` environment is where
# the owner can add a required reviewer; if one is set, the automatic runs wait
# for that click too (up to the environment's wait limit) instead of walking
# unattended.
#
# Needs (names only):
#   secrets.NEXT_PUBLIC_SUPABASE_URL      (exists)
#   secrets.SUPABASE_SERVICE_ROLE_KEY     (exists)
#   vars.PROD_QA_ANON_KEY                 the project's PUBLISHABLE anon key —
#                                         the same value every browser receives;
#                                         a variable, not a secret.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Walk to run"
        type: choice
        default: brigade-formation
        options:
          - brigade-formation
          - employee-beta-gate
          - role-routes
          - chat-continuity
          - journal-confirm
          - calendar-planning
          # CAL-8 rota / shift-pattern walk (weekly + N-on/M-off, collision warns, UI cancel). Dispatch only.
          - rota-repeat
          - marketplace
          - agency-chain
          - learning-practice
          - sectors-languages
          - chat-confirm-once
          - living-cv-growth
          - staff-review-notice
          - manager-chat
          - mobile-surfaces
          - recognition-chain
          - mcp-chain
          - mcp-agents
          - project-context
          - worker-identity-split
          - company-chain
          - project-execution
          - org-roster
          - marketplace-goods-services
          - orders-bookings
          - documents-approvals
          - jobs-search
          - notifications-inapp
          - billing-test-mode
          - profile-cv-history
          - search-support-privacy
          - public-org-locales
          # Read-only admin console walk: the non-admin denial runs now; the admin part skips
          # (NOT VERIFIED) until an owner-approved admin QA session exists. Dispatch only.
          - admin-console
      budget_override:
        description: "Run even if the 24 h production-walk budget is used up (owner only)"
        type: boolean
        default: false

  # CADENCE (2026-10-16, Vercel Hobby Active-CPU pause). Production walks are
  # Vercel compute: every document a walk loads is a signed-in, force-dynamic
  # render (measured locally: ~255 ms CPU and ~725 kB HTML per dashboard
  # document). Instead of ad-hoc bursts (228 manual walks 2026-10-12..15, median
  # 177 s apart) the routine signal comes from two automatic triggers:
  #   - push to main touching the product → ONE `role-routes` walk (28 routes ×
  #     5 roles) 120 min after the LAST push of a merge burst (debounced below);
  #     measured on main 2026-10-09..16: ~3 such bursts a day (21 in 7.1 days);
  #   - one scheduled walk a day, rotating through every spec (full catalogue
  #     every 19 days).
  # Manual dispatch is unchanged for targeted checks.
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
  # 2026-10-17 (Supabase log-ingestion quota, 2.22 GB/month on the Free plan): one signed-in walk loads
  # ~36 Supabase calls per dashboard document, so the eight walks of 2026-10-17 alone wrote 23,400 of the
  # day's 25,200 edge-log entries. The routine signal is now ONE rotating walk a WEEK (Sunday 03:41 UTC)
  # plus the debounced post-merge role-routes walk; the full catalogue is still available on dispatch.
  schedule:
    - cron: "41 3 * * 0"

permissions:
  contents: read

jobs:
  # A merge burst produces ONE walk: every newer push cancels the waiting
  # debounce of the previous one (cancel-in-progress), so only the last push's
  # run reaches `walk`. The wait also covers the Vercel production build.
  # Manual and scheduled runs pass straight through.
  debounce:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    concurrency:
      group: prod-qa-walk-debounce-${{ github.event_name == 'push' && 'push' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    outputs:
      spec: ${{ steps.pick.outputs.spec }}
    steps:
      - name: Wait for the merge burst to settle (push only)
        if: github.event_name == 'push'
        run: sleep 7200
      - name: Pick the walk
        id: pick
        shell: bash
        env:
          INPUT_SPEC: ${{ inputs.spec }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ROTATION=(brigade-formation employee-beta-gate role-routes chat-continuity journal-confirm calendar-planning marketplace agency-chain learning-practice sectors-languages chat-confirm-once living-cv-growth staff-review-notice manager-chat mobile-surfaces recognition-chain mcp-chain mcp-agents project-context worker-identity-split company-chain project-execution org-roster marketplace-goods-services orders-bookings documents-approvals jobs-search notifications-inapp profile-cv-history search-support-privacy public-org-locales)
          case "$EVENT" in
            workflow_dispatch) spec="$INPUT_SPEC" ;;
            push) spec=role-routes ;;
            schedule) spec="${ROTATION[$(( 10#$(date -u +%U) % ${#ROTATION[@]} ))]}" ;;
            *) echo "::error::unexpected event $EVENT"; exit 1 ;;
          esac
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          echo "walk: $spec (event: $EVENT)" >> "$GITHUB_STEP_SUMMARY"

  # PRODUCTION COMPUTE BUDGET (2026-10-16). Every walk drives a real browser
  # through signed-in, force-dynamic dashboard pages on the production Vercel
  # deployment, and each full document load ships the dashboard shell (~615 kB
  # of client messages alone, lt). 228 walks ran 2026-10-12..15 (43-64 a day);
  # Supabase edge logs show the Vercel-originated calls rising from 19.7k
  # (2026-10-09, before the first walk) to 91.3k (2026-10-14) with the busiest
  # hours matching the walk dispatch hours, and the Hobby team was paused on
  # 2026-10-15 for Fluid Active CPU. This job refuses a walk once
  # PROD_QA_WALK_DAILY_BUDGET walks have STARTED in the last 24 h, before any
  # install, session mint or production request. `budget_override` is the
  # explicit escape hatch. Counting reads only this workflow's run list.
  budget:
    # After the debounce, so a cancelled merge-burst run never counts or spends the budget.
    needs: debounce
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    # AUTOMATIC BRAKES (owner order 2026-10-23, after one brigade walk made ~8,100 Supabase requests in
    # 6.5 min — run 39795574869). A walk starts only when ALL of these hold; each refusal prints `::error::`
    # with its reason, before any install, session mint or production request. Thresholds live in ONE place,
    # `.github/scripts/walk-brakes.mjs` THRESHOLDS (unit-tested in apps/web/lib/guards/walk-brakes.test.ts):
    #   (a) health   3 x GET https://labourmarket.ai/api/health, 5 s apart: EVERY sample must be HTTP 200
    #                with ok=true, checks.db.ms <= 1500, checks.auth.ms <= 1500 and vacancyFreshness
    #                answered (ok=true). budget_override does NOT lift it. Re-checked in the walk job right
    #                before the session mint (the walk may have queued behind another one).
    #   (b) errors   the last 2 walks that reached production both failed in their FIRST step, or with
    #                infrastructure / 5xx errors (mint failure, no result file, 5xx / net::ERR / timeout
    #                markers), and the latest ended < 60 min ago -> refuse. After the 60 min cool-down one
    #                probe walk may run (circuit breaker; it never locks out for good). A product assertion
    #                failing later in a walk is not an infrastructure signal. budget_override lifts it.
    #   (c) supabase OPTIONAL, only with secret SUPABASE_ACCESS_TOKEN: Supabase edge answers in the last
    #                15 min above 25 x 5xx or 10 x 429 -> refuse. No token / unreadable logs: skipped with a
    #                notice. budget_override lifts it.
    #   (d) gap      >= 180 s between the end of the previous walk and the session mint of the next one,
    #                enforced in the WALK job after its concurrency wait (the only place it can hold): it
    #                waits out the remainder instead of refusing, because a refusal there would stop the
    #                acceptance campaign's chain. budget_override does NOT lift it.
    #   (e) deploy   no deploy-vps.yml run in progress or queued, and none ended < 5 min ago: the
    #                blue/green switch runs two Next servers on one origin, so a walk then measures the
    #                deploy (run 39978076973: Cloudflare 522, 45 s timeouts, while Supabase was clean).
    #                budget_override does NOT lift it. Re-checked in the walk job before the session mint.
    #   (f) budget   PROD_QA_WALK_DAILY_BUDGET walks that reached production in 24 h (below).
    env:
      # Owner allowed up to 200 (2026-10-23, #2659) once a controlled measurement proves it safe.
      # Measured after the fan-out fix (#2705): the heaviest walk (brigade-formation, run 39985839991)
      # = ~5.7k Supabase requests in ~3.5 min, 0 x 5xx, 0 x 429 (before: 8.1k in 6.5 min). Set to 48 —
      # not 200 — because an origin stall on 2026-10-23 13:50 happened while /api/health still passed, so
      # the health brake cannot catch that kind of stall until its cause is fixed. Raise after that.
      PROD_QA_WALK_DAILY_BUDGET: "48"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: "Brake (a): production health (the override does not lift it)"
        run: node .github/scripts/walk-brakes.mjs health

      - name: "Brake (e): no production deploy running or just finished (the override does not lift it)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/walk-brakes.mjs deploy

      - name: "Brake (b): the last walks did not fail for infrastructure"
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.budget_override }}
        run: node .github/scripts/walk-brakes.mjs errors

      - name: "Brake (c): Supabase edge 5xx / 429 (optional, needs SUPABASE_ACCESS_TOKEN)"
        env:
          OVERRIDE: ${{ inputs.budget_override }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node .github/scripts/walk-brakes.mjs supabase

      - name: Count production walks in the last 24 h
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.budget_override }}
        run: |
          set -euo pipefail
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          # A run CONSUMES the budget only when it reached production. Runs this
          # job refused, runs cancelled before the walk (a superseded pending
          # run, a debounced merge burst) and runs still waiting for the
          # environment never touched production and do not count (counting
          # them made each refused re-dispatch extend its own lock-out).
          # At 200 walks a day the former count (one jobs API call per run in
          # 24 h, ~200 calls per check) would pass the GITHUB_TOKEN rate limit;
          # walk-brakes.mjs counts finished walks from their artifacts
          # (prod-qa-<spec>-<run id>, uploaded by every walk job) in a few calls
          # and reads only the runs still in flight one by one.
          used=$(node .github/scripts/walk-brakes.mjs count | sed -n 's/^used=//p')
          [ -n "${used}" ] || { echo "::error::could not count the production walks of the last 24 h"; exit 1; }
          echo "production walks that reached production since ${since}: ${used} (budget ${PROD_QA_WALK_DAILY_BUDGET})" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${used}" -ge "${PROD_QA_WALK_DAILY_BUDGET}" ]; then
            if [ "${OVERRIDE}" = "true" ]; then
              echo "::warning::budget exceeded; running because budget_override=true"
              exit 0
            fi
            echo "::error::24 h production-walk budget used (${used}/${PROD_QA_WALK_DAILY_BUDGET}). Batch the check into a walk already run, run it locally, or re-dispatch with budget_override=true."
            exit 1
          fi

  walk:
    needs: [debounce, budget]
    # One walk at a time against the shared synthetic cast (unchanged).
    concurrency:
      group: prod-qa-walk
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-qa
    permissions:
      contents: read
      actions: read # the gap brake reads the previous walk's end time
    env:
      PROD_QA_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      PROD_QA_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PROD_QA_ANON_KEY: ${{ vars.PROD_QA_ANON_KEY }}
      E2E_NO_SERVER: "1"
      E2E_BASE_URL: https://labourmarket.ai
      PROD_QA_WALK: "1"
    steps:
      - uses: actions/checkout@v4

      # The brakes again, AFTER the concurrency wait and BEFORE anything touches
      # production: the budget job's answers may be minutes old by now. The gap
      # waits first; the deploy and health checks run last, right before the
      # session mint. None is lifted by budget_override.
      - name: "Brake (d): minimum gap after the previous walk (waits)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/walk-brakes.mjs gap

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: "Brake (e): no production deploy running or just finished"
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/walk-brakes.mjs deploy

      - name: "Brake (a): production health, right before the walk"
        run: node .github/scripts/walk-brakes.mjs health

      - name: Provision + mint the synthetic cast (allowlist only)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROD_QA_ANON_KEY}" ]; then
            echo "::error::vars.PROD_QA_ANON_KEY is not set (the publishable anon key)"; exit 1
          fi
          cd apps/web
          mint() {
            PROD_QA_PROVISION_IDENTITY="$1" pnpm exec tsx scripts/prod-qa-provision.ts --i-understand-production
            PROD_QA_IDENTITY="$1" PROD_QA_STORAGE_SLOT="$2" pnpm exec tsx scripts/prod-qa-mint-session.ts
          }
          mint "qa.owner+multiw@labourmarket.ai"   owner
          mint "qa.manager+multiw@labourmarket.ai" manager
          mint "qa.worker+multiw@labourmarket.ai"  worker
          mint "qa.worker+goal3@labourmarket.ai"   worker2
          mint "qa.agency+multiw@labourmarket.ai"  agency
          # employee-beta-gate.spec.ts reads the original single-worker file.
          install -m 600 tests/e2e/.storage-state.prod-qa.worker2.json tests/e2e/.storage-state.prod-qa.json

      - name: Walk
        shell: bash
        env:
          # The addressed invitee of staff-review-notice: the second synthetic
          # worker minted above (same allowlisted identity, no new account).
          PROD_QA_INVITEE_EMAIL: qa.worker+goal3@labourmarket.ai
        run: |
          set -uo pipefail
          cd apps/web
          case "${{ needs.debounce.outputs.spec }}" in
            brigade-formation) SPEC=tests/e2e/prod-brigade-formation.spec.ts ;;
            employee-beta-gate) SPEC=tests/e2e/employee-beta-gate.spec.ts ;;
            role-routes) SPEC=tests/e2e/prod-role-routes.spec.ts ;;
            chat-continuity) SPEC=tests/e2e/prod-chat-continuity.spec.ts ;;
            journal-confirm) SPEC=tests/e2e/prod-journal-confirm.spec.ts ;;
            calendar-planning) SPEC=tests/e2e/prod-calendar-planning.spec.ts ;;
            rota-repeat) SPEC=tests/e2e/prod-rota-repeat.spec.ts ;;
            marketplace) SPEC=tests/e2e/prod-marketplace.spec.ts ;;
            agency-chain) SPEC=tests/e2e/prod-agency-chain.spec.ts ;;
            learning-practice) SPEC=tests/e2e/prod-learning-practice.spec.ts ;;
            sectors-languages) SPEC=tests/e2e/prod-sectors-languages.spec.ts ;;
            chat-confirm-once) SPEC=tests/e2e/prod-chat-confirm-once.spec.ts ;;
            living-cv-growth) SPEC=tests/e2e/prod-living-cv-growth.spec.ts ;;
            staff-review-notice) SPEC=tests/e2e/prod-staff-review-notice.spec.ts ;;
            manager-chat) SPEC=tests/e2e/prod-manager-chat.spec.ts ;;
            mobile-surfaces) SPEC=tests/e2e/prod-mobile-surfaces.spec.ts ;;
            recognition-chain) SPEC=tests/e2e/prod-recognition-chain.spec.ts ;;
            mcp-chain) SPEC=tests/e2e/prod-mcp-chain.spec.ts ;;
            mcp-agents) SPEC=tests/e2e/prod-mcp-agents.spec.ts ;;
            project-context) SPEC=tests/e2e/prod-project-context.spec.ts ;;
            worker-identity-split) SPEC=tests/e2e/prod-worker-identity-split.spec.ts ;;
            company-chain) SPEC=tests/e2e/prod-company-chain.spec.ts ;;
            project-execution) SPEC=tests/e2e/prod-project-execution.spec.ts ;;
            org-roster) SPEC=tests/e2e/prod-org-roster.spec.ts ;;
            marketplace-goods-services) SPEC=tests/e2e/prod-marketplace-goods-services.spec.ts ;;
            orders-bookings) SPEC=tests/e2e/prod-orders-bookings.spec.ts ;;
            documents-approvals) SPEC=tests/e2e/prod-documents-approvals.spec.ts ;;
            jobs-search) SPEC=tests/e2e/prod-jobs-search.spec.ts ;;
            notifications-inapp) SPEC=tests/e2e/prod-notifications-inapp.spec.ts ;;
            # Stripe TEST pilot walk: dispatch only after the owner arms test mode (lm-stripe-arm.sh test); never in the rotation.
            billing-test-mode) SPEC=tests/e2e/prod-billing-test-mode.spec.ts ;;
            profile-cv-history) SPEC=tests/e2e/prod-profile-cv-history.spec.ts ;;
            search-support-privacy) SPEC=tests/e2e/prod-search-support-privacy.spec.ts ;;
            public-org-locales) SPEC=tests/e2e/prod-public-org-locales.spec.ts ;;
            admin-console) SPEC=tests/e2e/prod-admin-console.spec.ts ;;
            *) echo "::error::unknown walk '${{ needs.debounce.outputs.spec }}'"; exit 1 ;;
          esac
          # RESULT HONESTY (2026-10-16). Two defects lived in the two lines that
          # used to be here:
          #  1. `--reporter=list,json > prod-qa-result.json` sent BOTH reporters
          #     to stdout, so the uploaded "JSON result" began with the list
          #     reporter's text and was not parseable JSON (run 38799693673:
          #     270 kB, `JSON.parse` fails at byte 1). The JSON reporter now
          #     writes its own file; the list output goes to a separate log
          #     artefact (same content the old file carried — no new exposure).
          #  2. `echo "exit=$?"` was the step's last command. A failing walk
          #     still failed the step only because GitHub's `shell: bash`
          #     injects `-e`; `set -uo pipefail` alone would have turned every
          #     failure green, and on failure the summary line never ran. The
          #     exit code is now captured, written to the summary and returned
          #     explicitly, whatever shell flags the runner adds.
          code=0
          PLAYWRIGHT_JSON_OUTPUT_FILE="$GITHUB_WORKSPACE/prod-qa-result.json" \
            pnpm exec playwright test "$SPEC" --project=chromium --trace=off --reporter=list,json \
            > "$GITHUB_WORKSPACE/prod-qa-walk.log" 2>&1 || code=$?
          # Counts only (no titles, no messages) into the run summary.
          node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).stats;console.log(`passed=${s.expected} failed=${s.unexpected} flaky=${s.flaky} skipped=${s.skipped}`)' \
            "$GITHUB_WORKSPACE/prod-qa-result.json" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "result JSON missing or unreadable" >> "$GITHUB_STEP_SUMMARY"
          echo "walk exit=${code}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${code}" -ne 0 ]; then
            echo "::error::production walk failed (exit ${code}); see the prod-qa artefact"
          fi
          exit "${code}"

      - name: Destroy session files (always)
        if: always()
        shell: bash
        run: rm -f apps/web/tests/e2e/.storage-state.prod-qa*.json

      # The repository is PUBLIC, so its artifacts are readable by any signed-in
      # GitHub user. Screenshots of production pages can show real companies'
      # open needs next to the synthetic cast, so they are NOT published — only
      # the step-level JSON result (titles, pass/fail, durations). A failing
      # assertion message names the testid and the expected text, nothing more.
      # `prod-qa-walk.log` is the list reporter's text — exactly what used to be
      # glued to the front of prod-qa-result.json, now in its own file.
      # Sessions never outlive the walk: every minted session's refresh token is
      # revoked at Supabase and every session file deleted, pass or fail
      # (scripts/prod-qa-revoke-sessions.ts prints counts only).
      - name: Revoke and delete the synthetic sessions
        if: always()
        shell: bash
        run: |
          cd apps/web
          pnpm exec tsx scripts/prod-qa-revoke-sessions.ts
          ls tests/e2e/.storage-state.prod-qa*.json 2>/dev/null && { echo "::error::a session file survived cleanup"; exit 1; } || echo "no session file left"

      - name: Upload result (no screenshots, no traces, no sessions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-qa-${{ needs.debounce.outputs.spec }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            prod-qa-result.json
            prod-qa-walk.log
