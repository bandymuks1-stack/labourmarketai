name: prod-qa-walk
# The spec in the run title lets acceptance-campaign.yml attribute a run that reached production
# even when it left no artifact.
run-name: prod-qa-walk ${{ github.event_name == 'workflow_dispatch' && format('{0} {1}{2}', inputs.spec, inputs.device, inputs.theme == 'dark' && ' dark' || '') || github.event_name }}

# PRODUCTION SIGNED-IN QA, without an agent ever holding a production key
# (owner programme 2026-10-12 §10). Before this, a signed-in production walk
# needed an agent to read the service-role key from a local env file, and the
# security classifier rightly refused that. Here the keys stay in GitHub:
# the run provisions/mints sessions ONLY for the hard-coded synthetic allowlist
# in `apps/web/lib/testing/prod-qa-guard.ts` (marked app_metadata.qa_synthetic,
# owning only QA-SYNTHETIC organizations), drives the real production site in a
# real browser, and uploads a JSON result — never a screenshot (public repo),
# a session file or a trace.
#
# Triggers: manual dispatch, a debounced post-merge walk and one daily
# scheduled walk (see CADENCE below). The `production-qa` environment is where
# the owner can add a required reviewer; if one is set, the automatic runs wait
# for that click too (up to the environment's wait limit) instead of walking
# unattended.
#
# Needs (names only):
#   secrets.NEXT_PUBLIC_SUPABASE_URL      (exists)
#   secrets.SUPABASE_SERVICE_ROLE_KEY     (exists)
#   vars.PROD_QA_ANON_KEY                 the project's PUBLISHABLE anon key —
#                                         the same value every browser receives;
#                                         a variable, not a secret.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Walk to run"
        type: choice
        default: brigade-formation
        options:
          - brigade-formation
          - employee-beta-gate
          - role-routes
          - chat-continuity
          # P0 chat privacy (#3224): A-B-C removal walk, synthetic thread; owner SQL removes the
          # thread afterwards. Dispatch only, never in the rotation.
          - chat-revocation
          - journal-confirm
          - calendar-planning
          # CAL-8 rota / shift-pattern walk (weekly + N-on/M-off, collision warns, UI cancel). Dispatch only.
          - rota-repeat
          # Explicit owner-authorised scheduled-report proof; synthetic accounts only.
          - timesheet-schedule
          - marketplace
          - agency-chain
          - learning-practice
          # J-12 learner join request (PR #2959). Dispatch only, never in the rotation: it can pass only once
          # migration 20261102160000 is applied in production.
          - cohort-join-request
          - sectors-languages
          - chat-confirm-once
          - living-cv-growth
          - staff-review-notice
          - manager-chat
          - mobile-surfaces
          - recognition-chain
          - mcp-chain
          - mcp-agents
          - project-context
          - worker-identity-split
          - company-chain
          - project-execution
          - org-roster
          - marketplace-goods-services
          - orders-bookings
          - documents-approvals
          - jobs-search
          - notifications-inapp
          - billing-test-mode
          - profile-cv-history
          - search-support-privacy
          - public-org-locales
          # Read-only admin console walk: the non-admin denial runs now; the admin part skips
          # (NOT VERIFIED) until an owner-approved admin QA session exists. Dispatch only.
          - admin-console
          # Registry rows with no production walk before 2026-10-25 (owner order: every function proven in
          # production in a real browser). Dispatch only, never in the rotation.
          - worker-records-exports
          - company-talent-history
          # #3354: the CV as a signed-in person sees it, READ ONLY (non-GET requests aborted). Dispatch only.
          - cv-readonly
          - company-governance
          - public-market-direction
          # AI-dependent rows proven with the AI runtime OFF (deterministic path or the honest off state).
          - ai-off-honesty
          # Second batch of registry rows with no production walk (2026-10-25): 2.11 + 8.6, 2.21, 3.18 + 3.19,
          # 7.25 + 9.11. Dispatch only, never in the rotation.
          - requirements-countries
          - work-verification
          - utilisation-planned-actual
          - lmc-csrf
          # Numbers-only UX/UI measurements (worker/owner/agency x desktop/phone + active-locale sweep, ~115 page
          # loads, read-only) for the per-function UX audit. Prints [ux] lines; no screenshots. Dispatch only.
          - ux-metrics
          # Coordinator order 2026-11-23 (owner-approved read-only grant): the owner's Living CV
          # screens, de-identified before rendering, published ONLY encrypted to the coordinator's key.
          # Read-only; needs the owner-created qa.livingcv+read1 account and its grant. Dispatch only.
          - living-cv-screens
          # Owner decision 2026-10-26 §5: locale vs server load behind the slow non-LT pages. Dispatch only.
          - lcp-locale-probe
          # Owner-approved 2026-10-26: two synthetic sessions at once vs one (read-only). Dispatch only.
          - concurrency-probe
          # Owner decision 2026-10-26: a brand-new worker and company, from onboarding to the first
          # useful action. Dispatch only, never in the rotation; the two accounts are created by the
          # owner (prod-qa-fresh-provision.yml) — this walk only signs in to them.
          - fresh-activation
          # The synthetic INVITED worker registers WITHOUT the link (owner
          # decision 2026-10-28). Dispatch only, never in the rotation; the
          # account and its referral are created by the owner
          # (prod-qa-invited-provision.yml).
          - invited-worker
          # Owner decision 2026-10-26: the buyer workspace (6.4) with the one owner-created buyer. Dispatch only.
          - buyer-workspace
          # Owner decision D-4 (2026-11-01): password reset proven by the mail that really arrives in
          # the owner's synthetic QA mailbox (read-only). Dispatch only, never in the rotation; skips
          # itself until the PROD_QA_IMAP_* secrets exist in the production-qa environment.
          - mail-reset
          # Journey J-15 (4.9 / 5.7 / 5.9): a job alert for a new matching live ad reaches the QA mailbox
          # and its link opens the public job page signed out. Dispatch only, never in the rotation; signs
          # in to the owner-created qa.invited@ account (prod-qa-invited-provision.yml) and erases it at the end.
          - alert-mail
          # Register row 5.9 (owner 2026-11-02): the weekly digest E-MAIL, proven by the real Monday 07:00 UTC
          # sweep, in two dispatches on the owner-created qa.invited@ account. digest-setup (Tue..Sun) stores the
          # digest e-mail consent and one journal entry and KEEPS the account; digest-check (the Monday after,
          # after 07:05 UTC, no sign-in that day before it) reads the mail, opens its link and erases the account.
          # Dispatch only, never in the rotation.
          - digest-setup
          - digest-check
          # 2026-11-01 register reconciliation: waitlist real submit (6.18), public JSON APIs (9.18),
          # journal templates (2.36; J-2 saves one QA-SYNTHETIC entry on the QA worker only when the owner has
          # activated a template, else skips unproven). Synthetic data only. Dispatch only, never in the rotation.
          - register-gaps
          # #3102 (owner 2026-11-05): a CV imported once, again and from two tabs at once leaves one row. Synthetic
          # worker, real Chrome. Dispatch only, never in the rotation.
          - cv-import-duplicates
          # Removes only what a stopped cv-import-duplicates walk left on the synthetic worker. Dispatch only.
          - cv-import-sweep
          # Real report 2026-11-05: Save on the work card, through a translated page, killed the page. Synthetic worker,
          # real Chrome, translator DOM swap emulated. Dispatch only, never in the rotation.
          - availability-save
          # SR-1 (owner 2026-11-06): first searches signed in and signed out, in scripted headless Chrome, read-only.
          # About 7 min, so it can span an import. Timings go only to the one-day sr1-readings artefact. Dispatch only.
          - sr1-first-search
          # Owner 2026-11-06: forms on a slow phone. Synthetic worker, real Chrome. Dispatch only, never in the rotation.
          - slow-connection
          # Owner 2026-11-07: the Today panel, journal period reports and quick confirmation, plus one synthetic entry the owner approves from the first screen. Dispatch only.
          - organization-daily
          # Owner P0 2026-11-07: the landing's three request doors. Adds 3 tagged rows and raises the real alert. Dispatch only.
          - request-doors
          # Owner 2026-11-07: UX-9, UX-10, DS-1, DS-2. Signed out, read-only, adds nothing.
          - public-readiness
          # #3147: a reviewer of two synthetic organizations sees each one's hours in its own context.
          - review-scope
          # Owner P0 2026-11-09: the job-search regression cases (SR-1…SR-4, SR-10) and three Norwegian ads read as text (#3033). Read-only.
          - search-regression
          # Owner P0 2026-11-09: account-deletion self-cancel on the synthetic worker2 only (files, confirms when the minted sign-in
          # is fresh, reads the 30-day date, cancels; afterAll always cancels) + the public 30-day / 7-day copy. Dispatch only.
          - deletion-cancel
          # Register 1.1: ONE real sign-up through the form with the synthetic mailbox address, confirmed by the mail that
          # arrives, onboarded as a worker. The ONLY walk that creates an account: each dispatch is the owner's decision.
          # A precheck stops it when the account already exists; the clean-up deletes the account and fails if anything is left.
          - signup-form
          # Register 4.8: ONE anonymous need through /en/company-need, marked QA-SYNTHETIC, read back and set to rejected.
          # It raises the REAL internal owner alert (nothing suppresses it) and the row stays until the owner deletes it
          # (docs/qa/need-intake-walk-cleanup.sql). Dispatch only, never in the rotation.
          - need-intake
          # Lane F inventory 2026-11-12: "My Space" pin to home (one workspace_pins row on the synthetic worker, removed
          # at the end) and a Swedish visitor (signed out, read-only). Dispatch only, never in the rotation.
          - pin-to-home
          - swedish-visitor
          # 2026-11-18 register review: READ-ONLY proof for rows with production facts but no walk: the Google door
          # in every routed locale, stopped before the auth server (1.2, 8.1), the command finder (5.14) and the
          # public cross-border readiness matrix (6.11). Writes nothing (non-GET aborted). Dispatch only.
          - register-walk-gaps
      # The screen the walk runs on. `phone` runs the SAME spec, accounts and writes at
      # 390 × 844 with touch, `phone-375` at 375 × 667 (apps/web/lib/testing/prod-qa-walk-device.ts). Automatic walks
      # (push, schedule) are always desktop. A phone walk counts in the daily budget and
      # obeys every brake like any other walk. `tablet-768` (768 × 1024, touch) and `desktop-1440`
      # (1440 × 900) complete the 375/390/768/1440 size matrix (owner order, #3679 addendum).
      device:
        description: "Screen: desktop (default), a 390 px or 375 px touch phone, a 768 px tablet, or a 1440 px desktop"
        type: choice
        default: desktop
        options:
          - desktop
          - phone
          - phone-375
          - tablet-768
          - desktop-1440
      # The colour scheme the browser asks the page for (Playwright `colorScheme`). Automatic walks
      # are always light. Owner order, #3679 addendum. One dispatch = one device + one theme.
      theme:
        description: "Colour scheme: light (default) or dark"
        type: choice
        default: light
        options:
          - light
          - dark
      budget_override:
        description: "Run even if the 24 h production-walk budget is used up (owner only)"
        type: boolean
        default: false

  # CADENCE (2026-10-16, Vercel Hobby Active-CPU pause). Production walks are
  # Vercel compute: every document a walk loads is a signed-in, force-dynamic
  # render (measured locally: ~255 ms CPU and ~725 kB HTML per dashboard
  # document). Instead of ad-hoc bursts (228 manual walks 2026-10-12..15, median
  # 177 s apart) the routine signal comes from two automatic triggers:
  #   - push to main touching the product → ONE `role-routes` walk (28 routes ×
  #     5 roles) 120 min after the LAST push of a merge burst (debounced below);
  #     measured on main 2026-10-09..16: ~3 such bursts a day (21 in 7.1 days);
  #   - one scheduled walk a day, rotating through every spec (full catalogue
  #     every 19 days).
  # Manual dispatch is unchanged for targeted checks.
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
  # 2026-10-17 (Supabase log-ingestion quota, 2.22 GB/month on the Free plan): one signed-in walk loads
  # ~36 Supabase calls per dashboard document, so the eight walks of 2026-10-17 alone wrote 23,400 of the
  # day's 25,200 edge-log entries. The routine signal is now ONE rotating walk a WEEK (Sunday 03:41 UTC)
  # plus the debounced post-merge role-routes walk; the full catalogue is still available on dispatch.
  schedule:
    - cron: "41 3 * * 0"
    # J-15 / row 5.9 (owner 2026-11-02): the Monday check of the weekly digest e-mail, after the 07:00 UTC
    # sweep, on CI so it does not depend on an open desktop app. Resolves to digest-check ONLY on
    # 2026-11-09; on any other date this cron picks nothing (no budget, no walk). Same brakes.
    - cron: "20 7 9 11 *"

permissions:
  contents: read

jobs:
  # A merge burst produces ONE walk: every newer push cancels the waiting
  # debounce of the previous one (cancel-in-progress), so only the last push's
  # run reaches `walk`. The wait also covers the Vercel production build.
  # Manual and scheduled runs pass straight through.
  debounce:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    concurrency:
      group: prod-qa-walk-debounce-${{ github.event_name == 'push' && 'push' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    outputs:
      spec: ${{ steps.pick.outputs.spec }}
    steps:
      - name: Wait for the merge burst to settle (push only)
        if: github.event_name == 'push'
        run: sleep 7200
      - name: Pick the walk
        id: pick
        shell: bash
        env:
          INPUT_SPEC: ${{ inputs.spec }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          ROTATION=(brigade-formation employee-beta-gate role-routes chat-continuity journal-confirm calendar-planning marketplace agency-chain learning-practice sectors-languages chat-confirm-once living-cv-growth staff-review-notice manager-chat mobile-surfaces recognition-chain mcp-chain mcp-agents project-context worker-identity-split company-chain project-execution org-roster marketplace-goods-services orders-bookings documents-approvals jobs-search notifications-inapp profile-cv-history search-support-privacy public-org-locales)
          case "$EVENT" in
            workflow_dispatch) spec="$INPUT_SPEC" ;;
            push) spec=role-routes ;;
            schedule)
              if [ "$SCHEDULE" = "20 7 9 11 *" ]; then
                # The one dated digest-check (row 5.9); any other year/date: nothing.
                if [ "$(date -u +%F)" = "2026-11-09" ]; then spec=digest-check; else spec=none; fi
              else
                spec="${ROTATION[$(( 10#$(date -u +%U) % ${#ROTATION[@]} ))]}"
              fi ;;
            *) echo "::error::unexpected event $EVENT"; exit 1 ;;
          esac
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          echo "walk: $spec (event: $EVENT)" >> "$GITHUB_STEP_SUMMARY"

  # PRODUCTION COMPUTE BUDGET (2026-10-16). Every walk drives a real browser
  # through signed-in, force-dynamic dashboard pages on the production Vercel
  # deployment, and each full document load ships the dashboard shell (~615 kB
  # of client messages alone, lt). 228 walks ran 2026-10-12..15 (43-64 a day);
  # Supabase edge logs show the Vercel-originated calls rising from 19.7k
  # (2026-10-09, before the first walk) to 91.3k (2026-10-14) with the busiest
  # hours matching the walk dispatch hours, and the Hobby team was paused on
  # 2026-10-15 for Fluid Active CPU. This job refuses a walk once
  # PROD_QA_WALK_DAILY_BUDGET walks have STARTED in the last 24 h, before any
  # install, session mint or production request. `budget_override` is the
  # explicit escape hatch. Counting reads only this workflow's run list.
  budget:
    # After the debounce, so a cancelled merge-burst run never counts or spends the budget.
    needs: debounce
    # `none`: the dated digest-check cron fired on another date — no walk (the walk job needs this one).
    if: needs.debounce.outputs.spec != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 25  # the deploy brake may wait up to 15 min
    permissions:
      actions: read
      contents: read
      deployments: read # production-vps deploy records, including reruns
    outputs:
      brake: ${{ (steps.brake_a.outcome == 'success' && steps.brake_e.outcome == 'success' && steps.brake_b.outcome == 'success' && steps.brake_c.outcome == 'success') && 'clear' || 'refused' }}
    # AUTOMATIC BRAKES (owner order 2026-10-23, after one brigade walk made ~8,100 Supabase requests in
    # 6.5 min — run 39795574869). A walk starts only when ALL of these hold; each refusal prints `::error::`
    # with its reason, before any install, session mint or production request.
    # A REFUSAL IS NOT RUN, NEVER A FAILED WALK (owner P0 2026-11-24, run 45404386749): each brake step
    # records its outcome instead of failing the job, the walk is not started, and the `not-run` job
    # ends the run as CANCELLED with "BLOCKED / NOT RUN" in its summary. No journey ran, so nothing may
    # read it as a failure (the status ledger skips cancelled runs; the schedulers dispatch the pair again). Thresholds live in ONE place,
    # `.github/scripts/walk-brakes.mjs` THRESHOLDS (unit-tested in apps/web/lib/guards/walk-brakes.test.ts):
    #   (a) health   3 x GET https://labourmarket.ai/api/health, 5 s apart: EVERY sample must be HTTP 200
    #                with ok=true, checks.db.ms <= 1500, checks.auth.ms <= 1500 and vacancyFreshness
    #                answered (ok=true). budget_override does NOT lift it. Re-checked in the walk job right
    #                before the session mint (the walk may have queued behind another one).
    #   (b) errors   the last 2 walks that reached production both failed in their FIRST step, or with
    #                infrastructure / 5xx errors (mint failure, no result file, 5xx / net::ERR / timeout
    #                markers), and the latest ended < 60 min ago -> refuse. After the 60 min cool-down one
    #                probe walk may run (circuit breaker; it never locks out for good). A product assertion
    #                failing later in a walk is not an infrastructure signal. budget_override lifts it.
    #   (c) supabase OPTIONAL, only with secret SUPABASE_ACCESS_TOKEN: Supabase edge answers in the last
    #                15 min above 25 x 5xx or 10 x 429 -> refuse. No token / unreadable logs: skipped with a
    #                notice. budget_override lifts it.
    #   (d) gap      >= 180 s between the end of the previous walk and the session mint of the next one,
    #                enforced in the WALK job after its concurrency wait (the only place it can hold): it
    #                waits out the remainder instead of refusing, because a refusal there would stop the
    #                acceptance campaign's chain. budget_override does NOT lift it.
    #   (e) deploy   no deploy-vps.yml run in progress or queued, and none ended < 5 min ago: the
    #                blue/green switch runs two Next servers on one origin, so a walk then measures the
    #                deploy (run 39978076973: Cloudflare 522, 45 s timeouts, while Supabase was clean).
    #                budget_override does NOT lift it. Re-checked in the walk job before the session mint.
    #   (f) budget   PROD_QA_WALK_DAILY_BUDGET walks that reached production in 24 h (below).
    env:
      # Owner allowed up to 200 (2026-10-23, #2659) once a controlled measurement proves it safe.
      # Measured after the fan-out fix (#2705): the heaviest walk (brigade-formation, run 39985839991)
      # = ~5.7k Supabase requests in ~3.5 min, 0 x 5xx, 0 x 429 (before: 8.1k in 6.5 min). Set to 48 —
      # not 200 — because an origin stall on 2026-10-23 13:50 happened while /api/health still passed, so
      # the health brake cannot catch that kind of stall until its cause is fixed. Raise after that.
      PROD_QA_WALK_DAILY_BUDGET: "48"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: "Brake (a): production health (the override does not lift it)"
        id: brake_a
        continue-on-error: true
        run: node .github/scripts/walk-brakes.mjs health

      - name: "Brake (e): no production deploy running or just finished (the override does not lift it)"
        id: brake_e
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # WAITS for production to be quiet (up to 15 min) instead of refusing at once: frequent
        # deploys refused walk after walk (owner P0 2026-11-24). The rule itself is unchanged.
        run: node .github/scripts/walk-brakes.mjs deploy --wait 15

      - name: "Brake (b): the last walks did not fail for infrastructure"
        id: brake_b
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.budget_override }}
        run: node .github/scripts/walk-brakes.mjs errors

      - name: "Brake (c): Supabase edge 5xx / 429 (optional, needs SUPABASE_ACCESS_TOKEN)"
        id: brake_c
        continue-on-error: true
        env:
          OVERRIDE: ${{ inputs.budget_override }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node .github/scripts/walk-brakes.mjs supabase

      - name: Count production walks in the last 24 h
        # Only when every brake is clear: after a refusal no walk starts, so there is nothing to count.
        if: steps.brake_a.outcome == 'success' && steps.brake_e.outcome == 'success' && steps.brake_b.outcome == 'success' && steps.brake_c.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.budget_override }}
        run: |
          set -euo pipefail
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          # A run CONSUMES the budget only when it reached production. Runs this
          # job refused, runs cancelled before the walk (a superseded pending
          # run, a debounced merge burst) and runs still waiting for the
          # environment never touched production and do not count (counting
          # them made each refused re-dispatch extend its own lock-out).
          # At 200 walks a day the former count (one jobs API call per run in
          # 24 h, ~200 calls per check) would pass the GITHUB_TOKEN rate limit;
          # walk-brakes.mjs counts finished walks from their artifacts
          # (prod-qa-<spec>-<run id>, uploaded by every walk job) in a few calls
          # and reads only the runs still in flight one by one.
          used=$(node .github/scripts/walk-brakes.mjs count | sed -n 's/^used=//p')
          [ -n "${used}" ] || { echo "::error::could not count the production walks of the last 24 h"; exit 1; }
          echo "production walks that reached production since ${since}: ${used} (budget ${PROD_QA_WALK_DAILY_BUDGET})" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${used}" -ge "${PROD_QA_WALK_DAILY_BUDGET}" ]; then
            if [ "${OVERRIDE}" = "true" ]; then
              echo "::warning::budget exceeded; running because budget_override=true"
              exit 0
            fi
            echo "::error::24 h production-walk budget used (${used}/${PROD_QA_WALK_DAILY_BUDGET}). Batch the check into a walk already run, run it locally, or re-dispatch with budget_override=true."
            exit 1
          fi

  walk:
    needs: [debounce, budget]
    # A brake refusal in the budget job: no walk (the `not-run` job records it).
    if: needs.budget.outputs.brake == 'clear'
    # One walk at a time against the shared synthetic cast (unchanged).
    concurrency:
      group: prod-qa-walk
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40  # the deploy brake may wait up to 10 min
    environment: production-qa
    permissions:
      contents: read
      actions: read # the gap brake reads the previous walk's end time
      deployments: read # production-vps deploy records, including reruns
    outputs:
      brake: ${{ (steps.brake_d.outcome == 'success' && steps.brake_we.outcome == 'success' && steps.brake_wa.outcome == 'success') && 'clear' || 'refused' }}
    # NO service-role key at job level (owner decision 2026-11-14, R2 P3-1 on #3303): a job-level
    # value reaches every step — `pnpm install` and its install scripts, the browser walk and every
    # Playwright spec — although no spec reads it. It is set on exactly the steps whose script uses
    # it: the provision + mint, the sign-up precheck and clean-up (prod-qa-signup-form.ts) and the
    # need read-back (prod-qa-need-intake.ts). The revoke uses the anon key only; the walk and the
    # CV sweep are Playwright. Guard: lib/guards/prod-walk-service-key-scope.test.ts.
    env:
      PROD_QA_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      PROD_QA_ANON_KEY: ${{ vars.PROD_QA_ANON_KEY }}
      E2E_NO_SERVER: "1"
      E2E_BASE_URL: https://labourmarket.ai
      PROD_QA_WALK: "1"
    steps:
      - uses: actions/checkout@v4

      # The brakes again, AFTER the concurrency wait and BEFORE anything touches
      # production: the budget job's answers may be minutes old by now. The gap
      # waits first; the deploy and health checks run last, right before the
      # session mint. None is lifted by budget_override.
      - name: "Brake (d): minimum gap after the previous walk (waits)"
        id: brake_d
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/walk-brakes.mjs gap

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: "Brake (e): no production deploy running or just finished"
        id: brake_we
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # A deploy that started during the concurrency wait: wait it out (up to 10 min), never walk into it.
        run: node .github/scripts/walk-brakes.mjs deploy --wait 10

      - name: "Brake (a): production health, right before the walk"
        id: brake_wa
        continue-on-error: true
        run: node .github/scripts/walk-brakes.mjs health

      # Nothing touches production unless all three brakes above were clear. The two steps
      # below run only after this one succeeded; every later step is an always() clean-up.
      - name: Provision + mint the synthetic cast (allowlist only)
        id: mint
        if: steps.brake_d.outcome == 'success' && steps.brake_we.outcome == 'success' && steps.brake_wa.outcome == 'success'
        shell: bash
        env:
          PROD_QA_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_QA_ANON_KEY}" ]; then
            echo "::error::vars.PROD_QA_ANON_KEY is not set (the publishable anon key)"; exit 1
          fi
          cd apps/web
          mint() {
            PROD_QA_PROVISION_IDENTITY="$1" pnpm exec tsx scripts/prod-qa-provision.ts --i-understand-production
            PROD_QA_IDENTITY="$1" PROD_QA_STORAGE_SLOT="$2" pnpm exec tsx scripts/prod-qa-mint-session.ts
          }
          mint "qa.owner+multiw@labourmarket.ai"   owner
          mint "qa.manager+multiw@labourmarket.ai" manager
          mint "qa.worker+multiw@labourmarket.ai"  worker
          mint "qa.worker+goal3@labourmarket.ai"   worker2
          mint "qa.agency+multiw@labourmarket.ai"  agency
          # The fresh pair: minted ONLY for the fresh-activation walk and WITHOUT the provision step —
          # the mint refuses an account the owner has not created, so a walk never creates one.
          mint_existing() {
            PROD_QA_IDENTITY="$1" PROD_QA_STORAGE_SLOT="$2" pnpm exec tsx scripts/prod-qa-mint-session.ts
          }
          if [ "${{ needs.debounce.outputs.spec }}" = "fresh-activation" ]; then
            mint_existing "qa.freshworker+act2@labourmarket.ai"  freshworker
            mint_existing "qa.freshcompany+act2@labourmarket.ai" freshcompany
          fi
          if [ "${{ needs.debounce.outputs.spec }}" = "buyer-workspace" ]; then
            mint_existing "qa.buyer+act1@labourmarket.ai" buyer
            # J-13: the owner-created fresh worker is the NON-customer who becomes one. Its absence
            # (revoked / not created) only skips the J-13 steps; the 6.4 steps above still run.
            mint_existing "qa.freshworker+act1@labourmarket.ai" freshworker \
              || echo "::warning::qa.freshworker+act1 not mintable — the J-13 steps of buyer-workspace will skip"
          fi
          if [ "${{ needs.debounce.outputs.spec }}" = "ux-metrics" ]; then
            # The buyer role of the UX matrix. Owner-created only: absent, the role is recorded BLOCKED.
            mint_existing "qa.buyer+act1@labourmarket.ai" buyer \
              || echo "::warning::qa.buyer+act1 not mintable — the buyer role of ux-metrics is recorded BLOCKED"
          fi
          if [ "${{ needs.debounce.outputs.spec }}" = "living-cv-screens" ]; then
            # Owner-created, read-only, granted by the owner's side. Not mintable means no screens.
            mint_existing "qa.livingcv+read1@labourmarket.ai" livingcv
          fi
          if [ "${{ needs.debounce.outputs.spec }}" = "invited-worker" ] || [ "${{ needs.debounce.outputs.spec }}" = "alert-mail" ] || [ "${{ needs.debounce.outputs.spec }}" = "digest-setup" ] || [ "${{ needs.debounce.outputs.spec }}" = "digest-check" ]; then
            mint_existing "qa.invited@labourmarket.ai" invited
          fi
          # employee-beta-gate.spec.ts reads the original single-worker file.
          install -m 600 tests/e2e/.storage-state.prod-qa.worker2.json tests/e2e/.storage-state.prod-qa.json

      # signup-form only. The walk creates its own account, so it must not start when one with the synthetic
      # address already exists (an owner-provisioned one belongs to another walk and must never be deleted here).
      - name: "Sign-up walk: no account with the synthetic address exists (else stop)"
        id: signup_precheck
        if: steps.mint.outcome == 'success' && needs.debounce.outputs.spec == 'signup-form'
        shell: bash
        env:
          PROD_QA_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          cd apps/web
          pnpm exec tsx scripts/prod-qa-signup-form.ts --i-understand-production --precheck

      - name: Walk
        id: walk
        if: steps.mint.outcome == 'success'
        shell: bash
        env:
          # The addressed invitee of staff-review-notice: the second synthetic
          # worker minted above (same allowlisted identity, no new account).
          PROD_QA_INVITEE_EMAIL: qa.worker+goal3@labourmarket.ai
          # mail-reset, invited-worker and alert-mail only: the read-only synthetic QA mailbox (owner D-4;
          # D-5 proves the invited address with the mailed one-time link; J-15 reads the job-alert and digest mail). Every other spec gets empty values, so no
          # other walk ever holds the mailbox credentials.
          PROD_QA_IMAP_HOST: ${{ (needs.debounce.outputs.spec == 'mail-reset' || needs.debounce.outputs.spec == 'invited-worker' || needs.debounce.outputs.spec == 'alert-mail' || needs.debounce.outputs.spec == 'digest-setup' || needs.debounce.outputs.spec == 'digest-check' || needs.debounce.outputs.spec == 'signup-form') && secrets.PROD_QA_IMAP_HOST || '' }}
          PROD_QA_IMAP_USER: ${{ (needs.debounce.outputs.spec == 'mail-reset' || needs.debounce.outputs.spec == 'invited-worker' || needs.debounce.outputs.spec == 'alert-mail' || needs.debounce.outputs.spec == 'digest-setup' || needs.debounce.outputs.spec == 'digest-check' || needs.debounce.outputs.spec == 'signup-form') && secrets.PROD_QA_IMAP_USER || '' }}
          PROD_QA_IMAP_PASS: ${{ (needs.debounce.outputs.spec == 'mail-reset' || needs.debounce.outputs.spec == 'invited-worker' || needs.debounce.outputs.spec == 'alert-mail' || needs.debounce.outputs.spec == 'digest-setup' || needs.debounce.outputs.spec == 'digest-check' || needs.debounce.outputs.spec == 'signup-form') && secrets.PROD_QA_IMAP_PASS || '' }}
          PROD_QA_MAIL_ADDRESS: qa.invited@labourmarket.ai
          # Each of the two writing walks runs only under its own name.
          PROD_QA_SIGNUP_WALK: ${{ needs.debounce.outputs.spec == 'signup-form' && '1' || '0' }}
          PROD_QA_NEED_WALK: ${{ needs.debounce.outputs.spec == 'need-intake' && '1' || '0' }}
          # desktop unless a person dispatched the walk for a phone (a choice input: no free text).
          PROD_QA_DEVICE: ${{ github.event_name == 'workflow_dispatch' && inputs.device || 'desktop' }}
          # light unless a person dispatched the walk in the dark scheme (a choice input: no free text).
          PROD_QA_THEME: ${{ github.event_name == 'workflow_dispatch' && inputs.theme || 'light' }}
          SR1_READINGS_FILE: ${{ github.workspace }}/sr1-readings.jsonl
          # living-cv-screens only: the plaintext screens, outside the repository, destroyed below.
          PROD_QA_LCV_DIR: ${{ runner.temp }}/lcv
        run: |
          set -uo pipefail
          echo "device: ${PROD_QA_DEVICE}" >> "$GITHUB_STEP_SUMMARY"
          echo "theme: ${PROD_QA_THEME}" >> "$GITHUB_STEP_SUMMARY"
          cd apps/web
          case "${{ needs.debounce.outputs.spec }}" in
            brigade-formation) SPEC=tests/e2e/prod-brigade-formation.spec.ts ;;
            employee-beta-gate) SPEC=tests/e2e/employee-beta-gate.spec.ts ;;
            role-routes) SPEC=tests/e2e/prod-role-routes.spec.ts ;;
            chat-continuity) SPEC=tests/e2e/prod-chat-continuity.spec.ts ;;
            chat-revocation) SPEC=tests/e2e/prod-chat-revocation.spec.ts ;;
            journal-confirm) SPEC=tests/e2e/prod-journal-confirm.spec.ts ;;
            calendar-planning) SPEC=tests/e2e/prod-calendar-planning.spec.ts ;;
            rota-repeat) SPEC=tests/e2e/prod-rota-repeat.spec.ts ;;
            timesheet-schedule) SPEC=tests/e2e/prod-timesheet-schedule.spec.ts ;;
            marketplace) SPEC=tests/e2e/prod-marketplace.spec.ts ;;
            agency-chain) SPEC=tests/e2e/prod-agency-chain.spec.ts ;;
            learning-practice) SPEC=tests/e2e/prod-learning-practice.spec.ts ;;
            cohort-join-request) SPEC=tests/e2e/prod-cohort-join-request.spec.ts ;;
            sectors-languages) SPEC=tests/e2e/prod-sectors-languages.spec.ts ;;
            chat-confirm-once) SPEC=tests/e2e/prod-chat-confirm-once.spec.ts ;;
            living-cv-growth) SPEC=tests/e2e/prod-living-cv-growth.spec.ts ;;
            staff-review-notice) SPEC=tests/e2e/prod-staff-review-notice.spec.ts ;;
            manager-chat) SPEC=tests/e2e/prod-manager-chat.spec.ts ;;
            mobile-surfaces) SPEC=tests/e2e/prod-mobile-surfaces.spec.ts ;;
            recognition-chain) SPEC=tests/e2e/prod-recognition-chain.spec.ts ;;
            mcp-chain) SPEC=tests/e2e/prod-mcp-chain.spec.ts ;;
            mcp-agents) SPEC=tests/e2e/prod-mcp-agents.spec.ts ;;
            project-context) SPEC=tests/e2e/prod-project-context.spec.ts ;;
            worker-identity-split) SPEC=tests/e2e/prod-worker-identity-split.spec.ts ;;
            company-chain) SPEC=tests/e2e/prod-company-chain.spec.ts ;;
            project-execution) SPEC=tests/e2e/prod-project-execution.spec.ts ;;
            org-roster) SPEC=tests/e2e/prod-org-roster.spec.ts ;;
            marketplace-goods-services) SPEC=tests/e2e/prod-marketplace-goods-services.spec.ts ;;
            orders-bookings) SPEC=tests/e2e/prod-orders-bookings.spec.ts ;;
            documents-approvals) SPEC=tests/e2e/prod-documents-approvals.spec.ts ;;
            jobs-search) SPEC=tests/e2e/prod-jobs-search.spec.ts ;;
            notifications-inapp) SPEC=tests/e2e/prod-notifications-inapp.spec.ts ;;
            # Stripe TEST pilot walk: dispatch only after the owner arms test mode (lm-stripe-arm.sh test); never in the rotation.
            billing-test-mode) SPEC=tests/e2e/prod-billing-test-mode.spec.ts ;;
            profile-cv-history) SPEC=tests/e2e/prod-profile-cv-history.spec.ts ;;
            search-support-privacy) SPEC=tests/e2e/prod-search-support-privacy.spec.ts ;;
            public-org-locales) SPEC=tests/e2e/prod-public-org-locales.spec.ts ;;
            admin-console) SPEC=tests/e2e/prod-admin-console.spec.ts ;;
            worker-records-exports) SPEC=tests/e2e/prod-worker-records-exports.spec.ts ;;
            company-talent-history) SPEC=tests/e2e/prod-company-talent-history.spec.ts ;;
            cv-readonly) SPEC=tests/e2e/prod-cv-readonly.spec.ts ;;
            company-governance) SPEC=tests/e2e/prod-company-governance.spec.ts ;;
            public-market-direction) SPEC=tests/e2e/prod-public-market-direction.spec.ts ;;
            ai-off-honesty) SPEC=tests/e2e/prod-ai-off-honesty.spec.ts ;;
            requirements-countries) SPEC=tests/e2e/prod-requirements-countries.spec.ts ;;
            work-verification) SPEC=tests/e2e/prod-work-verification.spec.ts ;;
            utilisation-planned-actual) SPEC=tests/e2e/prod-utilisation-planned-actual.spec.ts ;;
            lmc-csrf) SPEC=tests/e2e/prod-lmc-csrf.spec.ts ;;
            ux-metrics) SPEC=tests/e2e/prod-ux-metrics.spec.ts ;;
            living-cv-screens) SPEC=tests/e2e/prod-living-cv-screens.spec.ts ;;
            lcp-locale-probe) SPEC=tests/e2e/prod-lcp-locale-probe.spec.ts ;;
            concurrency-probe) SPEC=tests/e2e/prod-concurrency-probe.spec.ts ;;
            fresh-activation) SPEC=tests/e2e/prod-fresh-activation.spec.ts ;;
            invited-worker) SPEC=tests/e2e/prod-invited-worker.spec.ts ;;
            buyer-workspace) SPEC=tests/e2e/prod-buyer-workspace.spec.ts ;;
            mail-reset) SPEC=tests/e2e/prod-mail-reset.spec.ts ;;
            alert-mail) SPEC=tests/e2e/prod-alert-mail.spec.ts ;;
            digest-setup) SPEC=tests/e2e/prod-digest-setup.spec.ts ;;
            digest-check) SPEC=tests/e2e/prod-digest-check.spec.ts ;;
            register-gaps) SPEC=tests/e2e/prod-register-gaps.spec.ts ;;
            cv-import-duplicates) SPEC=tests/e2e/prod-cv-import-duplicates.spec.ts ;;
            cv-import-sweep) SPEC=tests/e2e/prod-cv-import-sweep.spec.ts ;;
            availability-save) SPEC=tests/e2e/prod-availability-save.spec.ts ;;
            sr1-first-search) SPEC=tests/e2e/prod-sr1-first-search.spec.ts ;;
            slow-connection) SPEC=tests/e2e/prod-slow-connection.spec.ts ;;
            organization-daily) SPEC=tests/e2e/prod-organization-daily.spec.ts ;;
            request-doors) SPEC=tests/e2e/prod-request-doors.spec.ts ;;
            public-readiness) SPEC=tests/e2e/prod-public-readiness.spec.ts ;;
            review-scope) SPEC=tests/e2e/prod-review-scope.spec.ts ;;
            search-regression) SPEC=tests/e2e/prod-search-regression.spec.ts ;;
            deletion-cancel) SPEC=tests/e2e/prod-deletion-cancel.spec.ts ;;
            signup-form) SPEC=tests/e2e/prod-signup-form.spec.ts ;;
            need-intake) SPEC=tests/e2e/prod-need-intake.spec.ts ;;
            pin-to-home) SPEC=tests/e2e/prod-pin-to-home.spec.ts ;;
            swedish-visitor) SPEC=tests/e2e/prod-swedish-visitor.spec.ts ;;
            register-walk-gaps) SPEC=tests/e2e/prod-register-walk-gaps.spec.ts ;;
            *) echo "::error::unknown walk '${{ needs.debounce.outputs.spec }}'"; exit 1 ;;
          esac
          # RESULT HONESTY (2026-10-16). Two defects lived in the two lines that
          # used to be here:
          #  1. `--reporter=list,json > prod-qa-result.json` sent BOTH reporters
          #     to stdout, so the uploaded "JSON result" began with the list
          #     reporter's text and was not parseable JSON (run 38799693673:
          #     270 kB, `JSON.parse` fails at byte 1). The JSON reporter now
          #     writes its own file; the list output goes to a separate log
          #     artefact (same content the old file carried — no new exposure).
          #  2. `echo "exit=$?"` was the step's last command. A failing walk
          #     still failed the step only because GitHub's `shell: bash`
          #     injects `-e`; `set -uo pipefail` alone would have turned every
          #     failure green, and on failure the summary line never ran. The
          #     exit code is now captured, written to the summary and returned
          #     explicitly, whatever shell flags the runner adds.
          code=0
          PLAYWRIGHT_JSON_OUTPUT_FILE="$GITHUB_WORKSPACE/prod-qa-result.json" \
            pnpm exec playwright test "$SPEC" --project=chromium --trace=off --reporter=list,json \
            > "$GITHUB_WORKSPACE/prod-qa-walk.log" 2>&1 || code=$?
          # Counts only (no titles, no messages) into the run summary.
          node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).stats;console.log(`passed=${s.expected} failed=${s.unexpected} flaky=${s.flaky} skipped=${s.skipped}`)' \
            "$GITHUB_WORKSPACE/prod-qa-result.json" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "result JSON missing or unreadable" >> "$GITHUB_STEP_SUMMARY"
          echo "walk exit=${code}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${code}" -ne 0 ]; then
            echo "::error::production walk failed (exit ${code}); see the prod-qa artefact"
          fi
          exit "${code}"

      # living-cv-screens: the repository is public, so the screens are published ONLY encrypted.
      # Owner 2026-11-23: every image passes its OWN privacy gate in the walk; one that fails is never
      # written. The manifest lists all twelve screens with PASS or FAIL and the reason, and is
      # encrypted with the images. A 375 px layout FAIL is still delivered, de-identified, and never
      # blocks the others. Here: every PNG must be one the manifest lists as privacy PASS, else
      # nothing is published. A random AES-256 key encrypts the zip; the coordinator's RSA public
      # key encrypts that key. The plaintext is destroyed on the runner whatever happens.
      # Guard: lib/guards/living-cv-screens.test.ts.
      - name: "Living CV screens: encrypt, then destroy the plaintext"
        id: lcv
        if: always() && needs.debounce.outputs.spec == 'living-cv-screens'
        shell: bash
        env:
          LCV_DIR: ${{ runner.temp }}/lcv
          LCV_OUT: ${{ runner.temp }}/lcv-out
          LCV_TMP: ${{ runner.temp }}/lcv-tmp
          LCV_PUBKEY: apps/web/tests/e2e/prod-living-cv-screens.public-key.txt
        run: |
          set -euo pipefail
          destroy() {
            for d in "$LCV_DIR" "$LCV_TMP"; do
              [ -d "$d" ] && find "$d" -type f -exec shred -u {} + 2>/dev/null || true
              rm -rf "$d"
            done
          }
          trap destroy EXIT
          mkdir -p "$LCV_OUT" "$LCV_TMP"
          if [ ! -f "$LCV_DIR/manifest.json" ]; then
            echo "::error::no manifest (walk ${{ steps.walk.outcome }}); nothing is published"
            exit 1
          fi
          # Every image on disk must be one the manifest lists as privacy PASS; the manifest must
          # list twelve screens. Counts only.
          node -e '
            const fs = require("fs"), path = require("path"), dir = process.argv[1];
            const m = JSON.parse(fs.readFileSync(path.join(dir, "manifest.json"), "utf8"));
            const listed = new Set(m.screens.filter((s) => s.privacy === "PASS" && s.file).map((s) => s.file));
            const pngs = fs.readdirSync(dir).filter((f) => f.endsWith(".png"));
            const stray = pngs.filter((f) => !listed.has(f));
            if (m.screens.length !== 12 || stray.length > 0) { console.error(`screens=${m.screens.length} stray=${stray.length}`); process.exit(1); }
            const pass = m.screens.filter((s) => s.status === "PASS").length;
            console.log(`images=${pngs.length} pass=${pass} fail=${m.screens.length - pass}`);
          ' "$LCV_DIR" >> "$GITHUB_STEP_SUMMARY"
          (cd "$LCV_DIR" && zip -q -X "$LCV_TMP/lcv.zip" manifest.json $(find . -maxdepth 1 -type f -name '*.png' -printf '%f\n'))
          openssl rand -hex 32 > "$LCV_TMP/lcv.key"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$LCV_TMP/lcv.zip" -out "$LCV_OUT/lcv.zip.enc" -pass "file:$LCV_TMP/lcv.key"
          openssl pkeyutl -encrypt -pubin -inkey "$LCV_PUBKEY" -in "$LCV_TMP/lcv.key" -out "$LCV_OUT/lcv.key.enc"
          echo "encrypted=true" >> "$GITHUB_OUTPUT"

      - name: "Living CV screens: upload the two encrypted files only"
        if: always() && steps.lcv.outputs.encrypted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prod-qa-living-cv-screens-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/lcv-out/lcv.zip.enc
            ${{ runner.temp }}/lcv-out/lcv.key.enc

      # The repository is PUBLIC, so its artifacts are readable by any signed-in
      # GitHub user. Screenshots of production pages can show real companies'
      # open needs next to the synthetic cast, so they are NOT published — only
      # the step-level JSON result (titles, pass/fail, durations). A failing
      # assertion message names the testid and the expected text, nothing more.
      # `prod-qa-walk.log` is the list reporter's text — exactly what used to be
      # glued to the front of prod-qa-result.json, now in its own file.
      # signup-form: the account the walk created is deleted, pass or fail, and the job fails when anything is left.
      # Only after a precheck that passed — otherwise the account found is not this run's.
      - name: "Sign-up walk: delete the account it created and check for orphans"
        if: always() && needs.debounce.outputs.spec == 'signup-form' && steps.signup_precheck.outcome == 'success'
        timeout-minutes: 3
        shell: bash
        env:
          PROD_QA_SIGNUP_NOT_BEFORE: ${{ steps.signup_precheck.outputs.not_before }}
          PROD_QA_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          cd apps/web
          pnpm exec tsx scripts/prod-qa-signup-form.ts --i-understand-production --cleanup

      # need-intake: the stored row is read back with the service key and set to rejected, pass or fail (a walk
      # that failed after the submit still left a row). The row itself stays: the service role cannot delete it.
      - name: "Need walk: read the stored need back and set it to rejected"
        if: always() && needs.debounce.outputs.spec == 'need-intake' && steps.walk.outcome != 'skipped'
        timeout-minutes: 3
        shell: bash
        env:
          NEED_WALK_OUTCOME: ${{ steps.walk.outcome }}
          PROD_QA_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          cd apps/web
          pnpm exec tsx scripts/prod-qa-need-intake.ts --i-understand-production

      # The CV walk's rows, whatever stopped the walk: a failed step, a cancel, the test's
      # own timeout. It needs the session, so it stands before the revoke.
      - name: Remove the CV walk's synthetic rows
        if: always() && needs.debounce.outputs.spec == 'cv-import-duplicates' && steps.mint.outcome == 'success'
        timeout-minutes: 3
        shell: bash
        run: |
          cd apps/web
          pnpm exec playwright test tests/e2e/prod-cv-import-sweep.spec.ts --project=chromium --trace=off --reporter=list

      # Sessions never outlive the walk: every minted session's refresh token is
      # revoked at Supabase and every session file deleted, pass or fail
      # (scripts/prod-qa-revoke-sessions.ts prints counts only).
      # Owner order 2026-11-22: no synthetic need stays on the open board. Every walk that can
      # post one already sweeps in its afterAll; this covers a cancel, a timeout or a crash.
      # The minted sessions' OWN tokens and the product's close RPC only (no service role,
      # no delete); it needs the session files, so it stands before the revoke.
      - name: Close every open synthetic need (always)
        if: always() && steps.mint.outcome == 'success'
        timeout-minutes: 3
        shell: bash
        run: |
          cd apps/web
          pnpm exec tsx scripts/prod-qa-close-synthetic-needs.ts

      - name: Revoke and delete the synthetic sessions
        if: always()
        shell: bash
        env:
          # The mint step ran: session files MUST be here for the revoke. If
          # none are, the revoke fails instead of reporting a clean 0/0.
          PROD_QA_REVOKE_EXPECT_FILES: ${{ steps.mint.outcome == 'success' && '1' || '0' }}
        run: |
          cd apps/web
          pnpm exec tsx scripts/prod-qa-revoke-sessions.ts
          ls tests/e2e/.storage-state.prod-qa*.json 2>/dev/null && { echo "::error::a session file survived cleanup"; exit 1; } || echo "no session file left"

      # AFTER the revoke, never before it: the revoke reads each session file to
      # log that session out at Supabase, then deletes the file. When this step
      # ran first (until 2026-10-26) the revoke found files=0 and revoked
      # nothing, so every walk left one live session per minted identity.
      - name: Destroy session files (always, belt and braces)
        if: always()
        shell: bash
        run: rm -f apps/web/tests/e2e/.storage-state.prod-qa*.json

      # Belt and braces for `captureGitInfo` in playwright.config.ts: whatever
      # metadata a reporter adds, the published result carries none, and a
      # personal mail address in either file stops the upload instead of
      # publishing it (privacy, 2026-11-08). FAIL CLOSED: the upload runs only
      # when this step reached its last line and wrote `published=true`. A
      # result that is not a readable Playwright report, a check that could
      # not read a file, a cancel or a crash leaves the output unset, so
      # nothing is published (the brakes then read "no result file"). Node's
      # stderr is dropped: a JSON syntax error prints the start of the file
      # into this public job log.
      - name: Strip reporter metadata from the result (always)
        id: privacy
        if: always()
        shell: bash
        run: |
          withhold() {
            rm -f prod-qa-result.json prod-qa-walk.log 2>/dev/null || true
            echo "::error::$1; the result is not published"
            exit 1
          }
          for f in prod-qa-result.json prod-qa-walk.log; do
            if [ -e "$f" ] && [ ! -f "$f" ]; then withhold "$f is not a regular file"; fi
          done
          if [ -f prod-qa-result.json ]; then
            node -e 'const fs=require("fs"),f=process.argv[1],r=JSON.parse(fs.readFileSync(f,"utf8"));if(!r||typeof r!=="object"||Array.isArray(r)||!r.stats||typeof r.stats!=="object"||!Array.isArray(r.suites))process.exit(3);if(r.config){delete r.config.metadata;for(const p of r.config.projects||[])delete p.metadata}fs.writeFileSync(f,JSON.stringify(r,null,2))' prod-qa-result.json 2>/dev/null \
              || withhold "the walk result is not a readable Playwright report"
          fi
          for f in prod-qa-result.json prod-qa-walk.log; do
            if [ -f "$f" ]; then
              found=0
              grep -Eq '[A-Za-z0-9._%+-]+@(gmail|googlemail|yahoo|hotmail|outlook|icloud|gmx|proton)\.' "$f" || found=$?
              if [ "$found" -eq 0 ]; then withhold "a personal mail address was in the walk result"; fi
              if [ "$found" -ne 1 ]; then withhold "the privacy check could not read $f"; fi
            fi
          done
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Upload result (no screenshots, no traces, no sessions)
        if: always() && steps.privacy.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prod-qa-${{ needs.debounce.outputs.spec }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            prod-qa-result.json
            prod-qa-walk.log

      # A withheld result still started a walk. The daily budget counts walks
      # from their `prod-qa-<spec>-<run id>` artefacts (`walk-brakes.mjs count`),
      # so a withheld result leaves a marker under the same name that holds no
      # walk data: withholding never frees a walk from the budget. The error
      # brake reads it as "no result file", as before.
      - name: Mark a withheld result (counts toward the daily budget)
        if: always() && steps.privacy.outputs.published != 'true'
        shell: bash
        run: echo "the walk result was withheld by the privacy check" > prod-qa-withheld.txt

      - name: Upload the withheld marker
        if: always() && steps.privacy.outputs.published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prod-qa-${{ needs.debounce.outputs.spec }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: prod-qa-withheld.txt

      # FAIL CLOSED like the result: the readings are published only when every
      # line is a reading the spec writes (`walk-brakes.mjs sr1-check`: known
      # fields, scalar values, no address). A file that fails or cannot be read
      # is deleted and the step fails; node's stderr is dropped, its stdout says
      # why with a line number only.
      - name: Check the SR-1 readings before they are published
        id: sr1
        if: always() && needs.debounce.outputs.spec == 'sr1-first-search'
        shell: bash
        run: |
          if [ ! -e sr1-readings.jsonl ]; then
            echo "no SR-1 readings file"
            exit 0
          fi
          if [ -f sr1-readings.jsonl ] && node .github/scripts/walk-brakes.mjs sr1-check sr1-readings.jsonl 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            rm -f sr1-readings.jsonl 2>/dev/null || true
            echo "::error::the SR-1 readings did not pass the privacy check; they are not published"
            exit 1
          fi

      # The SR-1 timings, apart from the walk's artefact and kept one day: artefacts of this public repo are
      # readable by any signed-in GitHub user, so whoever records the readings deletes this one after copying them.
      - name: Upload the SR-1 readings (one day)
        if: always() && needs.debounce.outputs.spec == 'sr1-first-search' && steps.sr1.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sr1-readings-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: warn
          path: sr1-readings.jsonl

  # BLOCKED / NOT RUN (owner P0 2026-11-24). A brake refused in the budget job or
  # right before the walk: no journey ran. The run is CANCELLED, never failed and
  # never passed — the status ledger skips cancelled runs, the error brake and the
  # daily count only see walks that reached production, and the schedulers
  # dispatch the pair again once production is stable. The one job with
  # `actions: write`, and it only cancels this run.
  not-run:
    needs: [debounce, budget, walk]
    if: always() && (needs.budget.outputs.brake == 'refused' || needs.walk.outputs.brake == 'refused')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # cancel this run
    steps:
      - name: "BLOCKED / NOT RUN: a brake refused, no journey ran"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WHERE: ${{ needs.budget.outputs.brake == 'refused' && 'before the walk was queued (budget job)' || 'right before the session mint (walk job)' }}
        run: |
          echo "**BLOCKED / NOT RUN: a walk brake refused ${WHERE}. No journey ran; this is not a failed walk. The reason is in that job's brake step.**" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::BLOCKED / NOT RUN: a walk brake refused ${WHERE}; the run is cancelled, not failed"
          gh run cancel "$GITHUB_RUN_ID"
          sleep 300
          echo "::error::the run could not be cancelled: it stays red, but no journey ran"
          exit 1
