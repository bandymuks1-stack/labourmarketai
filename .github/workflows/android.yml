name: Android

# Real, installable Android build of the EXISTING Expo app (apps/mobile) on
# GitHub's hosted Linux runners, plus an emulator runtime journey. The Android
# sibling of ios.yml — same shape: prebuild → native build → launch check →
# Maestro journey (apps/mobile/.maestro/auth-failure-journey.yaml).
#
# INTERNAL TEST BUILD — DEBUG-SIGNED — NOT FOR STORE.
# `expo prebuild` generates a release buildType that signs with the template's
# debug keystore when no release signing is configured. That is exactly what
# this workflow relies on. No keystore, upload key or signing secret exists in
# this repository or this workflow, and none may be added here: store signing
# is EAS / owner territory (docs/mobile/STORE_RELEASE_READINESS_2026-09-13.md).
# The APK installs on any Android 7+ device with "install unknown apps"
# allowed; Play Store will refuse it, by design.
#
# WHY RELEASE, NOT DEBUG: same reason as ios.yml — a debug build loads its
# JavaScript from a Metro server that does not exist on the runner or on a
# tester's phone. Release embeds the Hermes bundle, so the APK runs standalone.
#
# CONFIGURATION — PUBLIC VALUES ONLY. The bundle is built against PRODUCTION
# public configuration so a tester can actually use the APK:
#   EXPO_PUBLIC_SUPABASE_ANON_KEY  vars.PROD_QA_ANON_KEY (the project's
#                                  publishable anon key; a repository VARIABLE,
#                                  not a secret — RLS protects the data, and
#                                  client-core REFUSES a service-role key)
#   EXPO_PUBLIC_SUPABASE_URL       derived from that key's own `ref` claim, so
#                                  no project identifier is committed here
#   EXPO_PUBLIC_API_BASE_URL       https://labourmarket.ai
# If the variable is absent the build falls back to the same deterministic
# placeholders mobile.yml / ios.yml use and the job summary says so — the APK
# then cannot sign anyone in and is a build proof only.
#
# NOT a required check (same deliberate introduction as ios.yml / mobile.yml).
#
# What this workflow can honestly claim when green:
#   ANDROID_RELEASE_APK_BUILT      — Gradle compiles, links and packages the
#                                    real app with an embedded Hermes bundle
#   ANDROID_EMU_LAUNCH_PROVEN      — the APK installs on an API 34 emulator and
#                                    the process is alive 15s after launch
#   ANDROID_RUNTIME_JOURNEY_PROVEN — the auth screen RENDERS, a real sign-in
#                                    attempt (fictional credentials) runs, the
#                                    failure is SHOWN (testID auth-failure) and
#                                    the app survives it
#   ANDROID_OFFLINE_JOURNEY_PROVEN — the same sign-in in AIRPLANE MODE shows
#                                    "could not reach the server" (not "wrong
#                                    password", not a spinner) and the form
#                                    stays usable
#   ANDROID_STORE_POLICY_FACTS_OK  — the BUILT APK targets API >= 36 (Play
#                                    floor) and requests none of the
#                                    permissions the product does not use
#   ANDROID_RELEASE_AAB_BUILT      — the same project produces the Play upload
#                                    format (debug-signed proof, not uploadable)
# What it does NOT claim: store signing, Play readiness, an authenticated
# session, deep-link (App Links) verification, physical-device behaviour.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/client-core/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/android-emulator-journey.sh"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/client-core/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/android-emulator-journey.sh"
  workflow_dispatch:
    inputs:
      origin:
        description: "API origin the app talks to (production, or an isolated staging URL the hosting agent names). Empty = https://labourmarket.ai"
        required: false
        default: "https://labourmarket.ai"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # PR runs build the PR head, not GitHub's synthetic merge commit SHA.
  BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: Build internal test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.apk.outputs.artifact }}
      apk_file: ${{ steps.apk.outputs.apk_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # The hosted image ships several GB of toolchains this build never uses;
      # a four-ABI-free RN release build with C++ modules still needs room.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/@aws-cdk || true
          df -h /

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=mobile... --filter=@labourmarket/client-core...

      # Public configuration only — see the header. The Supabase URL is derived
      # from the anon key's `ref` claim; nothing identifying is committed.
      - name: Resolve public build configuration
        id: cfg
        env:
          ANON_KEY: ${{ vars.PROD_QA_ANON_KEY }}
          # Dispatch-only input; empty on push/pull_request, so the fallback
          # keeps every PR build pointed at production. https only: the app
          # refuses cleartext and a typo here must fail before a 40-minute build.
          ORIGIN_INPUT: ${{ inputs.origin }}
        run: |
          ORIGIN="${ORIGIN_INPUT:-https://labourmarket.ai}"
          case "$ORIGIN" in https://*) ;; *) echo "::error::origin must start with https:// (got: $ORIGIN)"; exit 1;; esac
          ORIGIN="${ORIGIN%/}"
          if [ -n "$ANON_KEY" ]; then
            REF=$(node -e 'const p=JSON.parse(Buffer.from(process.env.ANON_KEY.split(".")[1],"base64url").toString());if(p.role!=="anon"){console.error("refusing: key role is "+p.role);process.exit(1)}process.stdout.write(p.ref)')
            echo "EXPO_PUBLIC_SUPABASE_URL=https://${REF}.supabase.co" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_API_BASE_URL=${ORIGIN}" >> "$GITHUB_ENV"
            echo "mode=production public config (anon key from vars.PROD_QA_ANON_KEY; origin ${ORIGIN})" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::vars.PROD_QA_ANON_KEY not set — building with PLACEHOLDER config; the APK cannot sign anyone in"
            echo "EXPO_PUBLIC_SUPABASE_URL=https://example.supabase.co" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_ci_placeholder_not_a_real_key" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_API_BASE_URL=https://example.invalid" >> "$GITHUB_ENV"
            echo "mode=PLACEHOLDER config (build proof only, cannot sign in)" >> "$GITHUB_OUTPUT"
          fi

      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      # Two ABIs, not the template's four: arm64-v8a for real phones, x86_64
      # for the emulator job. 32-bit ABIs only double the C++ build time.
      - name: Gradle assembleRelease (debug-signed internal test build)
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: |
          # Leading newline: the generated gradle.properties has NO trailing
          # newline, and a bare append glued this onto the last property
          # (expo.inlineModules.watchedDirectories) — run 3 proved it.
          printf '\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m\n' >> gradle.properties
          # pipefail: the diagnostic greps below pipe into tail/head; the
          # build's own status is captured explicitly in STATUS either way.
          set -o pipefail
          set +e
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            --no-daemon --stacktrace --info > gradle.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            # A failing configuration-time `node` call prints its stderr BEFORE
            # the FAILURE block — show what led up to it, not just the trace.
            echo "===== configuration-time node invocations ====="
            grep -n -A 3 "Starting process 'command 'node''" gradle.log | tail -40
            echo "===== output leading up to FAILURE ====="
            sed -n '1,/FAILURE:/p' gradle.log | tail -150
            echo "===== error regions ====="
            grep -n -B 3 -A 25 -E "FAILURE:|error:|What went wrong" gradle.log | head -400
            echo "===== last 120 lines ====="
            tail -120 gradle.log
          else
            tail -30 gradle.log
            echo "ANDROID_RELEASE_APK_BUILT"
          fi
          exit $STATUS

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-gradle-log-${{ github.run_id }}
          path: apps/mobile/android/gradle.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Name APK, checksum, job summary
        id: apk
        run: |
          SRC=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC" || { echo "no release APK produced"; exit 1; }
          NAME="labourmarket-android-internal-${BUILD_SHA}"
          mkdir -p dist-apk
          cp "$SRC" "dist-apk/${NAME}.apk"
          SHA256=$(sha256sum "dist-apk/${NAME}.apk" | cut -d' ' -f1)
          BYTES=$(stat -c %s "dist-apk/${NAME}.apk")
          SIGNER=$("$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "dist-apk/${NAME}.apk" | grep -m1 "certificate DN" || echo "unknown")
          echo "artifact=${NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_file=${NAME}.apk" >> "$GITHUB_OUTPUT"
          {
            echo "## Android internal test build"
            echo
            echo "> **Internal test build, debug-signed, NOT for store.** Install by sideloading only."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Artifact | \`${NAME}\` |"
            echo "| Source commit | \`${BUILD_SHA}\` |"
            echo "| Size | ${BYTES} bytes |"
            echo "| sha256 | \`${SHA256}\` |"
            echo "| Signer | ${SIGNER} |"
            echo "| ABIs | arm64-v8a, x86_64 |"
            echo "| Backend config | ${{ steps.cfg.outputs.mode }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sha256=${SHA256} size=${BYTES} signer=${SIGNER}"

      # STORE-POLICY FACTS read from the BUILT artifact, not from app.json:
      # `apps/mobile/android` is generated, so the only honest place to see the
      # target API level and the permission list Play will see is the APK
      # itself. Google Play refuses a new app or update whose targetSdk is
      # below the current floor (API 36 for new apps and updates since
      # 2026-08-31, developer.android.com/google/play/requirements/target-sdk;
      # API 36 is also what the
      # RN 0.86 / Expo 57 version catalog emits). Permissions the product
      # does not use are refused here, so a dependency bump that silently
      # adds one fails CI instead of surfacing in a Play review.
      - name: Store-policy facts (targetSdk, permissions)
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK="dist-apk/${{ steps.apk.outputs.apk_file }}"
          "$BT/aapt2" dump badging "$APK" > badging.txt
          TARGET=$(sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p" badging.txt)
          MIN=$(sed -n "s/^minSdkVersion:'\([0-9]*\)'.*/\1/p" badging.txt)
          PERMS=$(sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" badging.txt | sort -u)
          echo "minSdk=$MIN targetSdk=$TARGET"; echo "$PERMS"
          {
            echo
            echo "### Store-policy facts (from the built APK)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| minSdk | $MIN |"
            echo "| targetSdk | $TARGET |"
            echo "| Permissions | $(echo $PERMS | tr ' ' ',') |"
          } >> "$GITHUB_STEP_SUMMARY"
          FAIL=0
          if [ -z "$TARGET" ] || [ "$TARGET" -lt 36 ]; then
            echo "::error::targetSdkVersion '$TARGET' is below the Google Play floor (36 since 2026-08-31)"; FAIL=1
          fi
          for P in android.permission.READ_EXTERNAL_STORAGE android.permission.WRITE_EXTERNAL_STORAGE \
                   android.permission.CAMERA android.permission.RECORD_AUDIO \
                   android.permission.ACCESS_FINE_LOCATION android.permission.ACCESS_COARSE_LOCATION \
                   android.permission.READ_CONTACTS android.permission.READ_MEDIA_IMAGES \
                   android.permission.SYSTEM_ALERT_WINDOW android.permission.USE_BIOMETRIC \
                   android.permission.USE_FINGERPRINT \
                   com.google.android.gms.permission.AD_ID; do
            if echo "$PERMS" | grep -qx "$P"; then
              echo "::error::$P is requested but the product does not use it (docs/mobile/STORE_RELEASE_READINESS_2026-09-13.md)"; FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] && echo "ANDROID_STORE_POLICY_FACTS_OK"
          exit $FAIL

      # The Play upload format is an Android App Bundle. This proves the SAME
      # project produces one; it is debug-signed exactly like the APK and is
      # NOT uploadable — store signing is EAS / owner territory. Not uploaded
      # as an artifact: a debug-signed bundle has no use outside this proof.
      - name: Gradle bundleRelease (AAB build proof, NOT uploadable)
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: |
          ./gradlew :app:bundleRelease \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            --no-daemon > bundle.log 2>&1 || { tail -150 bundle.log; exit 1; }
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "no release AAB produced"; exit 1; }
          BYTES=$(stat -c %s "$AAB")
          echo "ANDROID_RELEASE_AAB_BUILT ($BYTES bytes, debug-signed, not uploadable)"
          echo "| AAB (proof only) | built, $BYTES bytes, debug-signed — NOT for upload |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: dist-apk/${{ steps.apk.outputs.apk_file }}
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Emulator launch + Maestro journey
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist-apk

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # Hardware acceleration for the x86_64 emulator, per
      # reactivecircus/android-emulator-runner's README.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Emulator — install, launch, Maestro journey
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-emulator-journey.sh "dist-apk/${{ needs.build.outputs.apk_file }}" android-artifacts

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-runtime-journey-${{ github.run_id }}
          # The shared flow names its screenshots ios-artifacts/... (it was
          # written for ios.yml first); upload both directories.
          path: |
            android-artifacts/
            ios-artifacts/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
