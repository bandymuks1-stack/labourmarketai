name: Android

# Real, installable Android build of the EXISTING Expo app (apps/mobile) on
# GitHub's hosted Linux runners, plus an emulator runtime journey. The Android
# sibling of ios.yml — same shape: prebuild → native build → launch check →
# Maestro journey (apps/mobile/.maestro/auth-failure-journey.yaml).
#
# INTERNAL TEST BUILD — DEBUG-SIGNED — NOT FOR STORE.
# `expo prebuild` generates a release buildType that signs with the template's
# debug keystore when no release signing is configured. That is exactly what
# this workflow relies on. No keystore, upload key or signing secret exists in
# this repository or this workflow, and none may be added here: store signing
# is EAS / owner territory (docs/mobile/STORE_RELEASE_READINESS_2026-09-13.md).
# The APK installs on any Android 7+ device with "install unknown apps"
# allowed; Play Store will refuse it, by design.
#
# WHY RELEASE, NOT DEBUG: same reason as ios.yml — a debug build loads its
# JavaScript from a Metro server that does not exist on the runner or on a
# tester's phone. Release embeds the Hermes bundle, so the APK runs standalone.
#
# CONFIGURATION — PUBLIC VALUES ONLY. The bundle is built against PRODUCTION
# public configuration so a tester can actually use the APK:
#   EXPO_PUBLIC_SUPABASE_ANON_KEY  vars.PROD_QA_ANON_KEY (the project's
#                                  publishable anon key; a repository VARIABLE,
#                                  not a secret — RLS protects the data, and
#                                  client-core REFUSES a service-role key)
#   EXPO_PUBLIC_SUPABASE_URL       derived from that key's own `ref` claim, so
#                                  no project identifier is committed here
#   EXPO_PUBLIC_API_BASE_URL       https://labourmarket.ai
# If the variable is absent the build falls back to the same deterministic
# placeholders mobile.yml / ios.yml use and the job summary says so — the APK
# then cannot sign anyone in and is a build proof only.
#
# NOT a required check (same deliberate introduction as ios.yml / mobile.yml).
#
# What this workflow can honestly claim when green:
#   ANDROID_RELEASE_APK_BUILT      — Gradle compiles, links and packages the
#                                    real app with an embedded Hermes bundle
#   ANDROID_EMU_LAUNCH_PROVEN      — the APK installs on an API 34 emulator and
#                                    the process is alive 15s after launch
#   ANDROID_RUNTIME_JOURNEY_PROVEN — the auth screen RENDERS, a real sign-in
#                                    attempt (fictional credentials) runs, the
#                                    failure is SHOWN (testID auth-failure) and
#                                    the app survives it
# What it does NOT claim: store signing, Play readiness, an authenticated
# session, deep-link (App Links) verification, physical-device behaviour.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/client-core/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/android-emulator-journey.sh"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/client-core/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/android-emulator-journey.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # PR runs build the PR head, not GitHub's synthetic merge commit SHA.
  BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: Build internal test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.apk.outputs.artifact }}
      apk_file: ${{ steps.apk.outputs.apk_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # The hosted image ships several GB of toolchains this build never uses;
      # a four-ABI-free RN release build with C++ modules still needs room.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/@aws-cdk || true
          df -h /

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=mobile... --filter=@labourmarket/client-core...

      # Public configuration only — see the header. The Supabase URL is derived
      # from the anon key's `ref` claim; nothing identifying is committed.
      - name: Resolve public build configuration
        id: cfg
        env:
          ANON_KEY: ${{ vars.PROD_QA_ANON_KEY }}
        run: |
          if [ -n "$ANON_KEY" ]; then
            REF=$(node -e 'const p=JSON.parse(Buffer.from(process.env.ANON_KEY.split(".")[1],"base64url").toString());if(p.role!=="anon"){console.error("refusing: key role is "+p.role);process.exit(1)}process.stdout.write(p.ref)')
            echo "EXPO_PUBLIC_SUPABASE_URL=https://${REF}.supabase.co" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_API_BASE_URL=https://labourmarket.ai" >> "$GITHUB_ENV"
            echo "mode=production public config (anon key from vars.PROD_QA_ANON_KEY)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::vars.PROD_QA_ANON_KEY not set — building with PLACEHOLDER config; the APK cannot sign anyone in"
            echo "EXPO_PUBLIC_SUPABASE_URL=https://example.supabase.co" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_ci_placeholder_not_a_real_key" >> "$GITHUB_ENV"
            echo "EXPO_PUBLIC_API_BASE_URL=https://example.invalid" >> "$GITHUB_ENV"
            echo "mode=PLACEHOLDER config (build proof only, cannot sign in)" >> "$GITHUB_OUTPUT"
          fi

      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      # Two ABIs, not the template's four: arm64-v8a for real phones, x86_64
      # for the emulator job. 32-bit ABIs only double the C++ build time.
      - name: Gradle assembleRelease (debug-signed internal test build)
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          set +e
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            --no-daemon --stacktrace > gradle.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            # A failing configuration-time `node` call prints its stderr BEFORE
            # the FAILURE block — show what led up to it, not just the trace.
            echo "===== output leading up to FAILURE ====="
            sed -n '1,/FAILURE:/p' gradle.log | tail -150
            echo "===== error regions ====="
            grep -n -B 3 -A 25 -E "FAILURE:|error:|What went wrong" gradle.log | head -400
            echo "===== last 120 lines ====="
            tail -120 gradle.log
          else
            tail -30 gradle.log
            echo "ANDROID_RELEASE_APK_BUILT"
          fi
          exit $STATUS

      - name: Name APK, checksum, job summary
        id: apk
        run: |
          SRC=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC" || { echo "no release APK produced"; exit 1; }
          NAME="labourmarket-android-internal-${BUILD_SHA}"
          mkdir -p dist-apk
          cp "$SRC" "dist-apk/${NAME}.apk"
          SHA256=$(sha256sum "dist-apk/${NAME}.apk" | cut -d' ' -f1)
          BYTES=$(stat -c %s "dist-apk/${NAME}.apk")
          SIGNER=$("$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "dist-apk/${NAME}.apk" | grep -m1 "certificate DN" || echo "unknown")
          echo "artifact=${NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_file=${NAME}.apk" >> "$GITHUB_OUTPUT"
          {
            echo "## Android internal test build"
            echo
            echo "> **Internal test build, debug-signed, NOT for store.** Install by sideloading only."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Artifact | \`${NAME}\` |"
            echo "| Source commit | \`${BUILD_SHA}\` |"
            echo "| Size | ${BYTES} bytes |"
            echo "| sha256 | \`${SHA256}\` |"
            echo "| Signer | ${SIGNER} |"
            echo "| ABIs | arm64-v8a, x86_64 |"
            echo "| Backend config | ${{ steps.cfg.outputs.mode }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sha256=${SHA256} size=${BYTES} signer=${SIGNER}"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: dist-apk/${{ steps.apk.outputs.apk_file }}
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Emulator launch + Maestro journey
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist-apk

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # Hardware acceleration for the x86_64 emulator, per
      # reactivecircus/android-emulator-runner's README.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Emulator — install, launch, Maestro journey
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-emulator-journey.sh "dist-apk/${{ needs.build.outputs.apk_file }}" android-artifacts

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-runtime-journey-${{ github.run_id }}
          # The shared flow names its screenshots ios-artifacts/... (it was
          # written for ios.yml first); upload both directories.
          path: |
            android-artifacts/
            ios-artifacts/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
