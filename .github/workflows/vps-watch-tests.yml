name: VPS watch tests

# Real users, real systemd units and the real receiver on GitHub's throw-away machine, with invented secrets and
# invented backups (ops/vps/lm-watch-sandbox.test.sh). No secret, no production host and no network to production.

on:
  pull_request:
    paths:
      - "ops/vps/**"
      - ".github/workflows/vps-watch-tests.yml"
  push:
    branches: [main]
    paths:
      - "ops/vps/**"
      - ".github/workflows/vps-watch-tests.yml"

permissions:
  contents: read

concurrency:
  group: vps-watch-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: acl tools
        run: sudo apt-get install -y -qq acl >/dev/null
      - name: Sandbox, access and alert tests
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" bash ops/vps/lm-watch-sandbox.test.sh
      - name: Invitation delivery script (alert de-duplication, no secret in logs)
        run: sh ops/vps/lm-invitation-delivery-retry.test.sh
