# Job alerts cadence (stream N): daily sweep that tells registered workers about
# NEW real active jobs fitting their stated profession + countries + salary.
#
# Why GitHub Actions and not vercel.json: the Vercel Hobby plan already holds the
# maximum number of crons; the supply cadences use Actions the same way.
#
# INERT BY DEFAULT: no-ops until the repo variable JOB_ALERTS_SCHEDULE_ENABLED=true
# and the secret CRON_SECRET are set in the GitHub console (never committed).
# Kill switch: unset the variable. The endpoint itself returns 503 + a reason
# code while the service_role SELECT grant (20261001120000) is not applied.
name: job-alerts-cadence

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: job-alerts-cadence
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gate
        id: gate
        env:
          ENABLED: ${{ vars.JOB_ALERTS_SCHEDULE_ENABLED }}
          HAS_SECRET: ${{ secrets.CRON_SECRET != '' }}
        run: |
          if [ "$ENABLED" != "true" ] || [ "$HAS_SECRET" != "true" ]; then
            echo "gated=true" >> "$GITHUB_OUTPUT"
            echo "Inert: JOB_ALERTS_SCHEDULE_ENABLED / CRON_SECRET not configured (designed no-op)."
          else
            echo "gated=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the sweep
        if: steps.gate.outputs.gated == 'false'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o body.json -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" https://labourmarket.ai/api/cron/job-alerts)
          echo "status=$code"
          cat body.json
          [ "$code" = "200" ]
