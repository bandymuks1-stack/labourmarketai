name: iOS

# Native iOS proof on GitHub's macOS runners — the authorized macOS
# environment this repository already has (public repo, hosted runners).
#
# WHY IT IS ITS OWN WORKFLOW: same reasoning as mobile.yml — `quality` is the
# required, fast, secret-free merge gate; an Xcode build takes tens of minutes
# and no web PR needs it. NOT a required check. A red run here does not block
# a merge until the owner reviews it and adds it to branch protection — the
# same deliberate introduction CodeQL and mobile.yml had.
#
# Secret-free. The app is built and launched with PLACEHOLDER public
# configuration: it proves the native project compiles, links every pod
# (Hermes, Reanimated 4.5.1, Worklets 0.10.1, Screens 4.27 — the exact
# versions the Android build proved) and starts on a simulator without
# crashing. It never reaches a real backend: the Maestro journey below
# ATTEMPTS a sign-in against https://example.supabase.co (deterministic
# bad-network config) precisely to prove the failure is surfaced honestly.
#
# WHY RELEASE, NOT DEBUG (changed with the runtime-journey proof): a Debug
# build's bundleURL() points at a Metro dev server, which does not exist on
# the runner — the Debug app "alive after 15s" was a shell with NO JavaScript
# loaded, so a blank screen passed. Release runs `expo export:embed` inside
# the Xcode build phase (the same bundler mobile.yml proves on Linux), inlines
# the EXPO_PUBLIC_* placeholders into the embedded Hermes bundle, and loads
# it with no server — the only configuration whose UI can be asserted in CI.
#
# What this workflow can honestly claim when green:
#   IOS_NATIVE_BUILD_PROVEN      — xcodebuild compiles and links the real app
#   IOS_SIM_LAUNCH_PROVEN        — the app process starts and stays alive 15s
#   IOS_RUNTIME_JOURNEY_PROVEN   — the auth screen RENDERS, a real sign-in
#                                  attempt runs, the failure state is SHOWN
#                                  (testID auth-failure), and the app survives
#                                  it (Maestro flow apps/mobile/.maestro/)
# What it deliberately does NOT claim: device builds, signing, App Store
# readiness, a real-backend authenticated session or deep-link E2E (those
# need a session against a real backend and are a later, separate proof).

on:
  # Paths-filtered: this workflow is NOT a required check (see header), so
  # skipping it on web-only changes narrows no merge gate — it only stops
  # spending 40+ macOS minutes on PRs that cannot change the mobile app.
  # (mobile.yml's no-filter lessons applied to a required-adjacent quality
  # signal; this one is an explicit, self-contained proof.)
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/client-core/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/client-core/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    # Was 60 for build+launch; Release adds the embedded-bundle export and the
    # Maestro journey adds CLI install + XCTest driver startup + the flow.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=mobile... --filter=@labourmarket/client-core...

      # Measured toolchain requirement (runs 2-4 + expo/expo#46242):
      # expo-modules-jsi needs Xcode 26.4+ (Swift 6.3) — 16.4 is too old
      # (Swift 6.1 < tools 6.2) and every 26.0-26.3 fails the Swift/C++
      # interop rules in RuntimeScheduler.h. macos-15 tops out at 26.3,
      # hence runs-on: macos-26 (default Xcode 26.4.1). Newest wins.
      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $NEWEST (available: $(ls -d /Applications/Xcode*.app | tr '\n' ' '))"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          swift --version

      - name: Expo prebuild (iOS)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: CocoaPods install
        working-directory: apps/mobile/ios
        run: pod install

      # The workspace/scheme names derive from app.json's display name; read
      # them from the generated project instead of hardcoding a guess.
      # NOT schemes[0]: the workspace lists every Pods scheme too, and
      # alphabetically that made run 5 "successfully" build EXConstants
      # instead of the app. The app scheme matches the .xcodeproj name.
      - name: Discover workspace and scheme
        id: xc
        working-directory: apps/mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$(ls -d *.xcodeproj | head -1)" .xcodeproj)
          xcodebuild -workspace "$WS" -list -json | python3 -c 'import json,sys; print("schemes:", json.load(sys.stdin)["workspace"]["schemes"])'
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WS scheme=$SCHEME"

      # Release, not Debug: Debug loads JS from a Metro server that does not
      # exist here (a Debug app on the runner renders NOTHING). Release embeds
      # the Hermes bundle via `expo export:embed` in the build phase, with the
      # EXPO_PUBLIC_* placeholders below inlined at bundle time — the runtime
      # journey asserts the UI those values produce.
      - name: Xcode build (simulator, Release, ad-hoc signed, embedded bundle)
        working-directory: apps/mobile/ios
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder_not_a_real_key
          EXPO_PUBLIC_API_BASE_URL: https://example.invalid
        # ONLY_ACTIVE_ARCH=YES: the hosted runner is arm64; without it
        # xcodebuild also builds the x86_64 simulator slice, which is where
        # the first run failed (ReactCodegen x86_64 objects). One slice is
        # all this proof needs.
        # CODE_SIGN_IDENTITY=- (ad hoc, certless) instead of the old
        # CODE_SIGNING_ALLOWED=NO: a wholly UNSIGNED app has no
        # application-identifier entitlement, so every keychain call
        # (expo-secure-store) fails on the simulator — journey run 1 proved it:
        # the app rendered the honest "secure storage did not answer" state
        # instead of the sign-in form. Ad-hoc signing needs no certificate and
        # restores the keychain.
        # Full log goes to a file; on failure the error region is printed —
        # a bare `tail -200` swallowed the actual error text on run 1.
        run: |
          set +e
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build > xcodebuild.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "===== error regions ====="
            grep -n -B 3 -A 20 " error: " xcodebuild.log | head -400
            echo "===== last 80 lines ====="
            tail -80 xcodebuild.log
          else
            tail -30 xcodebuild.log
          fi
          exit $STATUS

      - name: Simulator launch smoke (15s alive, no startup crash)
        working-directory: apps/mobile/ios
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -1)
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(dev["udid"] for devs in d.values() for dev in devs if dev["isAvailable"]))')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" ai.labourmarket.app
          sleep 15
          # Startup-crash detector: the process must still be alive.
          xcrun simctl spawn "$UDID" launchctl list | grep -q "ai.labourmarket.app" \
            && echo "IOS_SIM_LAUNCH_PROVEN: app alive after 15s" \
            || { echo "app not running after 15s — startup crash"; exit 1; }

      # ---------- runtime JOURNEY proof (IOS_RUNTIME_JOURNEY_PROVEN) ----------
      # The smoke above proves process liveness only — a blank screen passes
      # it. The Maestro flow proves the auth screen RENDERS, a real sign-in
      # attempt runs against the deterministic bad-network config, the failure
      # is SURFACED (testID auth-failure), and the app survives it.

      - name: Evidence — screenshot before the journey
        run: |
          mkdir -p ios-artifacts
          xcrun simctl io "$SIM_UDID" screenshot ios-artifacts/00-post-launch.png

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Maestro runtime journey (auth render → sign-in attempt → surfaced failure)
        env:
          # iOS XCTest driver default is 120s; hosted runners are slow to
          # build/boot the driver the first time.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          maestro test apps/mobile/.maestro/auth-failure-journey.yaml \
            --debug-output ios-artifacts/maestro-debug
          echo "IOS_RUNTIME_JOURNEY_PROVEN: auth screen rendered, sign-in attempted, failure state surfaced, app interactive after failure"

      - name: Evidence on failure — simulator log
        if: failure()
        run: |
          mkdir -p ios-artifacts
          xcrun simctl io "$SIM_UDID" screenshot ios-artifacts/99-on-failure.png || true
          xcrun simctl spawn "$SIM_UDID" log show --style compact --last 15m \
            --predicate 'processImagePath CONTAINS "LabourMarketai" OR processImagePath CONTAINS "SpringBoard"' \
            > ios-artifacts/simulator-log.txt || true

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-runtime-journey-${{ github.run_id }}
          path: ios-artifacts/
          if-no-files-found: ignore
          # Maestro writes its debug output under a hidden `.maestro/` subdir,
          # which upload-artifact skips by default (run 1 uploaded nothing
          # from --debug-output).
          include-hidden-files: true
          retention-days: 14
