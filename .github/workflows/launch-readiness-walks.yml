name: launch-readiness-walks

# OWNER ORDER 2026-11-20: first, the final production proof of 11.8 (company-governance, desktop;
# training assigned to an engaged worker after #2816 was applied). Then the launch-readiness plan.
# OWNER ORDER 2026-11-19: launch readiness of the free platform. Fifteen production walks on the
# current production build: five scenarios x three screens. The verdict is READY only if all
# fifteen pass.
# OWNER ORDER 2026-11-21: final Chrome acceptance of the eight user scenarios (sign-up, worker,
# employer, agency, subcontractor, student/education, AI, administration) appended to the plan, up to
# 24 walks per UTC day until 2026-11-23.
#
# This is the acceptance-campaign pattern (owner-approved 2026-10-21), narrowed to one fixed plan.
# GitHub's own scheduler runs it, independently of any agent session or the owner's computer. A tick:
#   1. dispatches the next pair of the plan that has no completed workflow_dispatch run since
#      WINDOW_START, through prod-qa-walk.yml, WITHOUT budget_override;
#   2. waits for that run;
#   3. hands over to a fresh tick.
#
# At most DAILY_CAP plan walks per UTC day (owner decision 2026-11-19).
# Every brake of prod-qa-walk.yml still applies unchanged: health, deploy, errors, the 180 s gap and
# the 24 h budget of 48. This workflow adds no secret, writes nothing to production itself, and
# passes nothing but `spec` and `device`. A failed pair is re-run only after a production deploy that
# finished after the failed walk (a fix shipped); otherwise it stays failed. Outside the window the job exits without doing anything.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}
  # Merging a change to this file starts the first tick at once (GitHub's scheduler did not fire
  # the cron for hours after the workflow was added). Each tick still checks the window and skips
  # pairs that have already run.
  push:
    branches: [main]
    paths: [".github/workflows/launch-readiness-walks.yml"]

permissions:
  actions: write
  contents: read

concurrency:
  group: launch-readiness-walks
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Dispatch the next pair, wait for it, hand over
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WINDOW_START: "2026-11-19T20:00:00Z"
          WINDOW_END: "2026-11-24T00:00:00Z"
          # Owner decision 2026-11-19: at most 6 plan walks per UTC day (Supabase Free log quota).
          # Owner decision 2026-11-21: the project is on Supabase Pro; up to 24 per UTC day until
          # 2026-11-23, while production stays stable (every prod-qa-walk brake still applies).
          DAILY_CAP: "24"
        run: |
          set -euo pipefail
          PLAN="company-governance:desktop
                profile-cv-history:desktop profile-cv-history:phone profile-cv-history:phone-375
                company-chain:desktop company-chain:phone company-chain:phone-375
                need-intake:desktop need-intake:phone need-intake:phone-375
                agency-chain:desktop agency-chain:phone agency-chain:phone-375
                learning-practice:desktop learning-practice:phone learning-practice:phone-375
                role-routes:desktop role-routes:phone fresh-activation:desktop invited-worker:phone
                jobs-search:desktop jobs-search:phone journal-confirm:desktop journal-confirm:phone
                chat-continuity:phone worker-records-exports:desktop notifications-inapp:phone
                org-roster:desktop org-roster:phone brigade-formation:desktop project-execution:desktop
                project-context:desktop calendar-planning:desktop rota-repeat:desktop
                marketplace-goods-services:desktop marketplace-goods-services:phone orders-bookings:desktop
                orders-bookings:phone marketplace:desktop buyer-workspace:desktop
                chat-confirm-once:desktop manager-chat:desktop mcp-chain:desktop mcp-agents:desktop
                ai-off-honesty:desktop
                documents-approvals:desktop search-support-privacy:desktop company-talent-history:desktop
                worker-identity-split:desktop staff-review-notice:desktop public-org-locales:phone
                mobile-surfaces:phone"
          log() { echo "$(date -u +%H:%M) $*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          now=$(date -u +%FT%TZ)
          if [[ "$now" < "$WINDOW_START" || ! "$now" < "$WINDOW_END" ]]; then
            log "outside the launch-readiness window: nothing to do"; exit 0
          fi

          # Never alongside another manual or scheduled walk. Push runs serialise in the walk job.
          busy=$(gh run list -R "$REPO" -w prod-qa-walk.yml --limit 20 --json status,event \
            --jq '[.[] | select(.status != "completed" and .event != "push")] | length')
          if [ "$busy" -gt 0 ]; then log "a walk is in flight ($busy): the next tick continues"; exit 0; fi

          # The pairs that already have a completed dispatch since the window opened (title: "prod-qa-walk <spec> <device>").
          done_titles=$(gh run list -R "$REPO" -w prod-qa-walk.yml --event workflow_dispatch --status completed \
            --created ">=${WINDOW_START%%T*}" --limit 200 --json displayTitle,createdAt,conclusion,databaseId \
            --jq ".[] | select(.createdAt >= \"$WINDOW_START\") | \"\(.displayTitle)\t\(.conclusion)\t\(.databaseId)\"")

          # A pair counts as run only if its walk job actually ran (success or failure). A run refused by a
          # brake before the walk job (health, deploy, budget) does not count, and is dispatched again.
          # A pair is settled when a walk of it passed, or when it failed and no production deploy has
          # finished since that walk ended. A failed pair is re-run once a fix has been deployed after it.
          last_deploy=$(gh run list -R "$REPO" -w deploy-vps.yml --branch main --status success --limit 1 \
            --json updatedAt --jq '.[0].updatedAt // ""')
          ran() {
            local ids id c ended
            ids=$(printf '%s\n' "$done_titles" | awk -F'\t' -v t="prod-qa-walk $1 $2" '$1 == t {print $3}')
            for id in $ids; do
              c=$(gh run view "$id" -R "$REPO" --json jobs --jq '[.jobs[] | select(.name=="walk") | .conclusion][0] // ""')
              # A walk job that failed BEFORE its Provision step (a brake re-checked inside the walk job,
              # e.g. production health) never reached production: it is not a run of the pair.
              if [ "$c" = failure ]; then
                reached=$(gh api "repos/$REPO/actions/runs/$id/jobs?filter=all&per_page=100" \
                  --jq '[.jobs[] | select(.name == "walk") | .steps[]? | select(.name | startswith("Provision")) | select((.status == "in_progress" or .status == "completed") and .conclusion != "skipped")] | length')
                [ "${reached:-0}" -gt 0 ] || continue
              fi
              case "$c" in
                success) return 0 ;;
                failure)
                  ended=$(gh run view "$id" -R "$REPO" --json jobs --jq '[.jobs[] | select(.name=="walk") | .completedAt][0] // ""')
                  [[ -n "$last_deploy" && "$last_deploy" > "$ended" ]] || return 0 ;;
              esac
            done
            return 1
          }
          # Plan walks whose walk job ran today (UTC) count against the daily cap.
          today=$(date -u +%F); ran_today=0
          while IFS=$'\t' read -r t c id; do
            [ -n "${id:-}" ] || continue
            case "$t" in "prod-qa-walk "*) ;; *) continue ;; esac
            pair_ok=0; for pair in $PLAN; do [ "$t" = "prod-qa-walk ${pair%%:*} ${pair##*:}" ] && pair_ok=1; done
            [ "$pair_ok" = 1 ] || continue
            started=$(gh api "repos/$REPO/actions/runs/$id/jobs?filter=all&per_page=100" \
              --jq '[.jobs[] | select(.name == "walk") | .steps[]? | select(.name | startswith("Provision")) | select((.status == "in_progress" or .status == "completed") and .conclusion != "skipped") | .started_at][0] // ""')
            case "$started" in "$today"*) ran_today=$((ran_today + 1)) ;; esac
          done <<< "$done_titles"
          if [ "$ran_today" -ge "$DAILY_CAP" ]; then
            log "today's cap reached ($ran_today of $DAILY_CAP plan walks): the next UTC day continues"; exit 0
          fi

          next=""
          for pair in $PLAN; do
            spec=${pair%%:*}; device=${pair##*:}
            if ! ran "$spec" "$device"; then next="$pair"; break; fi
          done

          if [ -z "$next" ]; then
            log "every plan pair has run since $WINDOW_START:"
            printf '%s\n' "$done_titles" | sort | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          spec=${next%%:*}; device=${next##*:}
          prod_sha=$(gh run list -R "$REPO" -w deploy-vps.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          before=$(gh run list -R "$REPO" -w prod-qa-walk.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run prod-qa-walk.yml -R "$REPO" --ref main -f spec="$spec" -f device="$device"
          log "dispatched: $spec $device (last successful deploy ${prod_sha:0:8}; no override)"
          id=""
          for _ in $(seq 1 30); do
            sleep 10
            id=$(gh run list -R "$REPO" -w prod-qa-walk.yml --event workflow_dispatch --limit 10 --json databaseId,displayTitle \
              --jq "[.[] | select(.databaseId > $before and .displayTitle == \"prod-qa-walk $spec $device\") | .databaseId] | min // empty")
            [ -n "$id" ] && break
          done
          if [ -z "$id" ]; then log "the dispatched run did not appear; the next scheduled tick continues"; exit 0; fi
          until [ "$(gh run view "$id" -R "$REPO" --json status --jq .status)" = completed ]; do sleep 60; done
          conclusion=$(gh run view "$id" -R "$REPO" --json conclusion --jq .conclusion)
          walk=$(gh run view "$id" -R "$REPO" --json jobs --jq '[.jobs[] | select(.name=="walk") | .conclusion][0] // ""')
          log "$spec $device run $id: $conclusion, walk job: ${walk:-none} (deploy ${prod_sha:0:8})"
          # Hand over only if the walk reached production (its Provision step started); a brake inside the
          # walk job leaves the retry to the hourly tick, as a brake before it does.
          reached=$(gh api "repos/$REPO/actions/runs/$id/jobs?filter=all&per_page=100" \
            --jq '[.jobs[] | select(.name == "walk") | .steps[]? | select(.name | startswith("Provision")) | select((.status == "in_progress" or .status == "completed") and .conclusion != "skipped")] | length')
          [ "${reached:-0}" -gt 0 ] || walk="refused"
          case "$walk" in
            success|failure)
              gh workflow run launch-readiness-walks.yml -R "$REPO" --ref main
              log "handed over to a fresh tick" ;;
            *)
              # A brake refused it before the walk (health, deploy, budget): no fast loop. The hourly
              # scheduled tick tries again.
              log "a brake refused the walk; the next scheduled tick tries again" ;;
          esac
