name: Post-deploy smoke (public critical path, read-only)

# A STABLE VERIFICATION WINDOW AFTER EVERY DEPLOY (owner 2026-11-12: "after each
# deploy make sure there is a stable check window and record the result with the
# production commit").
#
# Why this exists. The signed-in production walk (prod-qa-walk.yml) starts 120
# minutes after the LAST push to main, and every newer push cancels the waiting
# one — by design, so a merge burst spends one walk, not ten. On a day with a
# merge every hour that walk never starts, and no deploy gets a recorded result.
# This workflow is the part that can run after EVERY deploy, because it costs
# nothing the walk's limits protect: no account, no secret, no write, no walk
# budget, about a dozen public page loads.
#
# What it checks, about 5 minutes, signed out:
#   - which build production serves, at the start and at the end (a result is
#     only recorded for a build that did not change underneath it);
#   - the security headers a stranger's browser receives;
#   - route-group chunks under both spellings of their path, when that probe is
#     in the tree (.github/scripts/encoded-chunk-probe.mjs);
#   - the first-visitor and sign-up path in lt and en at 360 and 1440 px: home,
#     for-workers, for-companies, company-need, jobs, pricing, sign-in, sign-up
#     — error screens, failed scripts, broken link targets, dead buttons.
#
# Then, never on a pull request, the `signed-in` job opens FOUR signed-in
# documents with two synthetic sessions, read-only: the worker's home and work
# journal, the employer's needs surface, the inbox
# (apps/web/tests/e2e/prod-deploy-smoke.spec.ts). It proves those surfaces OPEN
# on the new build. Posting a need, sending a message and every other signed-in
# journey stay with prod-qa-walk.yml, which is unchanged: this adds to the full
# walks and replaces none of them.
#
# COST PER DEPLOY (so the owner can see it): 16 public pages at two widths plus
# their link targets, and 4 signed-in documents — about 36 Supabase calls each
# by the measurement recorded in prod-qa-walk.yml, so roughly 150 calls, plus
# two session mints and two sign-outs. The post-merge role-routes walk is 114
# signed-in documents; this is under 4 % of one. It is NOT counted in
# PROD_QA_WALK_DAILY_BUDGET (that counts prod-qa-walk runs) and it keeps the
# walk's health and deploy brakes.
#
# ONE DEPLOY QUEUE (owner P0 2026-11-24). After every deploy this workflow is
# CALLED by deploy-vps.yml (`workflow_call`, input `deploy_sha`) as jobs of the
# deploy run itself, inside its `deploy-vps` concurrency group: the next deploy
# cannot start until this deploy's checks have finished, so a check never meets
# another deploy. It is no longer triggered on its own after a deploy.
#
# Three results, never mixed up:
#   PASS     the check ran on the deploy's build and passed;
#   FAIL     the check ran on the deploy's build and failed: the `report` job
#            opens the regression issue with the `deploy-freeze` label, and
#            deploy-vps.yml refuses normal deploys while it is open;
#   BLOCKED  the check did NOT run (production never settled on the deploy's
#            build, or a walk brake refused for the whole bounded wait). The
#            job is red with "did NOT run" and no issue is opened or closed.
#
# A manual dispatch (workflow_dispatch) re-checks whatever production serves,
# in its own group, outside the deploy queue.

on:
  workflow_call:
    inputs:
      deploy_sha:
        description: "The full sha deploy-vps.yml has just shipped"
        type: string
        required: true
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/post-deploy-smoke.yml"

permissions:
  contents: read

# Called from deploy-vps.yml: a group of its own run (the caller already holds
# `deploy-vps`; reusing that name here would deadlock). Otherwise one queue for
# manual re-checks, one per pull request.
concurrency:
  group: post-deploy-smoke-${{ inputs.deploy_sha && format('in-deploy-{0}', github.run_id) || (github.event_name == 'pull_request' && github.ref || 'production') }}
  cancel-in-progress: false

jobs:
  smoke:
    # A deploy that failed rolled itself back; there is no new build to record.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build: ${{ steps.build.outputs.build }}
      # `changed` when production moved to another build during the run: the run
      # proves nothing about either build, and `report` leaves the issue alone.
      window: ${{ steps.record.outputs.window }}
      # `ran`, or `blocked` (NOT RUN) when production never settled on the deploy's build
      # or the runner setup failed (pnpm, Node, install, browser): not a production regression.
      state: ${{ (steps.setup_pnpm.outcome == 'failure' || steps.setup_node.outcome == 'failure' || steps.install.outcome == 'failure' || steps.playwright.outcome == 'failure') && 'blocked' || steps.build.outputs.state }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The blue/green switch has just ended: give the old server its drain time,
      # then require three healthy answers in a row from ONE build — inside the
      # deploy queue, from THIS deploy's build. Bounded (about 5 minutes); if it
      # never settles the check is BLOCKED (did not run), not failed.
      - name: Production is settled on one build
        id: build
        env:
          EXPECT: ${{ inputs.deploy_sha }}
        run: |
          set -euo pipefail
          [ -n "$EXPECT" ] && sleep 60
          want="${EXPECT:0:8}"
          last=""; same=0
          for i in $(seq 1 30); do
            body=$(curl -sS --max-time 20 https://labourmarket.ai/api/health || true)
            b=$(printf '%s' "$body" | jq -r 'if .ok == true then .build else empty end' 2>/dev/null || true)
            if [ -n "$want" ] && [ "$b" != "$want" ]; then b=""; fi
            if [ -n "$b" ] && [ "$b" = "$last" ]; then same=$((same+1)); else same=0; fi
            last="$b"
            [ "$same" -ge 2 ] && break
            sleep 10
          done
          if [ "$same" -lt 2 ]; then
            if [ -n "$want" ]; then target="the build of this deploy ($want)"; else target="one build"; fi
            echo "state=blocked" >> "$GITHUB_OUTPUT"
            echo "**BLOCKED: production did not give three healthy answers from $target. The smoke did NOT run.**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::BLOCKED: production did not settle on $target; the smoke did not run"
            exit 1
          fi
          echo "state=ran" >> "$GITHUB_OUTPUT"
          echo "build=$last" >> "$GITHUB_OUTPUT"
          echo "### Post-deploy smoke — production build \`$last\` ($(date -u +%Y-%m-%dT%H:%MZ))" >> "$GITHUB_STEP_SUMMARY"

      - name: Security headers a stranger's browser receives
        run: |
          set -euo pipefail
          h=$(curl -sS -o /dev/null -D - --max-time 30 https://labourmarket.ai/en | tr -d '\r')
          fail=0
          need() {
            if printf '%s\n' "$h" | grep -qiE "^$1: .*$2"; then echo "ok   $1"; else echo "FAIL $1 (expected to contain: $2)"; fail=1; fi
          }
          need "x-frame-options" "DENY"
          need "x-content-type-options" "nosniff"
          need "referrer-policy" "strict-origin-when-cross-origin"
          need "strict-transport-security" "max-age="
          need "permissions-policy" "."
          [ "$fail" -eq 0 ]

      - name: Route-group chunks under both spellings (when the probe is in the tree)
        run: |
          set -euo pipefail
          if [ -f .github/scripts/encoded-chunk-probe.mjs ]; then
            node .github/scripts/encoded-chunk-probe.mjs https://labourmarket.ai
          else
            echo "probe not in this tree yet: skipped" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile --filter=!mobile

      - name: Install Playwright chromium
        id: playwright
        run: pnpm -F web exec playwright install --with-deps chromium

      - name: First visitor and sign-up path, lt and en, 360 and 1440 px
        run: |
          set -euo pipefail
          pages=""
          for l in lt en; do
            for p in "" /for-workers /for-companies /company-need /jobs /pricing /auth/login /auth/signup; do
              pages="${pages:+$pages,}/$l$p"
            done
          done
          node apps/web/scripts/public-cta-crawl.mjs --origin https://labourmarket.ai --locales lt,en --only "$pages" --no-discover --out smoke.json | tee smoke.log

      - name: Record the result against the build
        id: record
        if: always()
        run: |
          set -euo pipefail
          after=$(curl -sS --max-time 30 https://labourmarket.ai/api/health | jq -r 'if .ok == true then .build else empty end' || true)
          if [ -n "${{ steps.build.outputs.build }}" ] && [ -n "$after" ] && [ "$after" != "${{ steps.build.outputs.build }}" ]; then echo "window=changed" >> "$GITHUB_OUTPUT"; fi
          {
            if [ "$after" != "${{ steps.build.outputs.build }}" ]; then echo "**The build changed during the smoke (now \`${after:-unreadable or not ok}\`): this run records nothing.**"; fi
            echo '```'
            if [ -f smoke.log ]; then sed -n '/^pages crawled/,$p' smoke.log | head -80; else echo "the page check did not run"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ -n "${{ steps.build.outputs.build }}" ] && [ "$after" = "${{ steps.build.outputs.build }}" ]

      - name: Keep the report (14 days)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: post-deploy-smoke-${{ steps.build.outputs.build || 'unknown' }}
          path: smoke.json
          if-no-files-found: ignore
          retention-days: 14

  signed-in:
    # After the public half: by then the deploy brake's five quiet minutes have
    # passed. Never on a pull request — a PR must not reach production sessions.
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-qa
    # Its own queue. It does not take the walk's lock (`prod-qa-walk`): GitHub keeps one
    # waiting run per group, so sharing it could push a waiting walk out. It only reads,
    # and its sign-out is `scope=local`, so a walk running beside it is not disturbed.
    concurrency:
      group: post-deploy-smoke-signed-in-${{ inputs.deploy_sha && github.run_id || 'manual' }}
      cancel-in-progress: false
    outputs:
      window: ${{ steps.after.outputs.window }}
      brake: ${{ steps.brake.outputs.brake }}
      # The journeys step itself: `failure` is a regression; `skipped` means they never ran
      # (runner setup, brakes or the session mint failed): NOT RUN; `success` with a red job
      # means a clean-up after them failed: not a regression, and not a pass either.
      journeys: ${{ steps.journeys.outcome }}
    permissions:
      contents: read
      actions: read # the deploy brake reads deploy-vps.yml runs
    # The service-role key is NOT here: a job-level variable is handed to every step,
    # including dependency install and the browser run. It is set only on the one step
    # that mints the two sessions (guard: post-deploy-smoke-secret-scope).
    env:
      PROD_QA_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      PROD_QA_ANON_KEY: ${{ vars.PROD_QA_ANON_KEY }}
      E2E_NO_SERVER: "1"
      E2E_BASE_URL: https://labourmarket.ai
      PROD_QA_WALK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile --filter=!mobile

      - name: Install Playwright chromium
        id: playwright
        run: pnpm -F web exec playwright install --with-deps chromium

      # The walk's own brakes, right before anything signs in, unchanged: the deploy brake
      # wants five quiet minutes after a deploy, the health brake three healthy samples
      # in a row. Inside the deploy queue the deploy brake counts this run's OWN deploy
      # job (WALK_BRAKE_OWN_DEPLOY_RUN), and production must still serve the build the
      # public half checked. Right after a deploy the first health sample can still be
      # slow, so all three are asked again together, every 30 s for about ten minutes
      # (14 tries). Still refused means the journeys did NOT run: the job records
      # `brake=refused` and goes red, and the report job never reads that as a regression.
      - name: "Brakes: no deploy running or just finished, production healthy"
        id: brake
        env:
          GH_TOKEN: ${{ github.token }}
          WALK_BRAKE_OWN_DEPLOY_RUN: ${{ inputs.deploy_sha && github.run_id || '' }}
          BUILD: ${{ needs.smoke.outputs.build }}
        run: |
          set -uo pipefail
          for i in $(seq 1 14); do
            now=$(curl -sS --max-time 20 https://labourmarket.ai/api/health | jq -r 'if .ok == true then .build else empty end' 2>/dev/null || true)
            if [ "$now" = "$BUILD" ] && node .github/scripts/walk-brakes.mjs deploy && node .github/scripts/walk-brakes.mjs health; then
              echo "brake=clear" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$i" -lt 14 ] && sleep 30
          done
          echo "brake=refused" >> "$GITHUB_OUTPUT"

      - name: "Brake refused: the signed-in smoke did NOT run"
        if: steps.brake.outputs.brake != 'clear'
        run: |
          echo "**The walk brakes refused for ten minutes: the signed-in smoke did NOT run on build \`${{ needs.smoke.outputs.build }}\`. Not a regression; dispatch this workflow again.**" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::the walk brakes refused for ten minutes: the signed-in smoke did not run"
          exit 1

      # Sessions for two existing synthetic accounts only. No provisioning step, and
      # PROD_QA_MINT_EXISTING_ONLY makes the mint look the account up first and refuse
      # when it is missing (a magic link for an unknown address could sign it up), so
      # the smoke can never be the thing that creates an account.
      - name: Mint two synthetic sessions (worker, company owner)
        id: mint
        env:
          PROD_QA_MINT_EXISTING_ONLY: "1"
          PROD_QA_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          [ -n "${PROD_QA_ANON_KEY}" ] || { echo "::error::vars.PROD_QA_ANON_KEY is not set"; exit 1; }
          cd apps/web
          PROD_QA_IDENTITY="qa.worker+multiw@labourmarket.ai" PROD_QA_STORAGE_SLOT=worker pnpm exec tsx scripts/prod-qa-mint-session.ts
          PROD_QA_IDENTITY="qa.owner+multiw@labourmarket.ai" PROD_QA_STORAGE_SLOT=owner pnpm exec tsx scripts/prod-qa-mint-session.ts

      # The Playwright output stays in a file that is never uploaded: this repository is
      # public. Only test titles (written in the spec) and pass / fail reach the summary.
      - name: Worker, employer and messaging surfaces open
        id: journeys
        run: |
          set -uo pipefail
          cd apps/web
          code=0
          PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/smoke-result.json" \
            pnpm exec playwright test tests/e2e/prod-deploy-smoke.spec.ts --project=chromium --trace=off --reporter=json \
            > "$RUNNER_TEMP/smoke-run.log" 2>&1 || code=$?
          {
            echo "#### Signed-in smoke — build \`${{ needs.smoke.outputs.build }}\`"
            node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const out=[];const walk=(s)=>{for(const c of s.suites??[])walk(c);for(const t of s.specs??[])out.push((t.ok?"PASS ":"FAIL ")+t.title)};for(const s of r.suites??[])walk(s);if(out.length===0)throw new Error("no tests");console.log(out.join("\n"))' \
              "$RUNNER_TEMP/smoke-result.json" 2>/dev/null || echo "no readable result: treat as FAIL"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" -eq 0 ] || echo "::error::the signed-in smoke failed (exit ${code})"
          exit "$code"

      - name: Revoke and delete the synthetic sessions
        if: always()
        env:
          PROD_QA_REVOKE_EXPECT_FILES: ${{ steps.mint.outcome == 'success' && '1' || '0' }}
        run: |
          cd apps/web
          pnpm exec tsx scripts/prod-qa-revoke-sessions.ts
          ls tests/e2e/.storage-state.prod-qa*.json 2>/dev/null && { echo "::error::a session file survived cleanup"; exit 1; } || echo "no session file left"

      - name: Destroy session files (always, belt and braces)
        if: always()
        run: rm -f apps/web/tests/e2e/.storage-state.prod-qa*.json

      - name: The build did not change under the smoke
        id: after
        if: always()
        run: |
          set -euo pipefail
          after=$(curl -sS --max-time 30 https://labourmarket.ai/api/health | jq -r 'if .ok == true then .build else empty end' || true)
          if [ -n "$after" ] && [ "$after" != "${{ needs.smoke.outputs.build }}" ]; then echo "window=changed" >> "$GITHUB_OUTPUT"; fi
          if [ "$after" != "${{ needs.smoke.outputs.build }}" ]; then
            echo "**The build changed during the signed-in smoke (now \`${after:-unreadable or not ok}\`): this run records nothing.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # ONE ISSUE FOR A RED DEPLOY (owner order 2026-11-23). After both halves, never
  # on a pull request: a red smoke opens the issue, or adds to the one already
  # open, with the deploy SHA and the pull requests merged since the last green
  # smoke, so the regression is traced to its change. A green smoke closes it.
  # It reads GitHub only. No data is rolled back; a code rollback is a human
  # decision (.github/scripts/post-deploy-regression-issue.sh).
  report:
    needs: [smoke, signed-in]
    if: always() && github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the last green run of this workflow
      issues: write # the one regression issue
    steps:
      - name: Checkout (full history, to list the merges since the last green smoke)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Open, update or close the regression issue
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE: ${{ needs.smoke.result }}
          SIGNED_IN: ${{ needs.signed-in.result }}
          BUILD: ${{ needs.smoke.outputs.build }}
          DEPLOY_SHA: ${{ inputs.deploy_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE_WINDOW: ${{ needs.smoke.outputs.window }}
          SMOKE_STATE: ${{ needs.smoke.outputs.state }}
          SIGNED_IN_WINDOW: ${{ needs.signed-in.outputs.window }}
          SIGNED_IN_BRAKE: ${{ needs.signed-in.outputs.brake }}
          SIGNED_IN_JOURNEYS: ${{ needs.signed-in.outputs.journeys }}
        id: report
        run: bash .github/scripts/post-deploy-regression-issue.sh

      # The build a GREEN smoke verified: the next red run lists the merges after it.
      # A run's own head SHA is the newest main commit, not the build it tested.
      - name: Keep the verified build (90 days)
        if: steps.report.outputs.green == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-build
          path: verified-build.txt
          if-no-files-found: error
          retention-days: 90
