name: vps-status

# Read-only production status (P0 stability investigation, 2026-10-23).
#
# Asks the VPS forced-command receiver (ops/vps/lm-deploy-receive.sh) for its
# `status` action with the EXISTING deploy key. That key can run nothing but the
# receiver, and `status` changes nothing: it prints the release production
# serves, the container's docker health and its RestartCount (an out-of-memory
# kill or a crash shows up as restarts), plus the release directories on disk.
# No env value, no log line, no host metric is printed — this repository and its
# Actions logs are public.
#
# Manual only (workflow_dispatch): run it after an incident to learn whether the
# container restarted. It does not deploy, restart or roll back anything.

on:
  workflow_dispatch:

concurrency:
  group: vps-status
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-vps
    steps:
      - name: Require the deploy secrets (no silent no-op)
        env:
          HAS_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY != '' }}
          HAS_HOST: ${{ secrets.VPS_DEPLOY_HOST != '' }}
          HAS_KH: ${{ secrets.VPS_DEPLOY_KNOWN_HOSTS != '' }}
        run: |
          [ "$HAS_KEY" = "true" ] && [ "$HAS_HOST" = "true" ] && [ "$HAS_KH" = "true" ] \
            || { echo "::error::VPS_DEPLOY_SSH_KEY / VPS_DEPLOY_HOST / VPS_DEPLOY_KNOWN_HOSTS are not all configured"; exit 1; }
      - name: Receiver status (current release, health, restarts)
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.VPS_DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.VPS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key; printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "lmdeploy@${HOST}" "status" < /dev/null | tee status.log
          grep -E '^current=' status.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Public health through Cloudflare (build + ok only)
        run: |
          set -u
          body=$(curl -sS --max-time 20 https://labourmarket.ai/api/health || true)
          echo "$body" | grep -oE '"(build|ok|status)":("[^"]*"|true|false)' | tr '\n' ' ' | tee -a "$GITHUB_STEP_SUMMARY"
          echo
