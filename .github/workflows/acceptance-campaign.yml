name: acceptance-campaign

# OWNER ACCEPTANCE CAMPAIGN 2026-10-22 .. 2026-10-25 (owner orders 2026-10-21, issue #2659).
# Runs on GitHub's own scheduler, independent of any agent session or the owner's computer.
# A tick walks the day's plan ONE walk at a time: it dispatches the next walk that has not run
# yet (or, from 10-24, that last FAILED) through prod-qa-walk.yml WITHOUT budget_override, waits
# for it to finish, and dispatches the next — so the plan no longer depends on how often GitHub
# actually fires the cron (10-21/22 it fired 4 times in 12 h instead of every 30 minutes).
#
# Two limits, both only ever stop it:
#   * the 24 h walk budget (PROD_QA_WALK_DAILY_BUDGET) in prod-qa-walk.yml stays the gate: a
#     refused walk never reaches production and consumes nothing; the tick waits and retries;
#   * the owner's 12 production checks per day (#2659) count walks AND the local Chrome checks
#     recorded for the day in the repository variable ACCEPTANCE_LOCAL_CHECKS
#     ("2026-10-22=3,2026-10-23=0"): the tick dispatches nothing once walks + local reach 12.
# Outside the campaign window the job exits without doing anything.

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: acceptance-campaign
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Walk the day's plan, one walk at a time
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LOCAL_CHECKS: ${{ vars.ACCEPTANCE_LOCAL_CHECKS }}
          DAILY_CHECKS: "12"
        run: |
          set -euo pipefail
          DAY1="role-routes journal-confirm living-cv-growth company-chain brigade-formation project-execution org-roster orders-bookings documents-approvals marketplace-goods-services jobs-search notifications-inapp"
          DAY2="billing-test-mode mcp-agents manager-chat calendar-planning chat-continuity project-context worker-identity-split agency-chain marketplace staff-review-notice mobile-surfaces sectors-languages"
          DAY3="profile-cv-history search-support-privacy public-org-locales learning-practice recognition-chain chat-confirm-once mcp-chain employee-beta-gate"
          deadline=$(( $(date -u +%s) + 320 * 60 ))
          log() { echo "$(date -u +%H:%M) $*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          declare -A seen=()   # run id -> "<walk job conclusion> <spec or ->"
          declare -A tried=()  # specs this tick already put through production: never twice per tick

          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            today=$(date -u +%F)
            case "$today" in
              2026-10-22) plan="$DAY1"; retry_failed=0 ;;
              2026-10-23) plan="$DAY2"; retry_failed=0 ;;
              2026-10-24) plan="$DAY3 $DAY1 $DAY2"; retry_failed=1 ;;
              2026-10-25) plan="$DAY1 $DAY2 $DAY3"; retry_failed=1 ;;
              *) log "outside the campaign window ($today): nothing to do"; exit 0 ;;
            esac

            # Never alongside another manual/scheduled walk. A push-triggered run sits in its
            # 120-min debounce and is left out — the walk job's own concurrency group serialises it.
            busy=$(gh run list -R "$REPO" -w prod-qa-walk.yml --limit 20 --json status,event \
              --jq '[.[] | select(.status != "completed" and .event != "push")] | length')
            if [ "$busy" -gt 0 ]; then log "a walk is in flight ($busy): waiting"; sleep 120; continue; fi

            # Every completed walk run since the campaign start, read once and cached (a completed
            # run never changes): did its `walk` job run (= it reached production), which spec
            # (artifact prod-qa-<spec>-<run id>), with which conclusion. Reached-today counts
            # toward the 12 whatever its conclusion; the latest success/failure per spec drives
            # the plan (since today for the first pass, since the start for retries).
            since=$([ "$retry_failed" = 1 ] && echo "2026-10-22" || echo "$today")
            declare -A last=()
            walks_today=0
            while read -r id created conclusion; do
              [ -n "$id" ] || continue
              if [ -z "${seen[$id]:-}" ]; then
                walk=$(gh api "repos/$REPO/actions/runs/$id/jobs?filter=all&per_page=100" \
                  --jq '[.jobs[] | select(.name=="walk") | .conclusion][0] // "skipped"')
                spec=""
                if [ "$walk" != skipped ]; then
                  name=$(gh api "repos/$REPO/actions/runs/$id/artifacts" --jq '.artifacts[0].name // ""')
                  spec=${name#prod-qa-}; spec=${spec%-"$id"}
                fi
                seen[$id]="$walk ${spec:--}"
              fi
              read -r walk spec <<< "${seen[$id]}"
              [ "$walk" != skipped ] || continue
              case "$created" in "$today"*) walks_today=$((walks_today + 1)) ;; esac
              [ "$spec" != - ] || continue
              [[ "$created" < "$since" ]] && continue
              case "$conclusion" in success|failure) last[$spec]=$conclusion ;; esac
            done < <(gh run list -R "$REPO" -w prod-qa-walk.yml --created ">=2026-10-22" --status completed --limit 300 \
                       --json databaseId,conclusion,createdAt \
                       --jq '.[] | "\(.databaseId) \(.createdAt) \(.conclusion)"' | sort -n)

            local_today=$(printf '%s' "${LOCAL_CHECKS:-}" | tr ',' '\n' | sed -n "s/^ *$today *= *\([0-9]*\).*/\1/p" | head -n1)
            local_today=${local_today:-0}
            if [ $((walks_today + local_today)) -ge "$DAILY_CHECKS" ]; then
              log "today's production checks are used: walks $walks_today + local Chrome $local_today >= $DAILY_CHECKS"
              exit 0
            fi

            next=""
            for s in $plan; do
              r="${last[$s]:-none}"
              [ -z "${tried[$s]:-}" ] || continue
              if [ "$r" = none ] || { [ "$retry_failed" = 1 ] && [ "$r" = failure ]; }; then next="$s"; break; fi
            done
            if [ -z "$next" ]; then log "today's plan is complete"; exit 0; fi

            before=$(gh run list -R "$REPO" -w prod-qa-walk.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            gh workflow run prod-qa-walk.yml -R "$REPO" --ref main -f spec="$next"
            log "dispatched: $next (walks today $walks_today, local Chrome $local_today; no override)"
            id=""
            for _ in $(seq 1 30); do
              sleep 10
              id=$(gh run list -R "$REPO" -w prod-qa-walk.yml --event workflow_dispatch --limit 5 --json databaseId \
                --jq "[.[] | select(.databaseId > $before) | .databaseId] | min // empty")
              [ -n "$id" ] && break
            done
            if [ -z "$id" ]; then log "the dispatched run did not appear; stopping this tick"; exit 0; fi
            until [ "$(gh run view "$id" -R "$REPO" --json status --jq .status)" = completed ]; do sleep 60; done
            budget=$(gh run view "$id" -R "$REPO" --json jobs --jq '[.jobs[] | select(.name=="budget") | .conclusion][0] // ""')
            walk=$(gh run view "$id" -R "$REPO" --json jobs --jq '[.jobs[] | select(.name=="walk") | .conclusion][0] // ""')
            log "$next run $id: budget=$budget walk=$walk"
            # Refused by the 24 h budget: nothing reached production. Wait for the window to free
            # and try the same spec again; anything that reached production is not repeated by
            # this tick even when it left no artifact.
            if [ "$budget" = failure ]; then sleep 1200; else tried[$next]=1; fi
          done
          log "tick time limit reached; the next scheduled tick continues"
