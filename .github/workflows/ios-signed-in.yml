name: iOS signed-in journey
# SIGNED-IN iOS PROOF — workflow_dispatch ONLY. The sibling of android.yml's
# `signed-in` job (F-3). ios.yml deliberately builds the simulator app with
# placeholder bad-network config so its journey proves honest failure without
# any backend; this workflow builds the SAME app with the production PUBLIC
# config (anon key from vars.PROD_QA_ANON_KEY, URL derived from its `ref`
# claim, API base labourmarket.ai or the `origin` input) and walks the
# signed-in journey as the owner's ONE synthetic review identity, whose
# password lives in the `production-qa` GitHub environment. No screenshot,
# simulator log or Maestro debug output is uploaded: the repository is public.
# Claim token when green: IOS_SIGNED_IN_JOURNEY_PROVEN.
#
# Kept as its own file so a mistake here can never turn ios.yml (the every-PR
# proof) red.

on:
  workflow_dispatch:
    inputs:
      origin:
        description: "API origin the app talks to (production, or an isolated staging URL the hosting agent names)"
        required: false
        default: "https://labourmarket.ai"

permissions:
  contents: read

concurrency:
  group: ios-signed-in-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-in:
    name: Simulator build (production public config) + signed-in journey
    # ONE review identity, ONE password at a time: every job that issues and
    # scrambles it (Android and iOS, any ref) waits for the others.
    concurrency:
      group: mobile-qa-review-identity
      cancel-in-progress: false
    runs-on: macos-26
    environment: production-qa
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=mobile... --filter=@labourmarket/client-core...

      - name: Issue a one-run password for the mobile review identity (masked)
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node .github/scripts/mobile-qa-credential.mjs issue

      - name: Refuse without the review identity or the public anon key
        env:
          ANON_KEY: ${{ vars.PROD_QA_ANON_KEY }}
        run: |
          if [ -z "$MOBILE_QA_EMAIL" ] || [ -z "$MOBILE_QA_PASSWORD" ]; then
            echo "::error::MOBILE_QA_EMAIL / MOBILE_QA_PASSWORD are not set in the production-qa environment (owner gate O1)"; exit 1
          fi
          if [ -z "$ANON_KEY" ]; then
            echo "::error::vars.PROD_QA_ANON_KEY is not set — the app cannot sign anyone in"; exit 1
          fi
          REF=$(node -e 'const p=JSON.parse(Buffer.from(process.env.ANON_KEY.split(".")[1],"base64url").toString());if(p.role!=="anon"){console.error("refusing: key role is "+p.role);process.exit(1)}process.stdout.write(p.ref)')
          echo "EXPO_PUBLIC_SUPABASE_URL=https://${REF}.supabase.co" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_API_BASE_URL=${{ inputs.origin }}" >> "$GITHUB_ENV"

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: Expo prebuild (iOS)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: CocoaPods install
        working-directory: apps/mobile/ios
        run: pod install

      - name: Discover workspace and scheme
        id: xc
        working-directory: apps/mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          # NOT the first listed scheme: the workspace lists every Pods library
          # scheme too, and building one "succeeds" with no .app. The app scheme
          # matches the .xcodeproj name (the same rule as ios.yml).
          SCHEME=$(basename "$(ls -d *.xcodeproj | head -1)" .xcodeproj)
          echo "workspace=$WS scheme=$SCHEME"
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Xcode build (simulator, Release, ad-hoc signed, production public config embedded)
        working-directory: apps/mobile/ios
        run: |
          set +e
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build > xcodebuild.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            grep -n -B 3 -A 20 " error: " xcodebuild.log | head -300
            tail -60 xcodebuild.log
          fi
          exit $STATUS

      - name: Boot simulator and install
        working-directory: apps/mobile/ios
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -1)
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(dev["udid"] for devs in d.values() for dev in devs if dev["isAvailable"]))')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      # Evidence, not a gate: can THIS runner reach the origin? Status codes,
      # protocol versions and timings only (no bodies, no tokens). Run again
      # after a failed attempt, so a stalled journey can be laid next to what
      # the runner's own network saw at that moment.
      - name: Origin probe from the macOS runner (before the journey)
        env:
          ORIGIN: ${{ inputs.origin }}
        run: bash .github/scripts/mobile-origin-probe.sh "$ORIGIN" before-journey

      - name: Signed-in journey (sign-in → Today read → journal write → profile read → sign-out)
        env:
          ORIGIN: ${{ inputs.origin }}
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "480000"
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          # No --debug-output: nothing from a signed-in session is written to disk.
          # The Maestro console (step names and statuses — what this log
          # already shows) is also kept on the runner so the claim line can
          # name a degraded Today read; the file is never uploaded.
          CONSOLE="$RUNNER_TEMP/maestro-console.txt"
          ATTEMPT=0
          journey() {
            ATTEMPT=$((ATTEMPT + 1))
            : > "$CONSOLE"
            maestro test               -e MOBILE_QA_EMAIL="$MOBILE_QA_EMAIL"               -e MOBILE_QA_PASSWORD="$MOBILE_QA_PASSWORD"               apps/mobile/.maestro/signed-in-journey.yaml | tee -a "$CONSOLE" &&
            maestro test               -e MOBILE_QA_EMAIL="$MOBILE_QA_EMAIL"               -e MOBILE_QA_PASSWORD="$MOBILE_QA_PASSWORD"               -e NEED_SUBMIT=0               apps/mobile/.maestro/jobs-need-journey.yaml | tee -a "$CONSOLE"
          }
          # On a failed attempt, print ONLY the test ids on screen (our own testID
          # strings, never text, values or a screenshot; at most ten averaged
          # band colours, see ios-screen-bands.py).
          on_screen_ids() {
            echo "::group::test ids on screen at the failure"
            maestro hierarchy 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const ids = new Set();
                const walk = (n) => {
                  const id = n?.attributes?.["resource-id"] ?? n?.attributes?.identifier;
                  if (id) ids.add(String(id).split("/").pop());
                  // Geometry of the controls a tap aims at (our own ids only).
                  const short = id ? String(id).split("/").pop() : "";
                  const aimed = ["journal-compose-review", "journal-compose-back", "journal-compose-site", "tab-today"];
                  if (aimed.includes(short) && n?.attributes?.bounds) ids.add(short + " bounds=" + n.attributes.bounds);
                  (n?.children ?? []).forEach(walk);
                };
                try {
                  const root = JSON.parse(s.slice(s.indexOf("{")));
                  if (root?.attributes?.bounds) ids.add("(root) bounds=" + root.attributes.bounds);
                  walk(root);
                } catch { console.log("(no hierarchy)"); }
                console.log([...ids].sort().join("\n"));
              });' || true
            # Ten averaged band colours, never an image (the script deletes it).
            python3 .github/scripts/ios-screen-bands.py "$SIM_UDID" "$RUNNER_TEMP" || true
            echo "::endgroup::"
          }
          # The session lives in the iOS keychain, which clearState does not
          # touch: reset it before the retry so attempt 2 starts signed out.
          if journey || { on_screen_ids; bash .github/scripts/mobile-origin-probe.sh "$ORIGIN" after-attempt-1; echo "::warning::attempt 1 failed - retrying once (driver)"; xcrun simctl keychain "$SIM_UDID" reset || true; sleep 15; journey; }; then
            echo "IOS_SIGNED_IN_JOURNEY_PROVEN: sign-in, Today figures read, journal entry drafted and confirmed, profile skills read, sign-out (passed on attempt $ATTEMPT of 2)"
            if grep -q "TODAY_READ_DEGRADED.*COMPLETED" "$CONSOLE"; then
              echo "IOS_JOBS_READ_JOURNEY_PROVEN_DEGRADED: job opened (hand-off ok) and empty need refused, BUT Today's figures read FAILED during the jobs journey (capability-retry shown) - not a full read"
            else
              echo "IOS_JOBS_READ_JOURNEY_PROVEN: Today read, jobs search loaded, job opened (hand-off ok), empty need refused (no need written)"
            fi
          else
            on_screen_ids
            bash .github/scripts/mobile-origin-probe.sh "$ORIGIN" after-attempt-2
            echo "::error::iOS signed-in journey failed twice"; exit 1
          fi

      - name: Wipe the session from the simulator
        if: always()
        run: xcrun simctl uninstall "$SIM_UDID" ai.labourmarket.app || true

      - name: Cleanup — close the synthetic needs this journey posted (always, also on failure)
        if: always()
        env:
          ANON_KEY: ${{ vars.PROD_QA_ANON_KEY }}
        run: node .github/scripts/mobile-qa-close-synthetic-needs.mjs

      - name: Scramble the review identity's password (always, also on failure)
        if: always()
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node .github/scripts/mobile-qa-credential.mjs scramble
