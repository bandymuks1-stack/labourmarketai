name: DB backup (Supabase → VPS, encrypted)

# Nightly logical backup of the production Supabase database. Owner decision
# 2026-10-17 (P0), zero cost.
#
# HOW THE RUNNER GETS INTO THE DATABASE (2026-10-23). The owner signs in to
# Supabase with Google and holds no database password, and no existing
# credential can read product tables (the parity gate's `SUPABASE_DB_URL` role:
# "permission denied for table profiles", 2026-10-17). So the default path needs
# NO database password at all — it is the Supabase CLI's own password-less
# mechanism, called directly:
#   1. `GET  /v1/projects/{ref}/config/database/pooler`  → the Session-pooler host
#      (GitHub runners have no IPv6, the direct host is IPv6-only);
#   2. `POST /v1/projects/{ref}/cli/login-role` {"read_only": false} → a TEMPORARY
#      login role `cli_login_postgres` with a short-lived password (the same
#      call `supabase db dump --linked` makes when no password is given:
#      supabase/cli apps/cli-go/internal/utils/flags/db_url.go `initLoginRole`);
#   3. `pg_dump --role=postgres` (the CLI's own data dump does exactly this; the
#      Supabase `postgres` role has BYPASSRLS + pg_read_all_data, so RLS tables are
#      dumped whole — pg_dump sets row_security=off and errors for a role that
#      cannot bypass RLS);
#   4. `DELETE /v1/projects/{ref}/cli/login-role` when the job ends (always).
# Auth: the repository secret `SUPABASE_ACCESS_TOKEN` — a SCOPED personal access
# token (this project only, Database read-write, with an expiry) that only this
# workflow reads. pg_dump runs its whole dump in one READ ONLY transaction.
# The CLI binary itself is not used: the same two API calls keep this job's
# custom-format dump, restore drill and encryption unchanged, with no Docker
# image or CLI version to pin.
#
# Alternative (optional): `SUPABASE_BACKUP_DB_URL`, a Session-pooler URI of a
# dedicated read role the owner created (runbook §5). When it is set it wins
# and no access token is needed.
#
# What it does, every night and on demand:
#   1. pg_dump (PG 17 client), custom format, every schema a restore needs
#      (2026-11-03): `public` (product), `auth` (accounts, identities), `storage`
#      (bucket + object METADATA) and `supabase_migrations` (the applied-migration
#      ledger). If that cannot be read the job falls back to `public` only and says
#      so as a warning and in the summary. Left out on purpose:
#        - `vault`: Supabase-managed secrets, encrypted with this project's own key;
#          ciphertext is useless in any other project and must not travel;
#        - `realtime`: Supabase's runtime (subscriptions, short-lived broadcast
#          partitions) that the platform recreates; no product data;
#        - `cron`: pg_cron's tables belong to the extension (pg_dump of the schema
#          would emit data for tables a plain restore cannot create), so the JOB
#          DEFINITIONS are exported separately into the files bundle (step 3).
#   2. RESTORE DRILL into a throw-away postgres:17 service container, with the
#      Supabase roles (`anon`, `authenticated`, `service_role`) and the extensions
#      the schema uses (`btree_gist`, `pgcrypto`, `uuid-ossp` in `extensions`)
#      created first, as in a real Supabase target. PROOF, not "the file restored":
#      per schema, the exact count of tables, views, indexes, constraints,
#      policies, triggers and functions equals the source; every table's row
#      count lands inside its source window [before dump, after dump] (key tables
#      fail the job, others warn); every journal entry keeps its worker.
#   3. STORAGE FILES (pg_dump never holds them, nor do Supabase's own DB backups):
#      every object listed in `storage.objects` is downloaded through the Storage
#      API with the service-role key (never a public URL), checked object by
#      object against its recorded size, then tarred with a manifest and the cron
#      job definitions → `lm-files-<stamp>.tar.age`.
#   4. encrypt with `age` to the VPS backup public key (ops/vps/backup.age.pub —
#      the private key lives only on the VPS, 600, plus the owner's offline copy);
#   5. ship both over the forced-command SSH channel (`backup` action in
#      ops/vps/lm-deploy-receive.sh) → /root/lm-prod/backups/ (700), 14 days kept.
# Plaintext (the dump AND the files — personal data) never leaves the runner and is
# shredded before the job ends. Nothing is uploaded as a GitHub artifact (public
# repository). No token, password, URL or object name is ever printed; API
# failures print the HTTP status (and an object's index) only.
#
# Restore procedure end to end: docs/ops/VPS_PRODUCTION_RUNBOOK.md §9.1.1.
#
# Secrets (names only): SUPABASE_ACCESS_TOKEN (owner-created) or
# SUPABASE_BACKUP_DB_URL (optional alternative); SUPABASE_SERVICE_ROLE_KEY (Storage
# files, read only here); VPS_DEPLOY_SSH_KEY, VPS_DEPLOY_HOST,
# VPS_DEPLOY_KNOWN_HOSTS (the deploy trio). Without them the job FAILS loudly — a
# backup that did not happen must never look green.

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC nightly (after the 03:00 legacy cron, before EU office hours)
  workflow_dispatch:
    inputs:
      restore_drill_only:
        description: "Only dump + restore drill on the runner; ship nothing"
        type: boolean
        default: false

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      drill:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: drill
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TZ: UTC
      # The production project (public: it is in every page's Supabase URL).
      SUPABASE_PROJECT_REF: gorgitwvdzxbnaxhrsrw
      # Restore proof, run identically on the source and on the drill database
      # (psql variable :'schemas' = the dumped schemas, comma-separated). Counts
      # only; nothing from a row is read. Extension-owned objects are excluded on
      # both sides (the target's own CREATE EXTENSION makes them).
      PROOF_OBJECTS_SQL: |
        select n.nspname, o.k, count(*) from (
          select c.relnamespace ns, case when c.relkind in ('r','p') then 'tables' when c.relkind = 'v' then 'views'
                 when c.relkind = 'm' then 'matviews' when c.relkind in ('i','I') then 'indexes' else 'sequences' end k
            from pg_class c where c.relkind in ('r','p','v','m','i','I','S')
             and not exists (select 1 from pg_depend d where d.classid = 'pg_class'::regclass and d.objid = c.oid and d.deptype = 'e')
          union all select connamespace, 'constraints' from pg_constraint
          union all select c.relnamespace, 'policies' from pg_policy p join pg_class c on c.oid = p.polrelid
          union all select c.relnamespace, 'triggers' from pg_trigger t join pg_class c on c.oid = t.tgrelid where not t.tgisinternal
          union all select p.pronamespace, 'functions' from pg_proc p
           where not exists (select 1 from pg_depend d where d.classid = 'pg_proc'::regclass and d.objid = p.oid and d.deptype = 'e')
        ) o join pg_namespace n on n.oid = o.ns
        where n.nspname = any(string_to_array(:'schemas', ','))
        group by 1, 2 order by 1, 2;
      # Exact row count of every table in the dumped schemas, in ONE statement
      # (query_to_xml runs each count; works inside a read-only transaction).
      PROOF_ROWS_SQL: |
        select format('%s.%s', n.nspname, c.relname),
               (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I.%I', n.nspname, c.relname), false, true, '')))[1]::text
          from pg_class c join pg_namespace n on n.oid = c.relnamespace
         where c.relkind in ('r','p') and not c.relispartition
           and n.nspname = any(string_to_array(:'schemas', ','))
           and not exists (select 1 from pg_depend d where d.classid = 'pg_class'::regclass and d.objid = c.oid and d.deptype = 'e')
         order by 1;
    steps:
      - name: Require secrets (no silent no-op)
        env:
          HAS_PAT: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_DB: ${{ secrets.SUPABASE_BACKUP_DB_URL != '' }}
          HAS_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY != '' }}
          HAS_HOST: ${{ secrets.VPS_DEPLOY_HOST != '' }}
          HAS_KH: ${{ secrets.VPS_DEPLOY_KNOWN_HOSTS != '' }}
          HAS_SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          DRILL_ONLY: ${{ inputs.restore_drill_only }}
        run: |
          [ "$HAS_SRK" = "true" ] || { echo "::error::secrets.SUPABASE_SERVICE_ROLE_KEY missing — the Storage files cannot be backed up"; exit 1; }
          [ "$HAS_PAT" = "true" ] || [ "$HAS_DB" = "true" ] || { echo "::error::neither secrets.SUPABASE_ACCESS_TOKEN (a scoped Supabase personal access token: this project, Database read-write) nor secrets.SUPABASE_BACKUP_DB_URL is configured — no backup taken (runbook docs/ops/VPS_PRODUCTION_RUNBOOK.md §5)"; exit 1; }
          if [ "$HAS_DB" = "true" ]; then echo "credential: SUPABASE_BACKUP_DB_URL" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "credential: temporary CLI login role via SUPABASE_ACCESS_TOKEN" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          if [ "$DRILL_ONLY" != "true" ]; then
            [ "$HAS_KEY" = "true" ] && [ "$HAS_HOST" = "true" ] && [ "$HAS_KH" = "true" ] \
              || { echo "::error::VPS_DEPLOY_SSH_KEY / VPS_DEPLOY_HOST / VPS_DEPLOY_KNOWN_HOSTS missing — no backup shipped"; exit 1; }
          fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ops/vps
      - name: Install PostgreSQL 17 client + age
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 age >/dev/null
          # The runner image ships client 16 first on PATH; the 17 binaries must win (server is 17.x).
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version; age --version; jq --version
      - name: Dump (plaintext stays on this runner only)
        env:
          DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          stamp=$(date -u +%Y%m%dT%H%M%SZ); echo "STAMP=$stamp" >> "$GITHUB_ENV"
          export PGSSLMODE=require
          T="$RUNNER_TEMP/lmdb"; mkdir -p "$T"
          export PGPASSFILE="$T/pgpass"
          REF="$SUPABASE_PROJECT_REF"
          # One Management API call. The body goes to a 600 file, never to the log;
          # only the HTTP status is returned.
          api() { curl -sS -o "$1" -w '%{http_code}' -X "$2" "https://api.supabase.com/v1/projects/${REF}$3" \
                    -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" ${4:+--data "$4"} || true; }

          if [ -n "$DB_URL" ]; then
            MODE=url
            # The stored URL may carry `sslmode=no-verify` (a node-postgres value libpq does not know);
            # libpq gets the same intent through PGSSLMODE=require with the parameter removed.
            CONN=$(printf '%s' "$DB_URL" | sed -E 's/([?&])sslmode=[^&]*(&|$)/\1/; s/[?&]$//')
            ROLE_ARGS=()
            connect() { :; }
          else
            MODE=pat
            code=$(api "$T/pooler.json" GET /config/database/pooler)
            [ "$code" = "200" ] || { echo "::error::pooler config: HTTP $code (token missing Database permission on this project, expired, or revoked)"; rm -f "$T/pooler.json"; exit 1; }
            host=$(jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_host // empty' "$T/pooler.json")
            db=$(jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_name // "postgres"' "$T/pooler.json")
            rm -f "$T/pooler.json"
            [ -n "$host" ] || { echo "::error::pooler config has no PRIMARY host"; exit 1; }
            # Port 5432 on the pooler host = Session mode (pg_dump needs a session, not a transaction pooler).
            # The temp role steps up to `postgres` exactly like the CLI's own data dump (`--role postgres`).
            ROLE_ARGS=(--role=postgres)
            connect() {
              local code role pw
              code=$(api "$T/login.json" POST /cli/login-role '{"read_only":false}')
              [ "$code" = "201" ] || { rm -f "$T/login.json"; echo "::error::temporary login role: HTTP $code"; return 1; }
              role=$(jq -r '.role // empty' "$T/login.json"); pw=$(jq -r '.password // empty' "$T/login.json"); rm -f "$T/login.json"
              [ -n "$role" ] && [ -n "$pw" ] || { echo "::error::temporary login role: empty answer"; return 1; }
              echo "::add-mask::$pw"
              # .pgpass escapes ':' and '\' (libpq rule).
              printf '%s:5432:%s:%s:%s\n' "$host" "$db" "$role.$REF" "$(printf '%s' "$pw" | sed -e 's/\\/\\\\/g' -e 's/:/\\:/g')" > "$PGPASSFILE"
              chmod 600 "$PGPASSFILE"
              CONN="host=$host port=5432 dbname=$db user=$role.$REF"
              # The pooler learns the new password within seconds; wait for it (bounded, like the CLI).
              local i
              for i in 1 2 3 4 5 6; do
                psql "$CONN" -tAc 'select 1' >/dev/null 2>&1 && { echo "temporary login role ready (attempt $i)"; return 0; }
                sleep $((i * 4))
              done
              echo "::error::could not connect as the temporary login role through the Session pooler"; return 1
            }
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"

          out="lm-db-$stamp.dump"
          # Every schema a restore needs (2026-11-03; header §1 says why vault, realtime
          # and cron are not here). If that cannot be read (e.g. a URL role with
          # public-only rights, first drill 2026-10-17: "permission denied for schema
          # auth"), fall back to public only — loudly, never silently.
          FULL_SCHEMAS="public,auth,storage,supabase_migrations"
          # Restore proof: exact counts read from the source right before and right after
          # the dump (rows: every table; objects: per schema). The drill must land every
          # table inside that window - "the file restored" is not proof that the data
          # did. Counts only; no row content leaves the database. The KEY tables fail the
          # job when outside their window; any other table only warns (a busy table such
          # as auth.sessions can move both ways between the two reads).
          KEY_TABLES="public.profiles public.workers public.organizations public.journal_entries public.journal_entry_confirmations auth.users storage.objects supabase_migrations.schema_migrations"
          # One query on the source (psql reads it from stdin so :'schemas' is
          # interpolated); -q keeps the `SET` status out of the output.
          src() {
            { if [ "$MODE" = "pat" ]; then echo "set role postgres;"; fi; printf '%s\n' "$1"; } \
              | psql "$CONN" -X -q -v ON_ERROR_STOP=1 -v schemas="$2" -tA -F "$(printf '\t')"
          }
          SCOPE="$FULL_SCHEMAS"
          connect && src "$PROOF_ROWS_SQL" "$FULL_SCHEMAS" > "$T/rows.before"
          connect && src "$PROOF_OBJECTS_SQL" "$FULL_SCHEMAS" > "$T/objects.before"
          schema_args=(); for s in ${FULL_SCHEMAS//,/ }; do schema_args+=("--schema=$s"); done
          if ! { connect && pg_dump "$CONN" "${ROLE_ARGS[@]}" -Fc --no-owner --no-privileges "${schema_args[@]}" -f "$out" 2> "$T/dump.err"; }; then
            echo "::warning::dump of $FULL_SCHEMAS failed ($(grep -m1 -oE 'ERROR: +[a-z ]+' "$T/dump.err" || echo 'see log')) — retrying public only"
            rm -f "$out"; SCOPE="public"
            connect
            pg_dump "$CONN" "${ROLE_ARGS[@]}" -Fc --no-owner --no-privileges --schema=public -f "$out"
          fi
          connect && src "$PROOF_ROWS_SQL" "$FULL_SCHEMAS" > "$T/rows.after"
          connect && src "$PROOF_OBJECTS_SQL" "$FULL_SCHEMAS" > "$T/objects.after"
          # The Storage object list (bucket, name, recorded size) and the pg_cron job
          # definitions, for the files bundle. 600 files on the runner; never printed.
          connect && src "select json_build_object('b', bucket_id, 'n', name, 's', (metadata->>'size')::bigint) from storage.objects order by bucket_id, name;" "" > "$T/objects.jsonl"
          connect && src "copy (select jobid, jobname, schedule, command, database, username, active from cron.job order by jobid) to stdout with (format csv, header);" "" > "$T/cron-jobs.csv"
          connect && CRON_JOBS=$(src "select count(*) from cron.job;" "")
          rm -f "$PGPASSFILE" "$T/dump.err"
          echo "SCOPE=$SCOPE" >> "$GITHUB_ENV"
          echo "KEY_TABLES=$KEY_TABLES" >> "$GITHUB_ENV"
          echo "CRON_JOBS=$CRON_JOBS" >> "$GITHUB_ENV"
          echo "source counts read: tables before=$(wc -l < "$T/rows.before") after=$(wc -l < "$T/rows.after"); storage objects listed=$(wc -l < "$T/objects.jsonl"); cron jobs=$CRON_JOBS"
          size=$(stat -c %s "$out"); echo "dump scope=$SCOPE bytes=$size" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$size" -gt 100000 ] || { echo "::error::dump is suspiciously small ($size bytes)"; exit 1; }
          [ "$SCOPE" = "$FULL_SCHEMAS" ] || echo "::warning::this backup holds the public schema only — accounts (auth), Storage metadata and the migration ledger are NOT in it (runbook §9.1)"
      - name: Drop the temporary login role (always)
        if: always() && env.MODE == 'pat'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          rm -f "$RUNNER_TEMP/lmdb/pgpass"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/cli/login-role" \
                   -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" || true)
          echo "temporary login role removed: HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ] || echo "::warning::could not remove the temporary login role (HTTP $code); its password expires by itself"
      - name: Restore drill (throw-away postgres:17 on this runner)
        env:
          PGPASSWORD: drill
        run: |
          set -euo pipefail
          P="psql -h 127.0.0.1 -p 55432 -U postgres -X -q -v ON_ERROR_STOP=1"
          $P -c "create database drill_restore" >/dev/null
          # A Supabase target already has these; a plain postgres:17 does not. Created
          # first so the drill measures the DUMP, not the missing platform: without
          # them every policy (`to authenticated`) and the one exclusion constraint
          # (needs btree_gist) failed — 195 error lines on 2026-11-03.
          $P -d drill_restore >/dev/null <<'SQL'
          create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls;
          create schema extensions;
          create extension btree_gist with schema extensions;
          create extension pgcrypto with schema extensions;
          create extension "uuid-ossp" with schema extensions;
          SQL
          # pg_restore continues past errors by default; the proof below decides.
          pg_restore -h 127.0.0.1 -p 55432 -U postgres -d drill_restore --no-owner --no-privileges "lm-db-$STAMP.dump" 2> restore.err || true
          q() { psql -h 127.0.0.1 -p 55432 -U postgres -X -d drill_restore -tAc "$1"; }
          dq() { printf '%s\n' "$1" | $P -d drill_restore -v schemas="$SCOPE" -tA -F "$(printf '\t')"; }
          # Error lines, by class (counts only). "schema public already exists" is
          # pg_restore meeting the database's own public schema: harmless.
          errs=$(grep -c "ERROR" restore.err || true)
          harmless=$(grep -c 'ERROR: *schema "public" already exists' restore.err || true)
          other=$((errs - harmless))
          tables=$(q "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p')")
          views=$(q "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='v'")
          rows=$(q "select coalesce(sum(n_live_tup),0) from pg_stat_user_tables where schemaname='public'")
          echo "restore drill: scope=$SCOPE public base tables=$tables views=$views rows≈$rows restore-errors=$errs (harmless=$harmless other=$other)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$tables" -ge 50 ] && [ "$rows" -ge 1 ] || { echo "::error::restore drill failed (tables=$tables rows=$rows)"; grep -m20 ERROR restore.err | cut -c1-200; exit 1; }
          [ "$other" = "0" ] || { echo "::warning::pg_restore reported $other unexpected error line(s); first ones:"; grep "ERROR" restore.err | grep -v 'schema "public" already exists' | head -10 | cut -c1-200 || true; }
          D="$RUNNER_TEMP/lmdb"
          bad=0
          # 1. Schema objects: per schema and kind, the restore equals the source exactly.
          dq "$PROOF_OBJECTS_SQL" > "$D/objects.restored"
          cmp -s "$D/objects.before" "$D/objects.after" \
            || echo "::warning::the source schema changed while the dump ran; comparing with the state before it"
          awk -F'\t' -v sc=",$SCOPE," 'index(sc, "," $1 ",")' "$D/objects.before" > "$D/objects.expected"
          [ -s "$D/objects.expected" ] && [ -s "$D/objects.restored" ] || { echo "::error::restore proof: the schema-object counts could not be read"; exit 1; }
          if cmp -s "$D/objects.expected" "$D/objects.restored"; then
            echo "restore proof: schema objects equal the source ($(awk -F'\t' '{printf "%s%s.%s=%s", (NR > 1 ? " " : ""), $1, $2, $3}' "$D/objects.restored"))" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::restore proof: schema objects differ from the source (schema/kind, source, restored):"
            join -t "$(printf '\t')" -a1 -a2 -e 0 -o 0,1.2,2.2 \
              <(awk -F'\t' '{print $1"/"$2"\t"$3}' "$D/objects.expected" | sort) \
              <(awk -F'\t' '{print $1"/"$2"\t"$3}' "$D/objects.restored" | sort) | awk -F'\t' '$2 != $3'
            bad=1
          fi
          # 2. Rows: every table inside its source window [before, after].
          dq "$PROOF_ROWS_SQL" > "$D/rows.restored"
          [ -s "$D/rows.before" ] && [ -s "$D/rows.after" ] || { echo "::error::restore proof: the source row counts could not be read"; exit 1; }
          awk -F'\t' -v sc=",$SCOPE," -v keys=" $KEY_TABLES " '
            FILENAME == ARGV[1] { b[$1] = $2; next }
            FILENAME == ARGV[2] { a[$1] = $2; next }
            { r[$1] = $2 }
            END {
              n = 0; out = 0; keybad = 0; zero = 0; missing = 0
              for (t in b) {
                split(t, p, "."); if (!index(sc, "," p[1] ",")) continue
                n++; lo = b[t] + 0; hi = (t in a) ? a[t] + 0 : lo; if (hi < lo) { x = lo; lo = hi; hi = x }
                iskey = index(keys, " " t " ") > 0
                if (!(t in r)) { print "MISSING\t" t; missing++; continue }
                g = r[t] + 0
                if (g < lo || g > hi) {
                  print (iskey ? "KEY_OUT\t" : "OUT\t") t "\t" g "\t" lo "\t" hi
                  if (iskey) keybad++; else out++
                  if (g == 0 && lo > 0) zero++
                } else if (iskey) print "KEY_OK\t" t "\t" g "\t" lo "\t" hi
              }
              print "TOTAL\t" n "\t" out "\t" keybad "\t" zero "\t" missing
            }' "$D/rows.before" "$D/rows.after" "$D/rows.restored" > "$D/rows.verdict"
          while IFS="$(printf '\t')" read -r kind t g lo hi; do
            case "$kind" in
              KEY_OK)  echo "restore proof: $t restored $g rows, source window [$lo, $hi]" | tee -a "$GITHUB_STEP_SUMMARY" ;;
              KEY_OUT) echo "::error::restore proof: $t restored $g rows, source window [$lo, $hi]" ;;
              OUT)     echo "::warning::restore proof: $t restored $g rows, source window [$lo, $hi]" ;;
              MISSING) echo "::error::restore proof: $t did not restore" ;;
            esac
          done < "$D/rows.verdict"
          read -r _ n out keybad zero missing < <(grep '^TOTAL' "$D/rows.verdict" | tr '\t' ' ')
          echo "restore proof: $n tables compared; outside their window: $keybad key, $out other ($zero restored empty); missing: $missing" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$keybad" = "0" ] && [ "$zero" = "0" ] && [ "$missing" = "0" ] || bad=1
          [ "$bad" = "0" ] || exit 1
          # 3. Append-only evidence must come back whole: no journal entry without its worker.
          orphans=$(q "select count(*) from public.journal_entries j where not exists (select 1 from public.workers w where w.id = j.worker_id)")
          [ "$orphans" = "0" ] || { echo "::error::restore proof: $orphans journal entries restored without their worker"; exit 1; }
          echo "restore proof: schema objects exact; every key table inside its source window; every journal entry has its worker" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Storage files + cron job definitions (plaintext stays on this runner only)
        env:
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          D="$RUNNER_TEMP/lmdb"; F="$D/files"; mkdir -p "$F/storage"
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co/storage/v1/object"
          L="$D/objects.jsonl"
          n=$(wc -l < "$L"); want_bytes=$(jq -s 'map(.s // 0) | add // 0' "$L")
          : > "$F/storage-manifest.jsonl"
          i=0; got=0; got_bytes=0; failed=0
          # Object names are personal data: never printed — an error names the object's index only.
          while IFS= read -r line; do
            i=$((i + 1))
            b=$(jq -r '.b' <<<"$line"); name=$(jq -r '.n' <<<"$line"); size=$(jq -r '.s // -1' <<<"$line")
            # Path safety: no absolute path, no '..' segment, no control character.
            if [[ "$b" == */* || "$b" == .* || "$name" == /* || "/$name/" == */../* || "$name" =~ [[:cntrl:]] ]]; then
              echo "::error::object #$i has an unsafe path; not written"; failed=$((failed + 1)); continue
            fi
            enc=$(jq -r '.n | split("/") | map(@uri) | join("/")' <<<"$line")
            benc=$(jq -rn --arg b "$b" '$b | @uri')
            dest="$F/storage/$b/$name"; mkdir -p "$(dirname "$dest")"
            code=$(curl -sS --retry 3 --retry-all-errors -o "$dest" -w '%{http_code}' \
                     -H "apikey: $SRK" -H "Authorization: Bearer $SRK" "$BASE/$benc/$enc" 2>/dev/null || echo 000)
            have=$(stat -c %s "$dest" 2>/dev/null || echo -1)
            if [ "$code" != "200" ] || [ "$have" != "$size" ]; then
              echo "::error::object #$i: HTTP $code, bytes $have, recorded $size"; failed=$((failed + 1)); rm -f "$dest"; continue
            fi
            got=$((got + 1)); got_bytes=$((got_bytes + have))
            jq -c --arg sha "$(sha256sum "$dest" | cut -d' ' -f1)" '. + {sha256: $sha}' <<<"$line" >> "$F/storage-manifest.jsonl"
          done < "$L"
          cp "$D/cron-jobs.csv" "$F/cron-jobs.csv"
          cron_rows=$(( $(wc -l < "$F/cron-jobs.csv") - 1 ))
          per_bucket=$(jq -rs 'group_by(.b) | map("\(.[0].b)=\(length)") | join(" ")' "$F/storage-manifest.jsonl")
          echo "storage files: objects=$got/$n bytes=$got_bytes/$want_bytes ($per_bucket); cron jobs=$cron_rows/$CRON_JOBS" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$failed" = "0" ] && [ "$got" = "$n" ] && [ "$got_bytes" = "$want_bytes" ] \
            || { echo "::error::storage files incomplete ($failed failed)"; exit 1; }
          [ "$cron_rows" = "$CRON_JOBS" ] || { echo "::error::cron job export has $cron_rows rows, source $CRON_JOBS"; exit 1; }
          tar -C "$F" -cf "lm-files-$STAMP.tar" .
          echo "files bundle bytes=$(stat -c %s "lm-files-$STAMP.tar")"
      - name: Encrypt to the VPS backup key
        run: |
          set -euo pipefail
          umask 077
          [ -s ops/vps/backup.age.pub ] || { echo "::error::ops/vps/backup.age.pub missing (generate on the VPS, commit the PUBLIC key)"; exit 1; }
          for f in "lm-db-$STAMP.dump" "lm-files-$STAMP.tar"; do
            age -R ops/vps/backup.age.pub -o "$f.age" "$f"
            shred -u "$f"
            echo "encrypted $f.age bytes=$(stat -c %s "$f.age") sha256=$(sha256sum "$f.age" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          find "$RUNNER_TEMP/lmdb/files" -type f -exec shred -u {} + 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/lmdb/files"
      - name: Ship to the VPS (forced-command receiver, action backup)
        if: ${{ !inputs.restore_drill_only }}
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.VPS_DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.VPS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key; printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ship() {
            local f="$1" sha; sha=$(sha256sum "$f" | cut -d' ' -f1)
            ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "lmdeploy@${HOST}" "backup $f $sha" < "$f" | tee ship.log || true
            grep -q "^BACKUP_OK $f\$" ship.log
          }
          # The database first: it is the backup that matters most and must not wait on the files.
          ship "lm-db-$STAMP.dump.age" || { echo "::error::receiver did not confirm BACKUP_OK for the database dump"; exit 1; }
          if ! ship "lm-files-$STAMP.tar.age"; then
            if grep -q 'BACKUP_FAIL bad name' ship.log; then
              echo "::error::the receiver installed on the VPS predates the Storage-files bundle — install ops/vps/lm-deploy-receive.sh from main (runbook §9.1); the database dump IS stored"
            else
              echo "::error::receiver did not confirm BACKUP_OK for the Storage-files bundle; the database dump IS stored"
            fi
            exit 1
          fi
          rm -f ~/.ssh/deploy_key
      - name: Clean the runner
        if: always()
        run: |
          shred -u lm-db-*.dump lm-db-*.dump.age lm-files-*.tar lm-files-*.tar.age 2>/dev/null || true
          find "$RUNNER_TEMP/lmdb" -type f -exec shred -u {} + 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/lmdb" ~/.ssh/deploy_key
