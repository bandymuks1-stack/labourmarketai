name: prod-qa-fresh-provision
run-name: prod-qa-fresh-provision ${{ inputs.action }}

# OWNER-DISPATCH ONLY. Creates (or bans) the TWO fresh synthetic production
# identities of the fresh-activation walk (owner decision 2026-10-26,
# "AKTYVAVIMO KLIŪČIŲ ŠALINIMAS"):
#
#   qa.freshworker+act1@labourmarket.ai    a brand-new worker
#   qa.freshcompany+act1@labourmarket.ai   a brand-new company
#
# Creating an account is an owner action: an agent does not dispatch this
# workflow. `prod-qa-walk.yml` (spec=fresh-activation) only SIGNS IN to these
# accounts and its mint refuses one that does not exist, so no walk can create
# them. The script is `apps/web/scripts/prod-qa-provision.ts` — the same
# owner-run script as the rest of the synthetic cast, refusing every address
# outside the hard-coded allowlist in `apps/web/lib/testing/prod-qa-guard.ts`:
#   - passwordless (sessions come from a magic-link OTP);
#   - marked confirmed and `app_metadata.qa_synthetic = true`;
#   - NO role or locale in user metadata, so onboarding starts exactly like a
#     real new account's;
#   - idempotent: an existing account is reported and left untouched.
#
# action=revoke bans both accounts (sessions die, rows stay for audit); the
# owner deletes them from the Supabase dashboard when no longer wanted.
#
# Needs (names only): secrets.NEXT_PUBLIC_SUPABASE_URL,
# secrets.SUPABASE_SERVICE_ROLE_KEY. Nothing is printed but origin, address
# and a short id prefix — never a key or token.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "provision = create the two fresh synthetic accounts; revoke = ban them"
        type: choice
        default: provision
        options:
          - provision
          - revoke

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-qa
    concurrency:
      group: prod-qa-walk
      cancel-in-progress: false
    env:
      PROD_QA_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      PROD_QA_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Provision or revoke the fresh pair (allowlist only)
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          cd apps/web
          flag=""
          [ "${ACTION}" = "revoke" ] && flag="--revoke"
          for who in "qa.freshworker+act1@labourmarket.ai" "qa.freshcompany+act1@labourmarket.ai"; do
            PROD_QA_PROVISION_IDENTITY="$who" pnpm exec tsx scripts/prod-qa-provision.ts --i-understand-production ${flag}
          done
          echo "fresh pair: ${ACTION} done" >> "$GITHUB_STEP_SUMMARY"
