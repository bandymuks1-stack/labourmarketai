# Norway supply cadence (NAV / Arbeidsplassen.no `pam-stilling-feed`).
#
# SEPARATE from sweden-supply-cadence.yml on purpose: that workflow hard-codes
# the Swedish provider, so nothing there can ever call NAV. NAV has
# its own cadence (the feed is a two-level, path-cursor feed of ~1,500
# changes/day), its own gate, its own concurrency group and its own failure
# surface, so a Norway failure never hides behind a Sweden green check and
# vice versa.
#
# INERT BY DEFAULT. This workflow no-ops until BOTH are configured in the
# GitHub console (never by committing a value):
#   secrets:   SUPABASE_SERVICE_ROLE_KEY, NEXT_PUBLIC_SUPABASE_URL,
#              VACANCY_SOURCE_NAV_API_TOKEN   (NAV's private production token)
#   variables: VACANCY_SOURCE_NAV_ENABLED=true
#              VACANCY_SCHEDULE_ENABLED=true  (shared kill switch, as Sweden)
#
# It invokes EXACTLY the canonical operator runner: the same cursor discipline,
# bounded pages per session, lifecycle withdrawals (INACTIVE / 404 / 410 ->
# is_active=false: NAV's terms require immediate removal), chunked writes and
# failure semantics. The cursor is the feed's own continuation token, so each
# run resumes where the last stopped; the first runs walk the bounded cold-start
# window forward, later runs poll the head. contactList is never read.
# Kill switch: unset/false VACANCY_SCHEDULE_ENABLED or VACANCY_SOURCE_NAV_ENABLED.
#
# REQUEST BUDGET: each run is bounded by the NAV descriptor in
# apps/web/lib/vacancy-sources/vacancy-provider-registry.ts (2 listing pages,
# 100 detail requests, 2 in flight, >= 500 ms between requests; worst case
# pinned by apps/web/lib/vacancy-sources/nav-request-budget.test.ts). A cold
# start therefore drains over several runs, resuming inside a CLOSED page only.
#
# SELF-RECOVERY + INCIDENT DE-DUPLICATION (2026-10-09; apps/web/scripts/
# vacancy-cadence-outcome.ts, provider-agnostic): GitHub fires this cron only a
# handful of times a day, so one run must do more than one session and one
# transient failure must not cost hours or mail the owner on every red run.
#   - a persist run loops up to 8 sessions (13 min wall clock, inside the 20 min
#     job timeout), stopping at caughtUp, at the first failure, or when the
#     source is behind but the cursor is not moving. The per-session request
#     budget above is UNCHANGED: runs x sessions x 102 is the new ceiling, pinned
#     in nav-request-budget.test.ts.
#   - a TRANSIENT failure (timeout, network, 5xx, 429) is retried in-run up to
#     twice after a 30-60 s jittered wait; 401/403/400/validation never are.
#   - notifications are per INCIDENT, not per failed run: failed runs 1-2 are a
#     warning annotation + job summary (green check); the 3rd consecutive failed
#     run, or the first hard failure, opens ONE `ingestion-incident` issue and
#     fails that run once; further failing runs stay quiet (status comment at
#     most daily); the first success comments "recovered" and closes the issue.
#   - the kill switch is untouched: the gate step below and the runner's own
#     VACANCY_SOURCE_NAV_ENABLED check are byte-equivalent to before, and a
#     session the runner reports as `blocked` is a hard failure, never skipped.
name: nav-supply-cadence

on:
  schedule:
    # Every 10 minutes. NAV documents ~2 minute polling as the intended
    # rhythm; GitHub's scheduler is best-effort and drops sub-5-minute
    # crons, and the removal duty is "promptly", so 10 minutes is the
    # smallest interval this platform honours reliably.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run = fetch + parse + validate, NO write (bounded); persist = write"
        type: choice
        options:
          - dry_run
          - persist
        default: dry_run

concurrency:
  group: nav-supply-cadence
  cancel-in-progress: false

permissions:
  contents: read
  # issues: write lets the cadence helper open/comment/close the single
  # `ingestion-incident` issue (and create that label once). Nothing else:
  # no contents, pull-requests, actions or packages write.
  issues: write
  # actions: write lets the `rearm` job re-dispatch THIS workflow (the only
  # workflow_dispatch the default token may create). Nothing else.
  actions: write

# SCHEDULER INDEPENDENCE (2026-10-09). GitHub's cron is best-effort: measured, the
# */10 schedule above produced 2 events in 12 h. The cron is therefore only the
# RESTARTER. After every gated-in run, the `rearm` job waits and dispatches this
# same workflow again (mode=persist), so cadence continues without a cron event.
# A Postgres watchdog (vacancy_scheduler_watchdog_v1, pg_cron every 5 min) detects
# a run that is late beyond tolerance and re-dispatches it from outside GitHub.
# All paths run the one canonical importer under the one concurrency group above;
# the cursor makes repeated execution a no-op.

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      gated: ${{ steps.gate.outputs.configuration_gated }}
      started: ${{ steps.gate.outputs.started }}
    steps:
      - name: Kill switch / configuration gate
        id: gate
        env:
          SCHEDULE_ENABLED: ${{ vars.VACANCY_SCHEDULE_ENABLED }}
          PROVIDER_ENABLED: ${{ vars.VACANCY_SOURCE_NAV_ENABLED }}
          HAS_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          HAS_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}
          HAS_TOKEN: ${{ secrets.VACANCY_SOURCE_NAV_API_TOKEN != '' }}
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ "$SCHEDULE_ENABLED" != "true" ] || [ "$PROVIDER_ENABLED" != "true" ] || [ "$HAS_KEY" != "true" ] || [ "$HAS_URL" != "true" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "configuration_gated=true" >> "$GITHUB_OUTPUT"
            echo "Inert: NAV schedule/provider variables or secrets not configured. This is the designed no-op state."
          else
            echo "configuration_gated=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.configuration_gated == 'false'

      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.configuration_gated == 'false'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.configuration_gated == 'false'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.gate.outputs.configuration_gated == 'false'
        run: pnpm install --frozen-lockfile

      - name: Bounded NAV stream sessions (canonical operator runner, self-recovering)
        if: steps.gate.outputs.configuration_gated == 'false'
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VACANCY_SOURCE_NAV_ENABLED: "true"
          VACANCY_SOURCE_NAV_API_TOKEN: ${{ secrets.VACANCY_SOURCE_NAV_API_TOKEN }}
          # Used only by the helper's `gh` calls (issue open/comment/close).
          GH_TOKEN: ${{ github.token }}
          # Schedule events carry no inputs: empty falls back to persist, the
          # cadence's purpose. A manual run defaults to dry_run.
          IMPORT_MODE: ${{ inputs.mode || 'persist' }}
        run: |
          # pipefail is load-bearing: without it the pipeline's status is
          # tee's (always 0) and a runner crash shows a green check.
          set -o pipefail
          if [ "$IMPORT_MODE" = "persist" ]; then
            # Loop + retry + incident de-duplication. Exit 1 ONLY for a newly
            # opened incident (the single notification); see the header.
            pnpm tsx scripts/vacancy-cadence-outcome.ts --provider nav --channel stream
          else
            pnpm tsx --conditions=react-server scripts/vacancy-operator-run.ts \
              --provider nav --channel stream --mode dry_run | tee run-accounting.json
          fi

      - name: Upload accounting artifact
        # always(): a red run is exactly when the accounting matters most. The
        # accounting never contains the token (guard-pinned: the runner and the
        # importer log/event types cannot carry one).
        if: always() && steps.gate.outputs.configuration_gated == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: nav-run-accounting-${{ github.run_id }}
          path: |
            apps/web/run-accounting.json
            apps/web/run-sessions.json
          if-no-files-found: ignore
          retention-days: 30

  rearm:
    # Keeps the cadence alive between (unreliable) cron events. Honors the kill
    # switch: a gated-out run never rearms, so unsetting the variables stops the
    # chain within one run.
    needs: import
    if: always() && needs.import.outputs.gated == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait, then dispatch the next run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Epoch seconds recorded by the gate step (the run-start API field is NOT a
          # runner context value: it expanded empty and the wait was skipped).
          RUN_START_EPOCH: ${{ needs.import.outputs.started }}
        run: |
          # REQUEST BUDGET: starts are spaced >= 600 s apart (the documented
          # 144 sessions/day ceiling in nav-request-budget.test.ts), measured from
          # this run's START, never from its end.
          start="$RUN_START_EPOCH"
          # Fail safe: a missing/garbled start means a FULL 600 s wait, never none.
          case "$start" in ''|*[!0-9]*) start=$(date +%s) ;; esac
          wait=$(( start + 600 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          # At most one successor: skip if another run is already queued.
          queued=$(gh run list --workflow nav-supply-cadence.yml --status queued --json databaseId --jq 'length' || echo 0)
          if [ "${queued:-0}" -gt 0 ]; then
            echo "A run is already queued; not dispatching another."
            exit 0
          fi
          gh workflow run nav-supply-cadence.yml -f mode=persist

      - name: Sweden freshness backstop (independent of NAV's outcome)
        # The Sweden cron (every 3 h) is dropped by GitHub for 6-9 h at a time. This
        # job already runs every ~10 min, so it also checks Sweden's own durable
        # cursor and re-dispatches the SAME sweden-supply-cadence.yml (stream,
        # idempotent, own concurrency group, own cursor) when its last run is older
        # than 3 h + 90 min. It reads one timestamp; it ingests nothing and never
        # touches NAV state. Skipped (not failed) if the read is unavailable.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SE_ENABLED: ${{ vars.VACANCY_SOURCE_ARBETSFORMEDLINGEN_ENABLED }}
        run: |
          if [ "$SE_ENABLED" != "true" ]; then echo "Sweden provider disabled; nothing to do."; exit 0; fi
          last=$(curl -sS --max-time 20 \
            "$SUPABASE_URL/rest/v1/vacancy_import_cursors?provider_key=eq.arbetsformedlingen&channel=eq.stream&select=last_run_at" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            | node -e 'try{const r=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(r[0]&&r[0].last_run_at||"")}catch{console.log("")}')
          if [ -z "$last" ]; then echo "Sweden cursor unreadable; skipping."; exit 0; fi
          age=$(( $(date +%s) - $(date -d "$last" +%s) ))
          echo "Sweden last_run_at=$last age=${age}s"
          if [ "$age" -le $(( 4*3600 + 1800 )) ]; then echo "Sweden within its contracted window."; exit 0; fi
          busy=$(gh run list --workflow sweden-supply-cadence.yml --json status --jq '[.[]|select(.status=="queued" or .status=="in_progress")]|length' || echo 0)
          if [ "${busy:-0}" -gt 0 ]; then echo "Sweden run already queued/running."; exit 0; fi
          echo "::warning title=Sweden scheduler miss::last run ${age}s ago; dispatching fallback"
          gh workflow run sweden-supply-cadence.yml -f channel=stream
