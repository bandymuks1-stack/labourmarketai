name: Quality Gates

# First CI workflow for this repo. Until now CI was Vercel build/deploy +
# Supabase preview only; there was no GitHub Actions quality pipeline.
#
# This runs the existing static quality gates — including the primary-route
# smoke / dead-UI guard added in PR #136 — on every push to main and every PR,
# so a dead link / placeholder leak / broken primary route is caught BEFORE it
# reaches the Vercel production deploy.
#
# Deliberately secret-free: no env/secrets, no DB, no deploy. `next build` is
# included because it is env-independent in this repo (it builds with no
# secrets). Vercel remains the authoritative build + deploy.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The Product Gate diffs the PR against its base, so the base ref must
          # exist locally. The default shallow checkout has no origin/main.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      # `--filter=!mobile` keeps the REQUIRED gate's cost flat.
      #
      # apps/mobile (Expo / React Native) pulls roughly a thousand packages
      # that nothing in this workflow runs. Installing them on every web PR
      # would add minutes to the one check that gates every merge, for no
      # coverage: `pnpm -F web ...` never touches them, and the client-core
      # guard below reads its files off the checkout rather than through a
      # dependency edge.
      #
      # The mobile side is built and typechecked by .github/workflows/mobile.yml
      # instead. This filter fails in the SAFE direction — if the exclusion ever
      # stops matching, the install is merely slower, never incomplete.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=!mobile

      - name: Typecheck
        run: pnpm -F web typecheck

      - name: Lint
        run: pnpm -F web lint

      - name: Unit tests (vitest)
        run: pnpm -F web test

      - name: Placeholder governance check
        run: pnpm placeholders:check

      # Honesty-copy gates (audit F-Q3): these scripts existed but were wired
      # into neither CI nor vitest — regressions shipped unless someone
      # remembered to run them by hand. Secret-free, same class as
      # placeholders:check.
      - name: Fit-signal copy guard (SR-6)
        run: pnpm -F web check:fit-signal-copy

      - name: Pilot honesty copy guard (SR-2)
        run: pnpm -F web check:pilot-honesty-copy

      - name: Pricing honesty copy guard (SR-5)
        run: pnpm -F web check:pricing-honesty-copy

      - name: Worker plain-language copy guard (low-cognitive-load v1)
        run: pnpm -F web check:worker-plain-language

      - name: Constitution compliance guard (pinned policy + doctrine phrases)
        run: pnpm -F web check:constitution

      - name: Primary route smoke / dead-UI guard
        run: pnpm check:primary-route-smoke

      # Domain / SEO indexing guard (launch repair v1): existed as a script but
      # was never wired into CI, so a canonical/robots/banned-brand regression
      # could ship. Secret-free static audit.
      - name: Public SEO indexing guard
        run: pnpm check:public-seo-indexing

      # i18n debt ratchet: fails only when untranslated-key debt REGRESSES
      # above the committed baseline (never on existing debt).
      - name: i18n debt ratchet
        run: pnpm check:i18n-debt

      # Product Gate (Product Constitution enforcement, P0).
      #
      # Diffs the PR for NEW product surfaces (screens, menu items, dashboard
      # elements, popups, modules, wizards, persistent cards). Each must be
      # declared in apps/web/lib/product-gate/surface-registry.ts with its
      # origin axiom, purpose, why-not-chat, why-not-existing-component and
      # owner. Any automatic RED rule (docs/PRODUCT_CONSTITUTION.md 13.3) sets
      # PRODUCT_REVIEW_REQUIRED and blocks the merge. Always writes
      # PRODUCT_ARCHITECTURE_DIFF.md for the reviewer.
      # PR_NUMBER / PR_HEAD_SHA feed the SCOPED OWNER WAIVER check
      # (.github/scripts/owner-waivers.mjs). A waiver is bound to specific pull
      # requests, so a run that cannot identify its PR waives nothing — which is
      # the safe direction: push-to-main runs and anything unrecognised block.
      - name: Product gate (constitution enforcement)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "$BASE_REF"
          BASE_SHA="origin/$BASE_REF" node .github/scripts/product-gate.mjs

      - name: Product gate self-test (detectors must fire)
        run: node .github/scripts/product-gate.mjs --self-test

      # Anon SECURITY DEFINER allowlist — LIVE half.
      #
      # The static half already runs above inside `pnpm -F web test`
      # (apps/web/lib/guards/secdef-anon-allowlist.test.ts) and is a hard gate.
      # But static analysis provably cannot see the defect class this exists for:
      # the 2026-07-22 P0 was a leftover default PUBLIC EXECUTE grant that no
      # migration diff revealed. Only the catalog shows it, so only a live check
      # is authoritative.
      #
      # This step needs a database connection string, and a new secret is an
      # OWNER-ONLY gate. Until the owner adds `SUPABASE_DB_URL`, the step reports
      # loudly that the live gate is NOT active rather than printing a green tick
      # — a gate that passes without checking anything is worse than no gate.
      # The checker itself refuses to run without DB_URL (exit 2); it no longer
      # defaults to localhost, which could make an empty local database look like
      # a statement about production.
      - name: Anon SECURITY DEFINER allowlist (live catalog gate)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL}" ]; then
            echo "::warning title=Live secdef gate NOT active::secrets.SUPABASE_DB_URL is not configured, so the anon SECURITY DEFINER allowlist was NOT verified against a real catalog. The static half ran and passed. Owner action required to activate this gate: add a read-only SUPABASE_DB_URL secret."
            echo "SKIPPED — no SUPABASE_DB_URL secret. Static half ran; live half did NOT."
            exit 0
          fi
          pnpm check:anon-secdef-allowlist

      # Migration parity — LIVE half (same owner gate as the secdef step above).
      #
      # `pnpm check:migration-parity` proves every migration applied to
      # production has a repository file (doctrine §16 / REQ-GOV-016). Static
      # analysis cannot see this defect class either: an orphan is defined by
      # its ABSENCE from the repo, and only production's own
      # `supabase_migrations.schema_migrations` knows what was applied. The
      # 2026-08-18 audit found one orphan invisible for six weeks; the
      # 2026-08-23 refresh ran in snapshot mode (an MCP-read ledger snapshot,
      # docs/migrations/production-ledger-snapshot.json) because lead sessions
      # have MCP access but no connection string. This step activates the LIVE
      # check the moment the owner adds the same read-only SUPABASE_DB_URL
      # secret — one owner action arms both gates.
      - name: Migration parity (live ledger gate)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL}" ]; then
            echo "::warning title=Live migration-parity gate NOT active::secrets.SUPABASE_DB_URL is not configured, so repo↔production migration parity was NOT verified against the real ledger. The latest committed snapshot run is recorded in docs/migrations/production-parity-register.md. Owner action required to activate this gate: add a read-only SUPABASE_DB_URL secret."
            echo "SKIPPED — no SUPABASE_DB_URL secret. Snapshot-mode runs remain available to lead sessions."
            exit 0
          fi
          pnpm check:migration-parity

      - name: Build (env-independent; Vercel remains deploy authority)
        run: pnpm -F web build
