# JOBS + NEED JOURNEY — the beta screens from #2871, on a device, signed in.
#
# Runs ONLY from the dispatch jobs that run signed-in-journey.yaml (production-qa
# environment, the owner's ONE synthetic review identity). Expects to start on the
# sign-in form after signed-in-journey.yaml signed out.
#
# What a green run proves:
#   1. sign-in lands on Today; Today opens the Jobs board;
#   2. the board is read through jobs.search and renders a LOADED read; opening
#      the first job hands its page to the browser and the app comes back;
#      (testID jobs-loaded renders only on a loaded read — a failed read renders
#      capability-retry and the step fails);
#   3. Today opens Post a need; an empty need is refused in place (need-local-error),
#      nothing is drafted;
#   4. ONLY with NEED_SUBMIT=1 (isolated runs): a filled need is drafted
#      (demand.create_draft), previewed, confirmed (demand.create_confirm) and the
#      sent state renders.
# The need it posts is marked QA-SYNTHETIC in its text, so the walk cleanup and the
# owner can find and close it. Navigation is by testID only.
appId: ai.labourmarket.app
name: jobs-need-journey
---
# The keyboard is put away on BOTH platforms after typing: Android by
# hideKeyboard; iOS WITHOUT a drag — Return on a one-line box, or a tap on a
# plain label (`<field>-label`) for the multi-line box and the number pad,
# where Maestro's hideKeyboard fails. The app no longer closes the keyboard on
# drag (#2878: after a drag closed it, no tap reached the app again in CI).
# A tap during scroll momentum only stops the scroll on Android, so every
# scrollUntilVisible is followed by waitForAnimationToEnd before the tap.
- extendedWaitUntil:
    visible:
      id: "email"
    timeout: 30000
- tapOn:
    id: "email"
- inputText: ${MOBILE_QA_EMAIL}
- tapOn:
    id: "password"
- inputText: ${MOBILE_QA_PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "submit"
# iOS offers to save the password after a sign-in ("Save Password?"), a system
# sheet over the whole app (the on-screen ids show only the status bar under
# it). It is useful to people and stays; the journey answers it "Not Now".
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: "Not Now"
          timeout: 10000
          optional: true
      - tapOn:
          text: "Not Now"
          optional: true
- extendedWaitUntil:
    visible:
      id: "tab-today"
    timeout: 60000
# …and again if it only appeared after Today rendered.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            text: "Not Now"
          timeout: 10000
          optional: true
      - tapOn:
          text: "Not Now"
          optional: true
# Today's figures load ABOVE the station buttons: when they arrive after the
# scroll found a button, the layout grows and the button moves off screen
# before the tap ("today-open-jobs not found" right after the scroll found it:
# android.yml 40922440308, android-need-isolated 40869901855 / 40904995024).
# Wait for the figures — or their failure notice — to settle first (iOS
# 40934266154: the figures read failed, the retry notice arrived after the
# scroll, and the tap meant for Jobs opened Profile).
- extendedWaitUntil:
    visible:
      id: "today-figures|capability-retry"
    timeout: 30000
    optional: true
# A failed Today read is reported, never passed off as a full read: the CI
# claim line names it when this label COMPLETED.
- runFlow:
    label: "TODAY_READ_DEGRADED (capability-retry on Today)"
    when:
      visible:
        id: "capability-retry"
    commands:
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "today-open-jobs"
    direction: DOWN
    timeout: 60000
- waitForAnimationToEnd

# --- 1–2. Jobs: search, a loaded board ---
- tapOn:
    id: "today-open-jobs"
- extendedWaitUntil:
    visible:
      id: "jobs-query"
    timeout: 30000
# The board itself, unfiltered: the newest public vacancies, so the job-open
# step below has a real job. (A free-text word is matched against the job's
# SOURCE-language occupation, so an English word can rightly find nothing;
# the free-text path is proven by the production web walk jobs-search.)
- tapOn:
    id: "jobs-search"
- extendedWaitUntil:
    visible:
      id: "jobs-loaded"
    timeout: 60000

# --- 2b. Open a job: the app hands the job page to the browser, then comes back ---
# (the job page itself is proven by the production web walk jobs-search J-5)
- runFlow:
    when:
      visible:
        id: "jobs-open-0"
    commands:
      - tapOn:
          id: "jobs-open-0"
      # Back to the app WITHOUT stopping it, so the board is still there.
      - launchApp:
          clearState: false
          stopApp: false
      # REQUIRED, positive: the row records that the system accepted the hand-off
      # to the browser (Linking.openURL resolved) — a state word, no URL.
      - extendedWaitUntil:
          visible:
            id: "jobs-open-0-result-ok"
          timeout: 30000
      # …and the app is in the foreground and still signed in (its tab bar).
      - extendedWaitUntil:
          visible:
            id: "tab-today"
          timeout: 30000
# Back to Today by its tab (Maestro's `back` is Android-only; this flow runs on iOS too).
- tapOn:
    id: "tab-today"

# --- 3. Need: an empty need is refused in place ---
- extendedWaitUntil:
    visible:
      id: "today-figures|capability-retry"
    timeout: 30000
    optional: true
# A failed Today read is reported, never passed off as a full read: the CI
# claim line names it when this label COMPLETED.
- runFlow:
    label: "TODAY_READ_DEGRADED (capability-retry on Today)"
    when:
      visible:
        id: "capability-retry"
    commands:
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "today-open-need"
    direction: DOWN
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: "today-open-need"
- extendedWaitUntil:
    visible:
      id: "need-write"
    timeout: 30000
# The form is taller than a phone screen and tapOn does not scroll.
- scrollUntilVisible:
    element:
      id: "need-cancel"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: "need-review"
# The empty need is refused ON THE PHONE (need-local-error), before any request.
- scrollUntilVisible:
    element:
      id: "need-local-error"
    direction: UP
    timeout: 30000
- waitForAnimationToEnd

# --- 4. Need: fill, draft, preview, confirm, sent ---
# OFF unless NEED_SUBMIT=1: a confirmed need is a real production row, and cross-org
# readers are not yet proven to exclude synthetic needs (isolation audit 2026-10-28).
- runFlow:
    when:
      true: ${NEED_SUBMIT == '1'}
    commands:
      # The refusal above left the form scrolled down; the first field is at the top.
      - scrollUntilVisible:
          element:
            id: "need-description"
          direction: UP
          timeout: 20000
      - tapOn:
          id: "need-description"
      - inputText: "QA-SYNTHETIC mobile journey: two tilers for a bathroom renovation, three weeks."
      - runFlow:
          when:
            platform: Android
          commands:
            - hideKeyboard
      # iOS: Return in a multi-line box is a new line, so tap the box's own
      # label (it sits right above the box, which was just tapped, so it is on
      # screen) — no drag.
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                id: "need-description-label"
            - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            id: "need-role"
          direction: DOWN
          timeout: 20000
      - tapOn:
          id: "need-role"
      - inputText: "QA-SYNTHETIC mobile tiler"
      - runFlow:
          when:
            platform: Android
          commands:
            - hideKeyboard
      # iOS: Return on a one-line box puts the keyboard away — no drag.
      - runFlow:
          when:
            platform: iOS
          commands:
            - pressKey: Enter
            - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            id: "need-location"
          direction: DOWN
          timeout: 20000
      - waitForAnimationToEnd
      - tapOn:
          id: "need-location"
      - inputText: "Vilnius"
      - runFlow:
          when:
            platform: Android
          commands:
            - hideKeyboard
      # iOS: Return on a one-line box puts the keyboard away — no drag.
      - runFlow:
          when:
            platform: iOS
          commands:
            - pressKey: Enter
            - waitForAnimationToEnd
      # Scroll to the END of the form (not just to the team-size box), so the
      # box and its label sit well above where the number pad will rise.
      - scrollUntilVisible:
          element:
            id: "need-cancel"
          direction: DOWN
          timeout: 20000
      - waitForAnimationToEnd
      - tapOn:
          id: "need-team-size"
      - inputText: "2"
      - runFlow:
          when:
            platform: Android
          commands:
            - hideKeyboard
      # iOS: the number pad has no Return key; a tap on the box's own label
      # puts it away — no drag.
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                id: "need-team-size-label"
            - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            id: "need-cancel"
          direction: DOWN
          timeout: 20000
      - waitForAnimationToEnd
      - tapOn:
          id: "need-review"
      - extendedWaitUntil:
          visible:
            id: "need-preview"
          timeout: 60000
      - scrollUntilVisible:
          element:
            id: "need-confirm"
          direction: DOWN
          timeout: 20000
      - waitForAnimationToEnd
      - tapOn:
          id: "need-confirm"
      - extendedWaitUntil:
          visible:
            id: "need-sent"
          timeout: 60000
