# AGENCY ↔ CLIENT — isolated runs only (android-need-isolated.yml), after
# review-journey.yaml (which leaves the company signed in).
#
# What a green run proves, on the job's LOCAL stack (production untouched):
#   1. the synthetic STAFFING AGENCY (M-4) signs in, opens its Agency station
#      and invites the seed company by e-mail (agency.invite-client
#      prepare → confirm);
#   2. the company (M-0) signs in, opens Staffing agencies, ACCEPTS that
#      invitation (company.accept-connection) and SHARES one of its own needs
#      with the agency (company.share-request), each prepare → confirm.
# The next workflow step finds the connection active and one share.
appId: ai.labourmarket.app
name: agency-clients-journey
---
# --- Sign the company out, the agency in ---
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible:
      id: "email"
    timeout: 30000
- tapOn:
    id: "email"
- inputText: ${MOBILE_AGENCY_EMAIL}
- tapOn:
    id: "password"
- inputText: ${MOBILE_AGENCY_PASSWORD}
- hideKeyboard
- tapOn:
    id: "submit"
- extendedWaitUntil:
    visible:
      id: "tab-today"
    timeout: 60000

# --- 1. The agency invites the company ---
- scrollUntilVisible:
    element:
      id: "today-open-agency"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "today-open-agency"
- extendedWaitUntil:
    visible:
      id: "agency-list"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "agency-invite-email"
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: "agency-invite-email"
- inputText: ${MOBILE_QA_EMAIL}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "agency-invite-review"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "agency-invite-review"
- scrollUntilVisible:
    element:
      id: "agency-invite-confirm"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "agency-invite-confirm"
- scrollUntilVisible:
    element:
      id: "agency-invite-done"
    direction: DOWN
    timeout: 60000
    centerElement: true

# --- Sign the agency out, the company in ---
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible:
      id: "email"
    timeout: 30000
- tapOn:
    id: "email"
- inputText: ${MOBILE_QA_EMAIL}
- tapOn:
    id: "password"
- inputText: ${MOBILE_QA_PASSWORD}
- hideKeyboard
- tapOn:
    id: "submit"
- extendedWaitUntil:
    visible:
      id: "tab-today"
    timeout: 60000

# --- 2. The company accepts, then shares a need ---
- scrollUntilVisible:
    element:
      id: "today-open-agencies"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "today-open-agencies"
- extendedWaitUntil:
    visible:
      id: "client-agencies-list"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "client-agencies-accept-.*"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "client-agencies-accept-.*"
    index: 0
- scrollUntilVisible:
    element:
      id: "client-agencies-confirm"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "client-agencies-confirm"
- extendedWaitUntil:
    visible:
      id: "client-agencies-done"
    timeout: 60000
- tapOn:
    id: "client-agencies-back"
- extendedWaitUntil:
    visible:
      id: "client-agencies-list"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "client-agencies-share-0"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "client-agencies-share-0"
- scrollUntilVisible:
    element:
      id: "client-agencies-confirm"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "client-agencies-confirm"
- extendedWaitUntil:
    visible:
      id: "client-agencies-done"
    timeout: 60000
