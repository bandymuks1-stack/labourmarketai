# WORK REVIEW — isolated runs only (android-need-isolated.yml), after
# booking-journey.yaml (which leaves the M-1 worker signed in).
#
# What a green run proves, on the job's LOCAL stack (production untouched):
# the company signs in, opens Work review from Today (organization
# workspace), sees its employee's journal entry (journal.review_queue.get),
# approves it with a note (journal.review_draft → journal.review_confirm), and
# the entry leaves the queue. The next workflow step finds exactly one
# employer approval of that entry in the local database.
# The entry is addressed by id: the workflow reads it from the local database
# and passes it in (REVIEW_ENTRY_ID).
appId: ai.labourmarket.app
name: review-journey
---
# --- Sign the worker out, the company in ---
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible:
      id: "email"
    timeout: 30000
- tapOn:
    id: "email"
- inputText: ${MOBILE_QA_EMAIL}
- tapOn:
    id: "password"
- inputText: ${MOBILE_QA_PASSWORD}
- hideKeyboard
- tapOn:
    id: "submit"
- extendedWaitUntil:
    visible:
      id: "tab-today"
    timeout: 60000

# --- Work review: the employee's entry, approved with a note ---
- scrollUntilVisible:
    element:
      id: "today-open-review"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "today-open-review"
- extendedWaitUntil:
    visible:
      id: "review-entry-${REVIEW_ENTRY_ID}"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "review-approve-${REVIEW_ENTRY_ID}"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "review-approve-${REVIEW_ENTRY_ID}"
- extendedWaitUntil:
    visible:
      id: "review-form-${REVIEW_ENTRY_ID}"
    timeout: 30000
- tapOn:
    id: "review-note"
- inputText: "QA-SYNTHETIC approved from the phone"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "review-prepare-${REVIEW_ENTRY_ID}"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "review-prepare-${REVIEW_ENTRY_ID}"
- scrollUntilVisible:
    element:
      id: "review-confirm-${REVIEW_ENTRY_ID}"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "review-confirm-${REVIEW_ENTRY_ID}"
# A decided entry leaves the queue; it was the only one.
- extendedWaitUntil:
    visible:
      id: "review-empty"
    timeout: 60000
