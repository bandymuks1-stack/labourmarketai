# EMPLOYER SCREENS — isolated runs only (android-need-isolated.yml), right
# after need-second-journey.yaml left the app on the second need's sent state.
#
# What a green run proves, on the job's LOCAL stack (production untouched):
#   1. Today shows the organization stations to a company owner (#3466);
#   2. Find candidates lists the company's needs (demand.list) and closes one
#      need, then reopens it, each through draft → explicit confirm — the next
#      workflow step finds one close_demand and one reopen_demand audit row and
#      the need submitted again;
#   3. one need's candidate list opens (candidate.search; none on a fresh stack);
#   4. Agency offers answers "none" for a company with no agency;
#   5. Programmes & cohorts answers "not a training provider".
# Navigation is by testID only; an id ending in a database uuid is matched by
# its stable prefix.
appId: ai.labourmarket.app
name: employer-screens-journey
---
# A tap during scroll momentum only stops the scroll on Android, so every
# scrollUntilVisible is followed by waitForAnimationToEnd before the tap.
- scrollUntilVisible:
    element:
      id: "need-done"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: "need-done"
- extendedWaitUntil:
    visible:
      id: "tab-today"
    timeout: 30000

# --- 1. Today: the organization stations are there for a company owner ---
- scrollUntilVisible:
    element:
      id: "today-open-candidates"
    direction: DOWN
    timeout: 30000
    centerElement: true
# Each station is SCROLLED to, not assumed on screen: the organization block
# grows as screens arrive, and a station below the fold is still there.
- scrollUntilVisible:
    element:
      id: "today-open-agency-offers"
    direction: DOWN
    timeout: 30000
    centerElement: true
- scrollUntilVisible:
    element:
      id: "today-open-education"
    direction: DOWN
    timeout: 30000
    centerElement: true
- scrollUntilVisible:
    element:
      id: "today-open-sent-proposals"
    direction: DOWN
    timeout: 30000
    centerElement: true
- scrollUntilVisible:
    element:
      id: "today-open-candidates"
    direction: UP
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "today-open-candidates"

# --- 2. Find candidates: the needs, then close → reopen one of them ---
- extendedWaitUntil:
    visible:
      id: "candidates-needs"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "need-close-.*"
      index: 0
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: "need-close-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "need-close-confirm-.*"
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: "need-close-confirm-.*"
# The list re-reads: the closed need now offers Reopen and no candidate search.
- extendedWaitUntil:
    visible:
      id: "need-reopen-.*"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "need-reopen-.*"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: "need-reopen-.*"
- extendedWaitUntil:
    visible:
      id: "need-reopen-confirm-.*"
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: "need-reopen-confirm-.*"
- extendedWaitUntil:
    notVisible:
      id: "need-reopen-.*"
    timeout: 60000

# --- 3. One need's candidates ---
- scrollUntilVisible:
    element:
      id: "candidates-need-.*"
      index: 0
    direction: UP
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: "candidates-need-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "candidates-list"
    timeout: 60000
- tapOn:
    id: "candidates-back"
- extendedWaitUntil:
    visible:
      id: "candidates-needs"
    timeout: 60000

# --- 4. Agency offers: none for a company with no agency ---
- tapOn:
    id: "tab-today"
- scrollUntilVisible:
    element:
      id: "today-open-agency-offers"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "today-open-agency-offers"
- extendedWaitUntil:
    visible:
      id: "agency-offers-none"
    timeout: 60000

# --- 5. Programmes & cohorts: this company is not a training provider ---
- tapOn:
    id: "tab-today"
- scrollUntilVisible:
    element:
      id: "today-open-education"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "today-open-education"
- extendedWaitUntil:
    visible:
      id: "education-not-institution"
    timeout: 60000
