# NEW SCREENS WALK — READ ONLY. The screens #3451, #3453 and #3471 added, walked
# on a device as the owner's ONE synthetic review identity.
#
# Runs ONLY from the dispatch jobs (android.yml `signed-in`, ios-signed-in.yml)
# and ONLY when the dispatch input `new_screens_walk` is true: J-2 dispatches it
# with the owner's approval, never a PR or a push. It runs AFTER parity-journey
# .yaml, which signs out, so it signs in itself.
#
# NOTHING IS WRITTEN — not even a telemetry row. No save, no shortlist, no
# close, no proposal, no answer, no invitation: every form opened here is left
# with its Cancel / Back button. A need's candidate list is NOT opened: its
# search writes a funnel row (R on #3484), so it is proven on the isolated
# local stack only. None of the reads below emits a funnel event.
#
# What a green run proves:
#   1. Profile: the Living CV sections render (cv.verified.get) with their add
#      buttons; the work-history form opens and is cancelled without saving;
#      the education and language forms open and are cancelled the same way.
#   2. Today follows the active workspace (#3466). In an ORGANIZATION
#      workspace the walk opens Find candidates (demand.list), Agency offers
#      (client.agency_offers.get) and Programmes & cohorts
#      (education.workspace.get) — each must render its loaded view or a
#      named refusal (`capability-failed`), never spin. In a PERSONAL workspace
#      those stations are absent, and the label below says so in the log.
#   last. sign-out returns to the sign-in form.
# No screenshot and no debug output (the repository is public).
appId: ai.labourmarket.app
name: new-screens-walk
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "email|tab-today"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "email"
    commands:
      - tapOn:
          id: "email"
      - inputText: ${MOBILE_QA_EMAIL}
      # The iOS driver has typed a different address before (run 41403100804);
      # the field is read back and typed again when it differs.
      - copyTextFrom:
          id: "email"
      - evalScript: ${output.emailTyped = maestro.copiedText === MOBILE_QA_EMAIL}
      - runFlow:
          label: "EMAIL_RETYPED (the first typing differed)"
          when:
            true: ${output.emailTyped !== true}
          commands:
            - tapOn:
                id: "email"
            - eraseText: 80
            - inputText: ${MOBILE_QA_EMAIL}
      - tapOn:
          id: "password"
      - inputText: ${MOBILE_QA_PASSWORD}
      - runFlow:
          when:
            platform: Android
          commands:
            - hideKeyboard
      - tapOn:
          id: "submit"
      - runFlow:
          when:
            platform: iOS
          commands:
            - extendedWaitUntil:
                visible:
                  text: "Not Now"
                timeout: 10000
                optional: true
            - tapOn:
                text: "Not Now"
                optional: true
- extendedWaitUntil:
    visible:
      id: "tab-today"
    timeout: 60000

# --- 1. Profile: the Living CV sections and their forms (opened, cancelled) ---
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "cv-add-work|capability-failed"
    direction: DOWN
    timeout: 60000
    centerElement: true
- assertNotVisible:
    id: "capability-failed"
- waitForAnimationToEnd
- tapOn:
    id: "cv-add-work"
- extendedWaitUntil:
    visible:
      id: "cv-work-form"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "cv-work-cancel"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-work-cancel"
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "cv-add-education"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-add-education"
- extendedWaitUntil:
    visible:
      id: "cv-education-form"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "cv-education-cancel"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-education-cancel"
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "cv-add-language"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-add-language"
- extendedWaitUntil:
    visible:
      id: "cv-language-form"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "cv-language-cancel"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-language-cancel"

# --- 2. Today follows the workspace; the organization screens, read only ---
- tapOn:
    id: "tab-today"
- scrollUntilVisible:
    element:
      id: "today-open-need"
    direction: DOWN
    timeout: 30000
    centerElement: true
- runFlow:
    label: "PERSONAL_WORKSPACE (organization stations hidden on Today)"
    when:
      notVisible:
        id: "today-open-candidates"
    commands:
      - assertNotVisible:
          id: "today-open-agency-offers"
      - assertNotVisible:
          id: "today-open-education"
- runFlow:
    label: "ORGANIZATION_WORKSPACE (organization screens walked, read only)"
    when:
      visible:
        id: "today-open-candidates"
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: "today-open-candidates"
      - extendedWaitUntil:
          visible:
            id: "candidates-needs|capability-failed"
          timeout: 60000
      # NOT opened here: one need's candidate list. That runs candidate.search,
      # whose scouting core writes a `match_preview_generated` funnel row, and
      # the funnel does not exclude the synthetic identity (R on #3484). The
      # list is proven on the isolated local stack instead (#3482).
      - tapOn:
          id: "tab-today"
      - scrollUntilVisible:
          element:
            id: "today-open-agency-offers"
          direction: DOWN
          timeout: 30000
          centerElement: true
      - waitForAnimationToEnd
      - tapOn:
          id: "today-open-agency-offers"
      - extendedWaitUntil:
          visible:
            id: "agency-offers-none|agency-offers-list|capability-failed"
          timeout: 60000
      - tapOn:
          id: "tab-today"
      - scrollUntilVisible:
          element:
            id: "today-open-education"
          direction: DOWN
          timeout: 30000
          centerElement: true
      - waitForAnimationToEnd
      - tapOn:
          id: "today-open-education"
      - extendedWaitUntil:
          visible:
            id: "education-not-institution|education-list|capability-failed"
          timeout: 60000

# --- last. Sign out, back to the form ---
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible:
      id: "email"
    timeout: 30000
