# SHORTLIST, NOT A FIT, BOOKING — isolated runs only (android-need-isolated.yml),
# after cv-forms-journey.yaml (which leaves the M-1 worker signed in).
#
# What a green run proves, on the job's LOCAL stack (production untouched):
#   1. the company finds both discoverable synthetic workers on its own need
#      (candidate.search), puts the second one on the shortlist and then marks
#      them not a fit with a reason (shortlist.add / shortlist.remove);
#   2. it shortlists the first worker and proposes a start to them
#      (company.propose-booking prepare → confirm);
#   3. that worker signs in, sees the proposal under Offers (booking.list) and
#      accepts it (worker.respond-booking prepare → confirm).
# The next workflow step finds exactly those rows in the local database.
# Cards are addressed by worker id: the workflow reads both ids from the local
# database and passes them in (BOOK_WORKER_ID, NOT_FIT_WORKER_ID).
appId: ai.labourmarket.app
name: booking-journey
---
# --- Sign the worker out, the company in ---
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible:
      id: "email"
    timeout: 30000
- tapOn:
    id: "email"
- inputText: ${MOBILE_QA_EMAIL}
- tapOn:
    id: "password"
- inputText: ${MOBILE_QA_PASSWORD}
- hideKeyboard
- tapOn:
    id: "submit"
- extendedWaitUntil:
    visible:
      id: "tab-today"
    timeout: 60000

# --- The need's candidates ---
- scrollUntilVisible:
    element:
      id: "today-open-candidates"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "today-open-candidates"
- extendedWaitUntil:
    visible:
      id: "candidates-needs"
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: "candidates-need-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "candidates-list"
    timeout: 60000

# --- 1. The second worker: on the shortlist, then not a fit ---
- scrollUntilVisible:
    element:
      id: "candidate-shortlist-${NOT_FIT_WORKER_ID}"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "candidate-shortlist-${NOT_FIT_WORKER_ID}"
- scrollUntilVisible:
    element:
      id: "candidate-confirm-${NOT_FIT_WORKER_ID}"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "candidate-confirm-${NOT_FIT_WORKER_ID}"
- scrollUntilVisible:
    element:
      id: "candidate-not-fit-${NOT_FIT_WORKER_ID}"
    direction: DOWN
    timeout: 60000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "candidate-not-fit-${NOT_FIT_WORKER_ID}"
- tapOn:
    id: "candidate-reason"
- inputText: "QA-SYNTHETIC not a fit for this need"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "candidate-not-fit-review-${NOT_FIT_WORKER_ID}"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "candidate-not-fit-review-${NOT_FIT_WORKER_ID}"
- scrollUntilVisible:
    element:
      id: "candidate-confirm-${NOT_FIT_WORKER_ID}"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "candidate-confirm-${NOT_FIT_WORKER_ID}"
# A person the company decided against leaves the list.
- extendedWaitUntil:
    notVisible:
      id: "candidate-not-fit-${NOT_FIT_WORKER_ID}"
    timeout: 60000

# --- 2. The first worker: on the shortlist, then a proposed start ---
- scrollUntilVisible:
    element:
      id: "candidate-shortlist-${BOOK_WORKER_ID}"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "candidate-shortlist-${BOOK_WORKER_ID}"
- scrollUntilVisible:
    element:
      id: "candidate-confirm-${BOOK_WORKER_ID}"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "candidate-confirm-${BOOK_WORKER_ID}"
- scrollUntilVisible:
    element:
      id: "candidate-not-fit-${BOOK_WORKER_ID}"
    direction: DOWN
    timeout: 60000
    centerElement: true
- scrollUntilVisible:
    element:
      id: "candidate-book-${BOOK_WORKER_ID}"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "candidate-book-${BOOK_WORKER_ID}"
- extendedWaitUntil:
    visible:
      id: "booking-form-${BOOK_WORKER_ID}"
    timeout: 30000
- tapOn:
    id: "booking-start"
- inputText: "2027-03-01"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "booking-end"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: "booking-end"
- inputText: "2027-03-31"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "booking-review-${BOOK_WORKER_ID}"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "booking-review-${BOOK_WORKER_ID}"
- scrollUntilVisible:
    element:
      id: "booking-confirm-${BOOK_WORKER_ID}"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "booking-confirm-${BOOK_WORKER_ID}"
- scrollUntilVisible:
    element:
      id: "booking-sent"
    direction: DOWN
    timeout: 60000
    centerElement: true

# --- 3. The worker sees the proposal and accepts it ---
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible:
      id: "email"
    timeout: 30000
- tapOn:
    id: "email"
- inputText: ${MOBILE_WORKER_EMAIL}
- tapOn:
    id: "password"
- inputText: ${MOBILE_WORKER_PASSWORD}
- hideKeyboard
- tapOn:
    id: "submit"
- extendedWaitUntil:
    visible:
      id: "tab-today"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "today-open-offers"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "today-open-offers"
- extendedWaitUntil:
    visible:
      id: "offers-booking-0"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "offers-booking-accept-0"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "offers-booking-accept-0"
- scrollUntilVisible:
    element:
      id: "offers-confirm"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "offers-confirm"
- extendedWaitUntil:
    visible:
      id: "offers-done"
    timeout: 60000
