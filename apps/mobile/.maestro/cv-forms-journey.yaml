# LIVING CV FORMS — isolated runs only (android-need-isolated.yml), after
# employer-screens-journey.yaml. Signs the company out and signs in as the
# job's SECOND seed: a synthetic WORKER made through the real sign-up form (M-1).
#
# What a green run proves, on the job's LOCAL stack (production untouched):
# the worker adds to their own Living CV from the phone
#   1. a past job       (worker.add-work-history, ongoing),
#   2. a language       (worker.add-language),
#   3. a school         (worker.add-education),
# and each new row is shown back on the profile. The next workflow step finds
# exactly one row of each in the local database, owned by the worker seed.
# Navigation is by testID only. Android only (this job's emulator).
appId: ai.labourmarket.app
name: cv-forms-journey
---
# --- Sign the company out ---
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element:
      id: "sign-out"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible:
      id: "email"
    timeout: 30000

# --- Sign in as the worker seed ---
- tapOn:
    id: "email"
- inputText: ${MOBILE_WORKER_EMAIL}
- tapOn:
    id: "password"
- inputText: ${MOBILE_WORKER_PASSWORD}
- hideKeyboard
- tapOn:
    id: "submit"
- extendedWaitUntil:
    visible:
      id: "tab-today"
    timeout: 60000

# --- 1. A past job, ongoing ---
- tapOn:
    id: "tab-profile"
- scrollUntilVisible:
    element:
      id: "cv-add-work"
    direction: DOWN
    timeout: 60000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-add-work"
- extendedWaitUntil:
    visible:
      id: "cv-work-form"
    timeout: 30000
- tapOn:
    id: "cv-work-title"
- inputText: "QA-SYNTHETIC mobile tiler"
- hideKeyboard
- tapOn:
    id: "cv-work-start"
- inputText: "2019"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "cv-work-ongoing"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-work-ongoing"
- scrollUntilVisible:
    element:
      id: "cv-work-save"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-work-save"
- scrollUntilVisible:
    element:
      id: "cv-work-row"
    direction: DOWN
    timeout: 60000
    centerElement: true

# --- 2. A language ---
- scrollUntilVisible:
    element:
      id: "cv-add-language"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-add-language"
- extendedWaitUntil:
    visible:
      id: "cv-language-form"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "cv-language-en"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-language-en"
- scrollUntilVisible:
    element:
      id: "cv-level-B2"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-level-B2"
- scrollUntilVisible:
    element:
      id: "cv-language-save"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-language-save"
- extendedWaitUntil:
    notVisible:
      id: "cv-language-form"
    timeout: 60000

# --- 3. A school ---
- scrollUntilVisible:
    element:
      id: "cv-add-education"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-add-education"
- extendedWaitUntil:
    visible:
      id: "cv-education-form"
    timeout: 30000
- tapOn:
    id: "cv-education-institution"
- inputText: "QA-SYNTHETIC mobile school"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "cv-education-type-vocational"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-education-type-vocational"
- scrollUntilVisible:
    element:
      id: "cv-education-start"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-education-start"
- inputText: "2015"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "cv-education-end"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-education-end"
- inputText: "2018"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "cv-education-save"
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: "cv-education-save"
- scrollUntilVisible:
    element:
      id: "cv-education-row"
    direction: DOWN
    timeout: 60000
    centerElement: true
