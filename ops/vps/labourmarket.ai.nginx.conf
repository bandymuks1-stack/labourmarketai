# LabourMarket.ai vhost for the Agentai VPS (HestiaCP nginx 1.29). PREPARED 2026-10-17 — NOT ACTIVE.
# Activation (owner-approved step only):
#   mv /etc/nginx/conf.d/domains/labma.conf /root/labma-decommission-backup-20261016/labma.conf.nginx
#   cp labourmarket.ai.nginx.conf /etc/nginx/conf.d/domains/labourmarket.conf && nginx -t && systemctl reload nginx
# TLS: the Let's Encrypt certs on the VPS EXPIRED (labourmarket.ai 2026-07-14, api. 2026-09-19); renewal fails
# because DNS points at Vercel. Recommended 0 € path: Cloudflare proxied record + SSL "Full (strict)" +
# a Cloudflare Origin CA certificate (owner creates it in the Cloudflare dashboard) at the paths below.
# Real client IPs: /etc/nginx/conf.d/cloudflare.inc (set_real_ip_from) is already included by nginx.conf.
server {
    listen 80;
    server_name labourmarket.ai www.labourmarket.ai;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://labourmarket.ai$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.labourmarket.ai;
    ssl_certificate     /etc/ssl/labourmarket/origin.pem;
    ssl_certificate_key /etc/ssl/labourmarket/origin.key;
    return 301 https://labourmarket.ai$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name labourmarket.ai;
    ssl_certificate     /etc/ssl/labourmarket/origin.pem;
    ssl_certificate_key /etc/ssl/labourmarket/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;          # journal photo/voice uploads; Cloudflare Free caps at 100 MB
    proxy_read_timeout 120s;           # MCP / AI routes; below Cloudflare's 100 s edge timeout is the real cap
    proxy_send_timeout 120s;

    # Cron routes are called from the VPS itself (127.0.0.1:<active port>), never from the internet.
    location ^~ /api/cron/ { return 404; }

    location / {
        # one line, rewritten by lm-prod-run.sh on every zero-downtime swap (3200 <-> 3201)
        include /etc/nginx/conf.d/domains/labourmarket-upstream.inc;
        proxy_http_version 1.1;
        proxy_set_header Host labourmarket.ai;
        proxy_set_header X-Forwarded-Host labourmarket.ai;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;           # MCP streamable HTTP / SSE
    }
}
