<!doctype html><html><head><meta charset="utf-8"><title>C — Infinite Work World</title>
<style>
:root{--void:#06070d;--steel:#8b97ad;--machine:#c2884a;--timber:#8a6a42;--warm:#ffb066;--ember:#ff7a2f;
--glass:#7fb2d8;--linen:#cfd8e2;--sap:#5f9a63;--skin:#ffcf9e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
.stage{position:relative;width:100%;height:100vh;overflow:hidden;background:#05070e}
svg{position:absolute;inset:0;width:100%;height:100%}
.ui{position:absolute;left:5vw;top:14vh;z-index:9;max-width:32ch}
.eyebrow{font:600 11px/1 ui-monospace,monospace;letter-spacing:.22em;color:#a8b8d0;text-transform:uppercase;
 border:1px solid #33405c;border-radius:3px;padding:7px 11px;display:inline-block;background:rgba(6,7,13,.5)}
h1{font:800 clamp(38px,4.6vw,68px)/1.0 Inter,sans-serif;color:#fff;letter-spacing:-.03em;margin:20px 0 0;
 text-shadow:0 4px 40px rgba(0,0,0,.8)}
h1 em{font-style:normal;color:#7fb2ff}
p{color:#b6c2d6;font-size:16px;line-height:1.6;margin-top:14px;text-shadow:0 2px 20px rgba(0,0,0,.9)}
.cta{margin-top:24px;display:inline-block;background:#2f6df0;color:#fff;font-weight:600;font-size:15px;
 padding:13px 22px;border-radius:9px;box-shadow:0 0 40px rgba(47,109,240,.55)}
</style></head><body>
<div class="stage"><svg id="s" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"></svg>
<div class="ui"><span class="eyebrow">Living labour market</span>
<h1>The work<br><em>ahead of you.</em></h1>
<p>Every trade on one road — and the opportunities travelling back down it.</p>
<span class="cta">Start now →</span></div></div>
<script src="world-kit.js"></script><script>
const P=[],HZ=430,CX=980; /* horizon line + vanishing point */

/* SKY + the light at the end — the emotional core: an open work economy */
P.push(`<rect x="0" y="0" width="1600" height="${HZ}" fill="url(#sky)"/>`);
P.push(`<ellipse cx="${CX}" cy="${HZ}" rx="430" ry="150" fill="url(#glowh)"/>`);

/* GROUND wedge receding to the vanishing point */
P.push(`<path d="M0 1000 L${CX-70} ${HZ} L${CX+70} ${HZ} L1600 1000 Z" fill="#0a1020"/>`);
/* road markings converging = instant perspective */
for(let i=1;i<14;i++){const t=i/14,y=HZ+(1000-HZ)*Math.pow(t,1.9);
 const w=(1600-((CX-70)*2))*0;const lx=CX-70-(CX-70)*Math.pow(t,1.9)*1.0;
 const halfNear=210,half=halfNear*Math.pow(t,1.9)+8;
 P.push(`<rect x="${CX-half*0.12}" y="${y}" width="${Math.max(2,half*0.24)}" height="${Math.max(2,half*0.13)}" fill="#2b3category"/>`.replace('#2b3category','#2c3a5a'));}
/* rails / edges of the corridor */
P.push(`<path d="M0 1000 L${CX-70} ${HZ}" stroke="#33456a" stroke-width="2.5" fill="none"/>`);
P.push(`<path d="M1600 1000 L${CX+70} ${HZ}" stroke="#33456a" stroke-width="2.5" fill="none"/>`);

/* ── DEPTH STATIONS: each step back is a different industry, and they
      physically abut so one trade becomes the next rather than sitting in
      its own card. z = 0 (near) .. 1 (far) ─────────────────────────────── */
function px(z,side){/* x at depth z on given side (-1 left, 1 right) */
 const nearHalf=760,farHalf=70; const half=farHalf+(nearHalf-farHalf)*Math.pow(1-z,1.9);
 return CX+side*half;}
function py(z){return HZ+(1000-HZ)*Math.pow(1-z,1.9);}
function sc(z){return 1.25*Math.pow(1-z,1.35)+0.1;}

/* FAR: office towers + city, both sides */
[[-1,.86],[1,.84],[-1,.78],[1,.76]].forEach(([sd,z],i)=>{
 const x=px(z,sd),y=py(z),s=sc(z),h=150*s;
 P.push(`<g opacity=".72"><rect x="${x-(sd>0?0:46*s)}" y="${y-h}" width="${46*s}" height="${h}" fill="#16213a"/>`);
 for(let r=0;r<6;r++)for(let c=0;c<3;c++) if((i*3+r+c)%3!==0)
  P.push(`<rect x="${x-(sd>0?-6*s:40*s)+c*13*s}" y="${y-h+9*s+r*22*s}" width="7*s" height="${8*s}" width="${7*s}" fill="var(--glass)" opacity=".5"/>`);
 P.push(`</g>`);});

/* MID-FAR: manufacturing sawtooth, right */
(()=>{const z=.62,x=px(z,1),y=py(z),s=sc(z);let d="";
 for(let i=0;i<5;i++){const bx=x+i*52*s;d+=`M${bx} ${y-40*s} L${bx+26*s} ${y-74*s} L${bx+26*s} ${y-40*s} `;}
 P.push(`<g opacity=".8"><path d="${d}" fill="#15203a" stroke="#2b3b5e" stroke-width="1.4"/>
  <rect x="${x}" y="${y-40*s}" width="${260*s}" height="${40*s}" fill="#101a30" stroke="#2b3b5e"/>`);
 for(let m=0;m<3;m++)P.push(`<rect x="${x+18*s+m*80*s}" y="${y-26*s}" width="${44*s}" height="${20*s}" rx="3" fill="#33415e"/>
  <circle cx="${x+52*s+m*80*s}" cy="${y-16*s}" r="${4*s}" fill="var(--ember)" opacity=".7"/>`);
 P.push(figure(x+40*s,y,s*.9,0),figure(x+140*s,y,s*.9,2),`</g>`);})();

/* MID-FAR: greenhouse belt, left */
(()=>{const z=.6,x=px(z,-1),y=py(z),s=sc(z);
 P.push(`<g opacity=".78">`,greenhouse(x,y,250*s,70*s,s*.9),`</g>`);})();

/* MID: care + hospitality block, left */
(()=>{const z=.4,x=px(z,-1),y=py(z),s=sc(z);
 P.push(`<g opacity=".9"><rect x="${x}" y="${y-105*s}" width="${300*s}" height="${105*s}" fill="#121c33" stroke="#2a3a5c"/>`);
 P.push(kitchen(x+18*s,y-58*s,150*s,s*.85));
 P.push(beds(x+180*s,y-8*s,2,s*.8));
 P.push(`</g>`);})();

/* MID: office floor cutaway, right */
(()=>{const z=.38,x=px(z,1),y=py(z),s=sc(z);
 P.push(`<g opacity=".9"><rect x="${x-300*s}" y="${y-108*s}" width="${300*s}" height="${108*s}" fill="#101a30" stroke="#2a3a5c"/>`);
 P.push(desks(x-278*s,y-16*s,4,s*.85),`</g>`);})();

/* NEAR-MID: logistics depot, right */
(()=>{const z=.2,x=px(z,1),y=py(z),s=sc(z);
 P.push(`<g>`,racking(x-460*s,y-18*s,4,3,54*s,30*s));
 P.push(truck(x-200*s,y,s*.95),forklift(x-300*s,y,s*.9));
 P.push(figure(x-120*s,y,s,1),`</g>`);})();

/* NEAR: construction, left — biggest, warmest, most detailed */
(()=>{const z=.08,x=px(z,-1),y=py(z),s=sc(z);
 for(let l=0;l<3;l++){const yy=y-l*58*s;
  P.push(`<rect x="${x+40*s}" y="${yy-58*s}" width="${420*s}" height="${7*s}" fill="#33405f"/>`);
  for(let c=0;c<7;c++)P.push(`<rect x="${x+55*s+c*60*s}" y="${yy-58*s}" width="${7*s}" height="${58*s}" fill="#2c3a58"/>`);}
 P.push(towerCrane(x+70*s,y,330*s,290*s,'#74839f'));
 P.push(excavator(x+330*s,y,s*1.0));
 P.push(figure(x+180*s,y,s*1.05,0),figure(x+220*s,y,s*1.05,2),figure(x+300*s,y-58*s,s*.95,1));})();

/* SIGNALS travelling UP the road from the near work to the far horizon —
   the product story: work done here becomes the opportunity ahead. */
[[.06,-1,.8,1],[.15,1,.72,-1],[.3,-1,.9,1]].forEach(([z0,s0,z1,s1],i)=>{
 const d=`M${px(z0,s0)} ${py(z0)} Q ${CX} ${(py(z0)+py(z1))/2-60} ${px(z1,s1)} ${py(z1)}`;
 P.push(`<path d="${d}" fill="none" stroke="#39d98a" stroke-width="1.4" opacity=".38" stroke-dasharray="5 14">
  <animate attributeName="stroke-dashoffset" from="0" to="-190" dur="${7+i*1.5}s" repeatCount="indefinite"/></path>
  <circle r="3.4" fill="#8affd0"><animateMotion dur="${7+i*1.5}s" repeatCount="indefinite" path="${d}"/></circle>`)});

document.getElementById('s').innerHTML=`<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#070b16"/><stop offset=".62" stop-color="#0e1830"/><stop offset="1" stop-color="#1d2c4c"/></linearGradient>
 <radialGradient id="glowh"><stop offset="0" stop-color="#8fb4ff" stop-opacity=".45"/>
  <stop offset=".5" stop-color="#4a6db0" stop-opacity=".16"/><stop offset="1" stop-color="#4a6db0" stop-opacity="0"/></radialGradient>
</defs>`+P.join("");
</script></body></html>
