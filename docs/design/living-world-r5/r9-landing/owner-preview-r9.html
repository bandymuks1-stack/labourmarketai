<style>
/* R9 — LabourMarket.ai landing. One living world, one question.
   Procedural only: the heaviest asset is 24KB of real coastline. */

:root {
  --ink: #10151f;
  --soft: #45506488;
  --soft2: #455064;
  --amber: #d97a2e;
  --amber-soft: rgba(217, 122, 46, 0.14);
  --green: #4d9d64;
  --rose: #cf5468;
  --paper: rgba(252, 252, 250, 0.86);
  --sans: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font: 16px/1.5 var(--sans); color: var(--ink);
  background: linear-gradient(180deg, #6f92b4 0%, #a9bccb 46%, #dadfdc 100%);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 8px; }

#land { position: fixed; inset: 0; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#skyfall {
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 90% at 50% 108%, #cdd6c8 0%, transparent 55%),
    linear-gradient(180deg, #6f92b4 0%, #a9bccb 52%, #d3dad2 100%);
}

/* projected layers */
#paths { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#markers { position: absolute; inset: 0; pointer-events: none; }

.mk { position: absolute; left: 0; top: 0; will-change: transform; }

/* city glints — discoverable, real counts */
.mk-city { pointer-events: auto; cursor: pointer; padding: 5px; }
.mk-city .dot {
  display: block; width: 9px; height: 9px; border-radius: 50%;
  background: #fff7ea;
  box-shadow: 0 0 0 2px rgba(217, 122, 46, 0.5), 0 0 14px 3px rgba(217, 122, 46, 0.55);
  transition: box-shadow 0.25s;
  animation: glint 3.4s ease-in-out infinite;
}
.mk-city:hover .dot { box-shadow: 0 0 0 3px rgba(217, 122, 46, 0.8), 0 0 22px 6px rgba(217, 122, 46, 0.7); }
@keyframes glint { 50% { opacity: 0.72; } }
.mk-city .tip {
  position: absolute; left: 14px; top: -6px; white-space: nowrap;
  font-size: 12.5px; padding: 5px 10px; border-radius: 9px;
  background: var(--paper); color: var(--ink);
  border: 1px solid rgba(16, 21, 31, 0.08);
  box-shadow: 0 6px 18px rgba(16, 21, 31, 0.14);
  opacity: 0; transform: translateY(3px); transition: 0.2s; pointer-events: none;
}
.mk-city .tip b { font-variant-numeric: tabular-nums; color: var(--amber); }
.mk-city:hover .tip, .mk-city.is-tip .tip { opacity: 1; transform: none; }

/* intent reactions */
.mk-bloom { width: 0; height: 0; }
.mk-bloom .ring {
  position: absolute; left: 0; top: 0; width: 12px; height: 12px;
  margin: -6px 0 0 -6px; border-radius: 50%;
  border: 2px solid rgba(217, 122, 46, 0.75);
  animation: bloom 2.6s ease-out infinite;
}
.mk-bloom .ring:nth-child(2) { animation-delay: 0.85s; }
.mk-bloom .ring:nth-child(3) { animation-delay: 1.7s; }
@keyframes bloom {
  from { transform: scale(0.4); opacity: 0.9; }
  to { transform: scale(7); opacity: 0; }
}
.mk-bloom .core {
  position: absolute; left: 0; top: 0; width: 13px; height: 13px;
  margin: -6.5px 0 0 -6.5px; border-radius: 50%;
  background: #ffb066; box-shadow: 0 0 18px 6px rgba(217, 122, 46, 0.65);
}
.mk-bloom.is-rose .ring { border-color: rgba(207, 84, 104, 0.75); }
.mk-bloom.is-rose .core { background: #ff8ba0; box-shadow: 0 0 18px 6px rgba(207, 84, 104, 0.6); }
.mk-bloom.is-green .ring { border-color: rgba(77, 157, 100, 0.75); }
.mk-bloom.is-green .core { background: #8fd6a4; box-shadow: 0 0 18px 6px rgba(77, 157, 100, 0.6); }

.mk-label {
  white-space: nowrap;
  font-size: 13px; padding: 7px 13px; border-radius: 11px;
  background: var(--paper); border: 1px solid rgba(16, 21, 31, 0.08);
  box-shadow: 0 10px 26px rgba(16, 21, 31, 0.16);
  animation: rise 0.5s ease both;
}
.mk-label b { font-variant-numeric: tabular-nums; }
.mk-label .a { color: var(--amber); }
.mk-label .g { color: var(--green); }
.mk-label .r { color: var(--rose); }
.mk-label i { font-style: normal; color: var(--soft2); }
@keyframes rise { from { opacity: 0; } }

.mk-mote {
  width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 10px 2px rgba(207, 84, 104, 0.7);
}
.mk-mote.is-green { box-shadow: 0 0 10px 2px rgba(77, 157, 100, 0.7); }

#paths path {
  fill: none; stroke-width: 2.4px; stroke-linecap: round;
  stroke-dasharray: 6 7; animation: flow 1.1s linear infinite;
}
@keyframes flow { to { stroke-dashoffset: -13; } }

/* ── chrome ── */
#top {
  position: absolute; z-index: 5; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 26px;
}
.wordmark { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; color: var(--ink); }
.wordmark i, #intro i { font-style: normal; color: var(--amber); }
.enter {
  font-size: 14px; font-weight: 600; text-decoration: none; color: var(--ink);
  padding: 8px 16px; border-radius: 999px; background: rgba(252, 252, 250, 0.7);
  border: 1px solid rgba(16, 21, 31, 0.1); transition: 0.2s;
}
.enter:hover { background: #fff; transform: translateY(-1px); }

/* intro moment */
#intro {
  position: absolute; z-index: 4; inset: 0; display: grid; place-content: center;
  text-align: center; pointer-events: none;
  transition: opacity 0.9s ease, transform 0.9s ease;
}
#intro h1 {
  font-size: clamp(34px, 6vw, 62px); font-weight: 300; letter-spacing: -0.02em;
  text-shadow: 0 2px 26px rgba(252, 252, 250, 0.95), 0 0 60px rgba(252, 252, 250, 0.7);
}
#intro p {
  font-size: clamp(15px, 2vw, 19px); color: var(--soft2); margin-top: 6px;
  text-shadow: 0 1px 14px rgba(252, 252, 250, 0.95);
}
#intro.is-away { opacity: 0; transform: translateY(-26px) scale(0.98); }

/* scale readout */
#scale {
  position: absolute; z-index: 5; left: 26px; bottom: 24px;
  display: flex; flex-direction: column; gap: 1px;
}
#scale b { font-size: 15px; font-weight: 650; }
#scale span { font-size: 12.5px; color: var(--soft2); }
.num { font-style: normal; font-variant-numeric: tabular-nums; font-weight: 650; color: var(--amber); }
#scale i { font-style: normal; }

/* the one interaction */
#ask {
  position: absolute; z-index: 5; left: 50%; bottom: 40px;
  transform: translateX(-50%);
  width: min(600px, calc(100% - 40px));
  display: flex; flex-direction: column; gap: 11px; align-items: center;
}
#say {
  min-height: 22px; font-size: 15.5px; text-align: center; color: var(--ink);
  text-shadow: 0 1px 8px rgba(252, 252, 250, 0.8);
}
#say b { color: var(--amber); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; transition: opacity 0.4s; }
.chips button {
  font-size: 12.5px; padding: 7px 13px; border-radius: 999px;
  background: rgba(252, 252, 250, 0.62); border: 1px solid rgba(16, 21, 31, 0.1);
  color: var(--soft2); transition: 0.18s; backdrop-filter: blur(6px);
}
.chips button:hover { background: #fff; color: var(--ink); transform: translateY(-1px); }
.chips.is-small { opacity: 0.75; }
#askForm {
  display: flex; align-items: center; width: 100%; gap: 8px;
  background: rgba(252, 252, 250, 0.92); border: 1px solid rgba(217, 122, 46, 0.4);
  border-radius: 999px; padding: 6px 6px 6px 22px;
  box-shadow: 0 18px 50px rgba(16, 21, 31, 0.22), 0 0 0 6px rgba(217, 122, 46, 0.06);
  backdrop-filter: blur(8px); transition: border-color 0.2s;
}
#askForm:focus-within { border-color: rgba(217, 122, 46, 0.8); }
#askInput {
  flex: 1; min-width: 0; border: 0; background: none; color: var(--ink);
  font: 16.5px var(--sans); padding: 10px 0;
}
#askInput::placeholder { color: #8a93a5; }
#askForm button {
  flex: none; width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, #f0a355, #d97a2e); color: #fff;
  font-size: 18px; transition: 0.18s; box-shadow: 0 6px 16px rgba(217, 122, 46, 0.4);
}
#askForm button:hover { filter: brightness(1.08); transform: translateY(-1px); }
#hint { font-size: 11.5px; color: var(--soft2); opacity: 0.75; }

#src {
  position: absolute; z-index: 5; right: 26px; bottom: 24px;
  font-size: 11px; color: var(--soft2); opacity: 0.8;
}

/* ── mobile ── */
@media (max-width: 700px) {
  #top { padding: 16px 18px; }
  #scale { left: 18px; bottom: max(18px, env(safe-area-inset-bottom)); }
  #ask { bottom: max(74px, calc(64px + env(safe-area-inset-bottom))); width: calc(100% - 28px); }
  #hint { display: none; }
  #src { display: none; }
  #scale { bottom: 18px; }
  .chips button { font-size: 12px; padding: 6px 11px; }
  #say { font-size: 14.5px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
  .mk-bloom .ring { animation: none; opacity: 0.5; transform: scale(2.4); }
  #paths path { animation: none; }
}

    for (var j = 0; j < livePaths.length; j++) {
      var L = livePaths[j];
      var a = world.project(L.a[0], L.a[1], 0.02), b = world.project(L.b[0], L.b[1], 0.02);
      if (!a || !b) { L.el.setAttribute("d", ""); continue; }
      var mx = (a.x + b.x) / 2, my = Math.min(a.y, b.y) - 34;
      L.el.setAttribute("d", "M" + a.x + " " + a.y + " Q" + mx + " " + my + " " + b.x + " " + b.y);
    }
  }

  /* city glints (real counts, discoverable) */
  window.R5_GEO && window.R5_GEO.cities.forEach(function (c) {
    if (!CITY_N[c.name]) return;
    var el = document.createElement("div");
    el.className = "mk mk-city";
    el.innerHTML = '<span class="dot"></span><span class="tip">' + c.name +
      " · <b>" + fmt(CITY_N[c.name]) + "</b> aktyvios</span>";
    el.addEventListener("click", function () { el.classList.toggle("is-tip"); });
    addMarker(c.lng, c.lat, el, 0.015, 0, " translate(-50%,-50%)").depthScale = true;
  });

  /* ── intent layer ── */
  var livePaths = [];
  function bloom(lng, lat, tone) {
    var el = document.createElement("div");
    el.className = "mk mk-bloom" + (tone ? " is-" + tone : "");
    el.innerHTML = '<span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="core"></span>';
    var m = addMarker(lng, lat, el, 0.02, 0);
    m.intent = true;
    return m;
  }
  function label(lng, lat, html) {
    var el = document.createElement("div");
    el.className = "mk mk-label";
    el.innerHTML = html;
    var m = addMarker(lng, lat, el, 0.12, 0, " translate(-50%,-135%)");
    m.intent = true;
    return m;
  }
  function path(a, b, color) {
    var NS = "http://www.w3.org/2000/svg";
    var p = document.createElementNS(NS, "path");
    p.setAttribute("stroke", color);
    pathsSvg.appendChild(p);
    livePaths.push({ a: a, b: b, el: p });
  }
  function mote(from, to, tone, dur) {
    var el = document.createElement("div");
    el.className = "mk mk-mote" + (tone ? " is-" + tone : "");
    var m = addMarker(from[0], from[1], el, 0.03, 0);
    m.intent = true;
    var t0 = performance.now();
    (function step(now) {
      if (!el.isConnected) return;
      var k = Math.min(1, (now - t0) / dur);
      var e = k * k * (3 - 2 * k);
      m.lng = from[0] + (to[0] - from[0]) * e;
      m.lat = from[1] + (to[1] - from[1]) * e;
      if (k < 1) requestAnimationFrame(step);
      else { m.lng = from[0]; m.lat = from[1]; t0 = performance.now(); requestAnimationFrame(step); }
    })(t0);
  }

  /* typewriter */
  var sayTimer = null;
  function say(html) {
    var el = $("#say");
    clearTimeout(sayTimer);
    if (reduced) { el.innerHTML = html; return; }
    el.innerHTML = "";
    var tmp = document.createElement("div");
    tmp.innerHTML = html;
    var full = tmp.textContent, i = 0;
    (function tick() {
      i += 2;
      el.textContent = full.slice(0, i);
      if (i < full.length) sayTimer = setTimeout(tick, 14);
      else el.innerHTML = html;
    })();
  }

  var GBG = [11.9746, 57.7089];
  var INTENTS = [
    {
      test: /(darb|sand[eė]l|iešk)/i,
      go: 0.955,
      line: "Suprantu — <b>sandėlio darbas Göteborge</b>. Kryptis gyva: 98 aktyvios vietos, 40 darbdavių.",
      act: function () {
        bloom(GBG[0], GBG[1]);
        label(GBG[0], GBG[1], 'Sandėlio kryptis · <b class="a">98</b> aktyvios · <i>40 darbdavių</i>');
        label(15.5, 59.9, '<i>visoje Švedijoje</i> · <b class="a">923</b> šios krypties vietos').lift = 0.16;
      },
    },
    {
      test: /(tr[uū]kst|reiki|elektrik|darbuotoj[uų]? reikia)/i,
      go: 0.9,
      line: "Paklausa pažymėta: <b>4 elektrikai kitai savaitei</b>. Aplink Göteborgą ši kryptis gyva — 71 aktyvi vieta.",
      act: function () {
        bloom(GBG[0], GBG[1], "rose");
        label(GBG[0], GBG[1], 'Užklausa · 4 elektrikai · <b class="r">71</b> aktyvi kryptis · <i>47 darbdaviai</i>');
        [[12.9401, 57.721], [12.2858, 58.2837], [12.5331, 57.93], [11.9746, 57.8706]].forEach(function (c) {
          path(c, GBG, "rgba(207,84,104,0.75)");
          mote(c, GBG, null, 2400 + Math.random() * 1400);
        });
      },
    },
    {
      test: /(agurk|parduo|turiu \d|kg|u[žz]augin)/i,
      go: 0.8,
      line: "Tai — <b>vertės pasiūla</b>, ne darbo skelbimas. Tas pats pasaulis rodo, kur ji gali būti realizuota.",
      act: function () {
        var farm = [13.15, 58.32];
        bloom(farm[0], farm[1], "green");
        label(farm[0], farm[1], '30 kg agurkų · <b class="g">pasiūla suprasta</b>').lift = 0.17;
        path(farm, GBG, "rgba(77,157,100,0.75)");
        path(farm, [12.9401, 57.721], "rgba(77,157,100,0.6)");
        mote(farm, GBG, "green", 2600);
        label(GBG[0], GBG[1], 'Göteborg · <i>realizacijos kryptys</i> · <b class="g">demo</b>').lift = 0.05;
      },
    },
  ];
  function handle(text) {
    introAway();
    clearIntent();
    var it = null;
    for (var i = 0; i < INTENTS.length; i++) if (INTENTS[i].test.test(text)) { it = INTENTS[i]; break; }
    $("#chips").classList.add("is-small");
    if (!it) {
      say("Suprantu. Pasakyk, ko <b>ieškai</b>, ko <b>reikia</b> ar ką <b>turi</b> — pasaulis reaguos.");
      tTarget = Math.max(0.3, tTarget);
      return;
    }
    say(it.line);
    tTarget = it.go;
    it.act();
  }
  $("#askForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("#askInput").value.trim();
    if (v) handle(v);
  });
  document.querySelectorAll("#chips button").forEach(function (b) {
    b.addEventListener("click", function () {
      $("#askInput").value = b.dataset.say;
      handle(b.dataset.say);
    });
  });

  /* ── frame loop ── */
  function frame(now) {
    drift += 0.0014;
    var wob = reduced ? 0 : Math.sin(drift) * 0.0035;
    t += (tTarget - t) * (reduced ? 1 : 0.045);
    parX += (parTX - parX) * 0.06;
    parY += (parTY - parY) * 0.06;
    if (world) world.render(Math.max(0, Math.min(0.9999, t + wob)),
      reduced ? null : { dx: parX, dy: parY });
    place();
    updateScale();
    requestAnimationFrame(frame);
  }
  if (world) requestAnimationFrame(frame);
  else { updateScale(); }
})();

</script>
