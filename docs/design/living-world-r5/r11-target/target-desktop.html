<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LM living world — target 1440</title>
<style>
  * { margin: 0; } html, body { height: 100%; background: #1d2f38; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
  .wm { position: fixed; top: 20px; left: 26px; font: 650 16px "Segoe UI", system-ui, sans-serif; color: #3a5462; letter-spacing: -0.01em; }
  .wm i { font-style: normal; color: #d9782e; }
</style>
</head>
<body>
<div class="wm">LabourMarket<i>.ai</i></div>
<svg id="s" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice"></svg>
<script src="lmworld.js"></script>
<script>
(function () {
  var L = window.LM, g = L.g, P = L.P;
  var W = 1440, o = [];

  function edgePath(pts) {
    var d = "M" + pts[0][0] + " " + pts[0][1];
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i], mx = (a[0] + b[0]) / 2;
      d += " Q" + mx + " " + a[1] + " " + ((mx + b[0]) / 2) + " " + ((a[1] + b[1]) / 2) +
           " T" + b[0] + " " + b[1];
    }
    return d;
  }
  function terrace(pts, col, rim) {
    var e = edgePath(pts);
    return '<path d="' + e + ' L' + W + ' 900 L0 900 Z" transform="translate(0 -8)" fill="#263d49" opacity="0.24" filter="url(#soft2)"/>' +
      '<path d="' + e + ' L' + W + ' 900 L0 900 Z" fill="' + col + '"/>' +
      '<path d="' + e + '" stroke="' + (rim || L.lighten(col, 0.3)) + '" stroke-width="2.6" fill="none" opacity="0.85"/>';
  }

  /* ═ SKY + FAR EUROPE (0–125) ═ */
  o.push('<rect width="1440" height="260" fill="url(#sky)"/>');
  o.push('<circle cx="235" cy="105" r="300" fill="url(#sunGlow)"/>');
  o.push(g(0, -34, 0.92, L.farEurope(W / 0.92)));

  /* ═ SEA — a living strait (125–240) ═ */
  o.push('<path d="M0 125 L1440 120 L1440 300 L0 300 Z" fill="url(#sea)"/>');
  o.push('<path d="M95 168 Q265 152 425 174 Q300 190 150 186 Z" fill="' + P.glint + '" opacity="0.34" filter="url(#soft2)"/>');
  for (var i = 0; i < 7; i++)
    o.push('<path d="M' + (130 + i * 180) + ' ' + (156 + (i % 3) * 26) + ' q 18 -4 36 0" stroke="#ffffff32" stroke-width="2" fill="none"/>');
  o.push(g(560, 196, 0.72, L.ship()));
  o.push(g(1205, 160, 0.45, L.ship()));

  /* ═ T1 · PORT — cranes rise into the sea (top ~232) ═ */
  o.push(terrace([[0, 236], [340, 224], [720, 238], [1060, 226], [1440, 236]], P.quay2));
  /* docked ship right at the quay edge */
  o.push(g(505, 232, 0.85, L.ship()));
  o.push(g(30, 306, 1.05, L.shadowBlob(46, 6, 44) + L.box(70, 30, 14, P.brick) + L.windows(70, 30, 5, 2, 0.8, 2.6, true)));
  o.push(g(146, 296, 1.05, L.shadowBlob(38, 5, 34) + L.box(58, 36, 14, P.cream) + L.windows(58, 36, 4, 2, 0.7, 2.6, true)));
  o.push(g(56, 258, 1.0, L.containerRow(6)));
  o.push(g(232, 252, 0.9, L.containerRow(4)));
  o.push(g(300, 302, 1.45, L.portCrane()));
  o.push(g(392, 294, 1.25, L.portCrane()));
  o.push(g(560, 288, 0.9, L.containerRow(4)));
  o.push(g(650, 300, 0.95, L.containerRow(3)));
  o.push(g(700, 322, 0.8, L.truck(P.box1)));
  o.push(g(258, 322, 0.8, L.truck(P.box2)));
  o.push(g(452, 326, 0.75, L.truck(P.box4)));
  o.push(g(510, 286, 0.85, L.containerRow(3)));
  o.push(g(586, 318, 0.95, L.workerVest("point", 2)));
  o.push(g(612, 322, 0.95, L.workerVest("carry", 0)));
  /* green wind hill on the same terrace, right */
  o.push('<path d="M880 238 Q1060 196 1250 230 Q1360 246 1440 240 L1440 310 Q1140 300 880 306 Z" fill="#79a273"/>');
  o.push('<path d="M880 238 Q1060 196 1250 230 Q1360 246 1440 240" stroke="#8fb989" stroke-width="2.4" fill="none" opacity="0.85"/>');
  o.push(g(1010, 246, 0.9, L.turbine(18)));
  o.push(g(1108, 236, 1.05, L.turbine(64)));
  o.push(g(1206, 246, 0.82, L.turbine(-28)));
  o.push(g(1315, 280, 0.8, L.tree("#6d9a68")));
  o.push(g(1360, 292, 0.7, L.tree("#87b573")));

  /* ═ T2 · TOWN (top ~360) ═ */
  o.push(terrace([[0, 366], [380, 352], [780, 368], [1130, 354], [1440, 364]], P.grass));
  var hcols = [P.terra, P.cream, P.brick, P.cream, P.rust, P.cream];
  var row1 = [];
  for (var h = 0; h < 9; h++)
    row1.push(g(h * 36, (h % 2) * 4, 1, L.gable(31, 25 + (h % 3) * 6, 13, hcols[h % 6], P.slate) + L.windows(31, 23, 2, 2, 0.75, 2.6, true)));
  o.push(g(392, 428, 1.1, L.shadowBlob(170, 7, 175) + row1.join("")));
  o.push(g(742, 420, 1.1, '<rect x="0" y="-40" width="13" height="40" fill="' + P.cream + '"/>' +
    '<path d="M-1 -40 L6.5 -60 L14 -40 Z" fill="' + P.slate2 + '"/>' +
    '<rect x="4.6" y="-33" width="4.4" height="7" fill="' + P.win + '"/>'));
  var row2 = [];
  for (var h2 = 0; h2 < 7; h2++)
    row2.push(g(h2 * 40, 0, 1, L.gable(33, 27 + (h2 % 2) * 8, 14, hcols[(h2 + 3) % 6], P.slate2) + L.windows(33, 25, 3, 2, 0.8, 2.8, true)));
  o.push(g(412, 470, 1.18, L.shadowBlob(150, 7, 155) + row2.join("")));
  for (var t = 0; t < 7; t++) o.push(g(380 + t * 58, 482 + (t % 2) * 6, 1.05, L.tree(t % 2 ? P.grass2 : "#7fae6d")));
  /* square life */
  o.push(g(628, 480, 1.0, L.person("walk", 0, 1)));
  o.push(g(652, 483, 1.0, L.person("walk", 2, 0)));
  o.push(g(685, 478, 1.0, L.person("stand", 4, 2)));
  o.push(g(700, 481, 1.0, L.person("point", 1, 3)));
  /* office / tech cluster right */
  o.push(g(920, 462, 1.15, L.shadowBlob(38, 6, 34) + L.box(44, 38, 11, P.slate) + L.windows(44, 38, 3, 3, 0.9, 2.8)));
  o.push(g(982, 470, 1.15, L.shadowBlob(28, 5, 24) + L.box(32, 28, 10, P.cream) + L.windows(32, 28, 2, 2, 0.85, 2.8)));
  o.push(g(1042, 482, 1.0, L.person("stand", 1, 1) + g(15, 0, 1, L.person("point", 5, 0))));
  o.push(g(1090, 466, 1.05, L.tree("#7fae6d")));
  /* hotel strip far right */
  o.push(g(1150, 462, 1.1, L.shadowBlob(40, 6, 36) + L.box(52, 34, 12, P.terra) + L.windows(52, 34, 4, 2, 0.85, 2.8)));
  o.push(g(1235, 478, 1.0, L.person("walk", 3, 2) + g(16, 2, 1, L.person("carry", 2, 1))));

  /* ═ T3 · FIELDS + FARM + ROAD (top ~500) ═ */
  o.push(terrace([[0, 508], [430, 496], [890, 510], [1260, 496], [1440, 506]], "#8fb87b"));
  o.push(g(70, 540, 1.15, L.fieldRows(170, 38, P.field)));
  o.push(g(268, 556, 1.15, L.fieldRows(135, 33, P.field2)));
  o.push(g(1046, 540, 1.2, L.fieldRows(150, 38, "#b9cf8e")));
  o.push(g(1250, 556, 1.15, L.fieldRows(120, 33, P.field)));
  o.push(g(480, 572, 1.3, L.shadowBlob(30, 5, 28) + L.greenhouse()));
  o.push(g(610, 562, 1.15, L.gable(30, 23, 13, P.brick, P.slate2) + L.windows(30, 21, 2, 1, 0.85, 2.8)));
  o.push(g(578, 590, 1.1, L.person("carry", 3, 2)));
  o.push(g(668, 588, 1.05, L.truck(P.box3)));
  (function(){for(var r=0;r<2;r++)for(var c=0;c<6;c++)o.push(g(760+c*38+r*14,560+r*22,0.85,L.tree(r%2?"#6d9a68":"#87b573")));})();
  o.push(g(60,596,1,'<rect x="0" y="-5" width="330" height="6" rx="3" fill="#6d9a68" opacity="0.85"/>'));
  o.push(g(1040,600,1,'<rect x="0" y="-5" width="300" height="6" rx="3" fill="#6d9a68" opacity="0.85"/>'));
  o.push(g(948, 570, 1.05, L.tree(P.grass2)));
  o.push(g(986, 590, 1.1, L.person("walk", 2, 3)));
  /* road along the lower part of this terrace */
  o.push('<path d="M0 640 Q720 616 1440 640" stroke="' + P.road + '" stroke-width="26" fill="none"/>');
  o.push('<path d="M0 640 Q720 616 1440 640" stroke="' + P.roadLine + '" stroke-width="2" stroke-dasharray="11 13" fill="none" opacity="0.9"/>');
  o.push(g(230, 650, 1.2, L.truck(P.box1)));
  o.push(g(695, 642, 1.15, L.truck(P.box2)));
  o.push(g(1105, 648, 1.2, L.truck("#8a9aa5")));
  o.push(g(940, 645, 1.15,
    '<rect x="-14" y="-11" width="28" height="9" rx="4" fill="#d9a441"/>' +
    '<rect x="-11" y="-9" width="22" height="4" rx="1.6" fill="' + P.win + '"/>' +
    '<circle cx="-8" cy="-1" r="3" fill="' + P.slate2 + '"/><circle cx="8" cy="-1" r="3" fill="' + P.slate2 + '"/>'));

  /* ═ T4 · THE HUMAN QUAY (top ~690) ═ */
  o.push(terrace([[0, 694], [430, 682], [880, 696], [1230, 684], [1440, 694]], P.quay, L.lighten(P.quay, 0.26)));
  o.push('<path d="M0 694 L560 680 L330 900 L0 900 Z" fill="' + P.glint + '" opacity="0.12"/>');

  /* LEFT — terminal at work */
  o.push(g(10, 888, 1.7, L.shadowBlob(95, 8, 100)));
  o.push(g(10, 758, 1.7, L.box(132, 76, 20, P.brick)));
  o.push(g(10, 758, 1.7, '<rect x="0" y="-6" width="132" height="8" fill="' + L.darken(P.brick, 0.18) + '"/>' +
    '<rect x="0" y="18" width="132" height="3" fill="' + L.darken(P.brick, 0.12) + '"/>'));
  o.push(g(10, 758, 1.7, L.windows(132, 30, 7, 1, 0.85, 4)));
  o.push(g(10 + 1.7 * 86, 758 + 1.7 * 76, 1.7,
    '<rect x="0" y="-44" width="34" height="44" rx="1.8" fill="' + L.darken(P.brick, 0.32) + '"/>' +
    '<rect x="2.6" y="-41.4" width="28.8" height="41.4" rx="1.2" fill="' + P.door + '"/>' +
    '<rect x="5.2" y="-38.6" width="23.6" height="38.6" rx="1" fill="' + L.lighten(P.door, 0.3) + '"/>' +
    L.spill(34, 40)));
  o.push(g(66, 886, 1.9, L.containerRow(3)));
  o.push(g(168, 882, 1.85, L.forklift()));
  o.push(g(250, 884, 1.95, L.workerVest("carry", 1)));
  o.push(g(304, 878, 1.85, L.workerVest("point", 2)));

  /* CENTRE — café + the meeting */
  o.push(g(418, 788, 1.6, L.shadowBlob(30, 5, 28) + L.box(40, 30, 10, P.rust) +
    '<rect x="-3" y="6" width="46" height="7" rx="3" fill="' + P.cream + '"/>' +
    L.windows(40, 22, 3, 1, 0.95, 3.4) +
    '<rect x="15" y="12" width="10" height="18" rx="1" fill="' + P.door + '"/>'));
  o.push(g(420, 872, 1.8, '<circle cx="0" cy="-6" r="7" fill="' + P.cream + '"/><rect x="-1" y="-6" width="2" height="10" fill="' + P.wood + '"/>' +
    g(-13, 4, 0.92, L.person("stand", 2, 0)) + g(13, 4, 0.92, '<g transform="scale(-1,1)">' + L.person("stand", 5, 1) + "</g>")));
  o.push(g(620, 802, 1.25, L.shadowBlob(46, 6, 44) + L.box(64, 38, 12, P.cream) +
    L.windows(64, 26, 4, 1, 0.9, 3.6) +
    '<rect x="26" y="15" width="13" height="23" rx="1.2" fill="' + P.door + '"/>'));
  o.push(g(676, 780, 1, L.spill(15, 24)));
  o.push(g(614, 862, 2.15, L.shadowBlob(15, 3, 12) + L.handshake(0, 4)));
  o.push(g(548, 856, 1.95, L.person("walk", 3, 2)));
  o.push(g(842, 856, 1.95, L.person("wave", 2, 1)));
  o.push(g(888, 862, 1.95, L.person("walk", 5, 3)));
  o.push(g(508, 826, 1.6, L.lamp()));
  o.push(g(930, 822, 1.6, L.lamp()));
  o.push(g(972, 864, 1.95, L.tree(P.grass2)));
  o.push(g(940, 876, 1.7, '<rect x="-11" y="-7" width="22" height="2.6" rx="1.3" fill="'+P.wood+'"/><rect x="-9" y="-5" width="2" height="5" fill="'+P.wood+'"/><rect x="7" y="-5" width="2" height="5" fill="'+P.wood+'"/>'));

  /* RIGHT — construction story */
  o.push(g(1030, 842, 1.5, L.shadowBlob(42, 6, 42) + L.siteFrame()));
  o.push(g(1124, 846, 1.5, L.craneTower(12)));
  var facade = L.box(50, 58, 13, P.terra) +
    (function () {
      var wsvg = "";
      for (var r = 0; r < 3; r++) for (var c = 0; c < 4; c++) {
        var lit = ((r * 7 + c * 13) % 10) < 8.6;
        wsvg += '<rect x="' + (7 + c * 11) + '" y="' + (7 + r * 14) + '" width="5" height="6.4" rx="0.8" fill="' +
          (lit ? P.win : "rgba(40,58,70,0.42)") + '"/>';
      }
      return wsvg;
    })() +
    '<rect x="19" y="45" width="12" height="13" rx="1.2" fill="' + P.door + '"/>';
  o.push(g(1214, 897, 1.5, L.shadowBlob(36, 6, 34)));
  o.push(g(1214, 810, 1.5, facade));
  o.push(g(1242, 897, 1, L.spill(15, 22)));
  o.push(g(1176, 866, 1.95, L.workerVest("point", 3)));
  o.push(g(1338, 868, 2.0,
    g(-15, 0, 1, L.person("wave", 4, 0)) + g(4, 1, 1, L.person("cheer", 1, 3)) + g(23, -1, 1, L.person("point", 5, 2))));

  /* ═ the LabourMarket.ai thread: handshake → terminal gate ═ */
  o.push('<path d="M616 796 Q500 700 330 560 Q240 486 205 420" stroke="url(#thread)" stroke-width="4.6" fill="none" filter="url(#glowF)"/>');
  o.push('<circle cx="460" cy="640" r="4" fill="#ffd9a0" filter="url(#glowF)"/>');
  o.push('<circle cx="330" cy="560" r="3.4" fill="#ffd9a0" filter="url(#glowF)"/>');
  o.push('<circle cx="616" cy="796" r="5.4" fill="' + P.thread + '" filter="url(#glowF)"/>');
  o.push('<circle cx="206" cy="422" r="6.2" fill="' + P.thread + '" opacity="0.85" filter="url(#glowF)"/>');

  /* ═ atmosphere ═ */
  o.push('<rect x="0" y="118" width="1440" height="180" fill="#c4d6dc" opacity="0.16"/>');
  o.push('<rect x="0" y="230" width="1440" height="140" fill="#c4d6dc" opacity="0.08"/>');
  o.push('<rect width="1440" height="900" fill="url(#vign)"/>');

  document.getElementById("s").innerHTML = L.defs() + o.join("");
})();
</script>
</body>
</html>
