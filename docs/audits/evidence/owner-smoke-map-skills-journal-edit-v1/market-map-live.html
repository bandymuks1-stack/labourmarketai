<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Market Map — real OSM/Leaflet evidence</title>
  <!-- Same library + provider the MarketMapLive component uses: Leaflet +
       OpenStreetMap raster tiles (free, no API key). This harness mirrors the
       component (OSM tile layer + the worker's own location marker + radius)
       because the in-app map is behind owner login. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="anonymous" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin="anonymous"></script>
  <style>
    body { margin: 0; background: rgb(2 6 12); font-family: system-ui; padding: 16px; }
    h1 { color: #e2e8f0; font-size: 18px; }
    p { color: #94a3b8; font-size: 13px; }
    #map { height: 440px; width: 100%; border-radius: 10px; overflow: hidden; }
  </style>
</head>
<body>
  <h1>Market Map — real interactive map (Leaflet + OpenStreetMap tiles)</h1>
  <p>Real geography / streets / regions. Marker = the worker's own location (Vilnius, 54.69, 25.28); circle = 25&nbsp;km search radius. No API key, no secret, no fake market points.</p>
  <div id="map" data-testid="market-map-live"></div>
  <script>
    const point = [54.69, 25.28];
    const map = L.map('map', { scrollWheelZoom: false }).setView(point, 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19,
    }).addTo(map);
    L.circle(point, { radius: 25000, color: '#22D3EE', weight: 1, fillColor: '#22D3EE', fillOpacity: 0.12 }).addTo(map);
    L.circleMarker(point, { radius: 7, color: '#0B1014', weight: 2, fillColor: '#22D3EE', fillOpacity: 1 }).addTo(map);
  </script>
</body>
</html>
