<!doctype html><html><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hilversum precision evidence</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<style>body{margin:0;background:rgb(2 6 12);font-family:system-ui;padding:16px}h1{color:#e2e8f0;font-size:17px}
p{color:#94a3b8;font-size:13px}#map{height:440px;width:100%;border-radius:10px;overflow:hidden}
.b{display:inline-block;margin-top:8px;padding:4px 10px;border:1px solid #334155;border-radius:999px;color:#94a3b8;font-size:11px}</style></head>
<body><h1>City precision — Hilversum, NL (manual city)</h1>
<p>resolveCity("NL","Hilversum") = 52.2236, 5.1761 — marker sits ON Hilversum, not the NL country centroid (52.13, 5.29).</p>
<div id="map" data-testid="market-map-live"></div>
<span class="b">Pasirinktas miestas</span>
<script>
const p=[52.2236,5.1761];
const map=L.map('map',{scrollWheelZoom:false}).setView(p,11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',maxZoom:19}).addTo(map);
L.circle(p,{radius:25000,color:'#22D3EE',weight:1,fillColor:'#22D3EE',fillOpacity:0.12}).addTo(map);
L.circleMarker(p,{radius:7,color:'#0B1014',weight:2,fillColor:'#22D3EE',fillOpacity:1}).addTo(map);
</script></body></html>
