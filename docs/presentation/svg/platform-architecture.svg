<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Platformos architektūra — sektoriams neutralus branduolys">
  <style>
    :root{--ink:#0F1319;--paper:#FFFFFF;--panel:#F6F8FB;--panel2:#EEF2F7;--line:#D5DCE6;--muted:#5A6676;--accent:#2F55E6;--steel:#41506A;--verify:#1C9A6A;}
    @media (prefers-color-scheme:dark){:root{--ink:#EAEEF5;--paper:#0A0E14;--panel:#111722;--panel2:#161E2B;--line:#232E3E;--muted:#8894A6;--accent:#5E82FF;--steel:#7286A6;--verify:#3FBE8B;}}
    .t{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
    .m{font-family:ui-monospace,"SF Mono",Consolas,monospace;}
    .k{fill:var(--muted);letter-spacing:.14em;}
    .h{fill:var(--ink);font-weight:700;}
    .lbl{fill:var(--ink);}
    .mut{fill:var(--muted);}
    .card{fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
    .band{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;}
    .ln{stroke:var(--line);stroke-width:1.5;fill:none;}
    .accf{fill:var(--accent);}
  </style>
  <rect width="1200" height="675" fill="var(--paper)"/>
  <text class="m k" x="64" y="66" font-size="13">PLATFORMOS ARCHITEKTŪRA · SEKTORIAMS NEUTRALUS BRANDUOLYS</text>
  <text class="t h" x="64" y="104" font-size="30">Vienas operacinis sluoksnis · daug sektorių, daug rinkų</text>

  <!-- top: inputs (people/skills/evidence) -->
  <g class="t" font-size="15">
    <rect class="card" x="64"  y="150" width="248" height="70" rx="12"/>
    <text class="lbl" x="84" y="186">Žmonės · profiliai</text>
    <text class="m mut" x="84" y="206" font-size="11">daug profesijos kontekstų</text>

    <rect class="card" x="336" y="150" width="248" height="70" rx="12"/>
    <text class="lbl" x="356" y="186">Įgūdžiai · darbo įrodymai</text>
    <text class="m mut" x="356" y="206" font-size="11">deklaruota → ✓ verifikuota</text>

    <rect class="card" x="608" y="150" width="248" height="70" rx="12"/>
    <text class="lbl" x="628" y="186">Dokumentai · prieinamumas</text>
    <text class="m mut" x="628" y="206" font-size="11">kvalifikacijos, statusas</text>

    <rect class="card" x="880" y="150" width="256" height="70" rx="12"/>
    <text class="lbl" x="900" y="186">Įmonių poreikiai</text>
    <text class="m mut" x="900" y="206" font-size="11">projektai · komandos</text>
  </g>

  <!-- connectors to core -->
  <g class="ln">
    <path d="M188 220 V262"/><path d="M460 220 V262"/><path d="M732 220 V262"/><path d="M1008 220 V262"/>
  </g>

  <!-- core engine band -->
  <rect class="band" x="64" y="262" width="1072" height="150" rx="14"/>
  <text class="m k" x="88" y="292" font-size="12">BRANDUOLYS</text>
  <g class="t" font-size="15">
    <rect class="card" x="88"  y="306" width="236" height="86" rx="10"/>
    <text class="h" x="108" y="342" font-size="16">Atitikimas (Matching)</text>
    <text class="m mut" x="108" y="366" font-size="11">paaiškinamas · deterministinis</text>

    <rect class="card" x="344" y="306" width="236" height="86" rx="10"/>
    <text class="h" x="364" y="342" font-size="16">Komunikacija</text>
    <text class="m mut" x="364" y="366" font-size="11">sutikimu grįsta · saugi</text>

    <rect class="card" x="600" y="306" width="236" height="86" rx="10"/>
    <text class="h" x="620" y="342" font-size="16">AI sprendimų pagalba</text>
    <text class="m mut" x="620" y="366" font-size="11">žmogus visada patvirtina</text>

    <rect class="card" x="856" y="306" width="256" height="86" rx="10"/>
    <text class="h" x="876" y="342" font-size="16">Auditas</text>
    <text class="m mut" x="876" y="366" font-size="11">append-only · default-closed</text>
  </g>

  <!-- connectors to sectors -->
  <g class="ln"><path d="M600 412 V456"/></g>
  <circle class="accf" cx="600" cy="412" r="4"/>

  <!-- sectors band -->
  <rect class="band" x="64" y="456" width="1072" height="132" rx="14"/>
  <text class="m k" x="88" y="486" font-size="12">TAS PATS BRANDUOLYS · SKIRTINGI SEKTORIAI</text>
  <g class="t m" font-size="12" fill="var(--ink)">
    <g>
      <rect class="card" x="88"  y="500" width="150" height="70" rx="9"/>
      <text x="104" y="530">Statyba</text><text class="mut" x="104" y="550" font-size="10">pirmasis pilotas</text>
    </g>
    <rect class="card" x="248" y="500" width="130" height="70" rx="9"/><text x="264" y="538">Gamyba</text>
    <rect class="card" x="388" y="500" width="150" height="70" rx="9"/><text x="404" y="538">Logistika</text>
    <rect class="card" x="548" y="500" width="150" height="70" rx="9"/><text x="564" y="538">Energetika</text>
    <rect class="card" x="708" y="500" width="150" height="70" rx="9"/><text x="724" y="538">Priežiūra</text>
    <rect class="card" x="868" y="500" width="130" height="70" rx="9"/><text x="884" y="538">Slauga</text>
    <rect class="card" x="1008" y="500" width="104" height="70" rx="9"/><text x="1024" y="538">Kiti…</text>
  </g>

  <text class="m mut" x="64" y="632" font-size="11">Branduolio funkcijos veikia nepriklausomai nuo profesijos · statyba pažymėta kaip pirmasis pilotas</text>
</svg>
